services:
  relay-queue:
    image: node:22-alpine
    container_name: relay-queue
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      HOST: "0.0.0.0"
      PORT: "3901"
      # POST /stt relays audio to the wyoming-whisper engine, which listens on the
      # *host* (published 10300). From in here loopback is the container itself, so
      # go out through Docker Desktop's host alias.
      STT_HOST: "host.docker.internal"
      STT_PORT: "10300"
      # ...and POST /tts to wyoming-piper on 10200, the same way. Same protocol,
      # same client code in server.js, different port.
      TTS_HOST: "host.docker.internal"
      TTS_PORT: "10200"
      # Where DATA_DIR lives as far as the REST of the machine is concerned.
      # In here it is /app/data; agents run on the host, where it is this. The
      # image routes report the host spelling so an agent handed a picture can
      # actually open the file instead of being sent to a path that exists only
      # inside this container. Must match the data/ bind mount below.
      #
      # This is the WSL spelling of the SAME NTFS directory the Windows side
      # called D:/projects/relay-queue/data - the store did not move, only the
      # name for it did. Agents now run in WSL and cannot open a "D:/..." path
      # at all, so handing them one sent them to a file that, for them, does
      # not exist. /mnt/d is what they can actually open.
      HOST_DATA_DIR: "/mnt/d/projects/relay-queue/data"
    ports:
      # Loopback only. The page has no auth of its own, so the sole way in is
      # relay.hypnodroid.com through the tunnel, where Cloudflare Access checks
      # identity. Publishing on all interfaces used to let anyone on the LAN or
      # Tailscale read and post with no login at all, bypassing Access entirely.
      # Both families are bound on purpose: cloudflared runs network_mode: host,
      # and an origin rule written as "localhost" resolves ::1 before 127.0.0.1 —
      # binding only IPv4 would break the tunnel for that spelling.
      # Loopback only. This page has no login of its own, so the sole way in is
      # relay.hypnodroid.com through the tunnel, where Cloudflare Access checks
      # identity. Published on all interfaces this was readable and postable by
      # anyone on the LAN or Tailscale — and a post here makes agents act.
      #
      # DO NOT narrow this to 127.0.0.1 — tried twice on 2026-08-08, both times it
      # took the page down. cloudflared runs network_mode: host, and on Docker
      # Desktop "host" is the WSL2 VM, not Windows. A 127.0.0.1 publish binds the
      # *Windows* loopback, which that VM cannot reach: `dial tcp 127.0.0.1:3901:
      # connect: connection refused`. Publishing on all interfaces is what makes
      # the origin reachable from the tunnel at all. (The first attempt also hit a
      # second trap: the ingress rule said "localhost", which resolves ::1 first,
      # and Docker Desktop accepts a [::1] publish then refuses connections on it.)
      #
      # So the LAN exposure cannot be closed at this layer. The page has no login
      # of its own, so anyone on the LAN or Tailscale can read it and post — and a
      # post here makes agents act. Fix it in the app instead:
      # .github-drafts/authenticate-the-queue.md
      - "3901:3901"
    volumes:
      # The whole working tree, read-only. Mounting the *directory* rather than
      # individual files is load-bearing: git replaces a file by writing a new one
      # and renaming it over the old, and a single-file bind mount stays pinned to
      # the original inode — the container would never see a pulled change.
      # server.js and public/index.html are both served straight from here, so a
      # git pull is the whole deploy. (This retired the data/ui/index.html copy.)
      #
      # 2026-09-01: this moved from D:/projects/relay-queue to the WSL checkout.
      # Until it did, the WSL tree deployed NOTHING - every edit made there was
      # invisible to the running page, which was still serving the D: copy.
      #
      # EVERY bind-mount source in this file must be a WSL-native path, because
      # compose is now run from WSL and the Linux CLI splits "D:/x:/app" on the
      # FIRST colon: "D" becomes the source and ":/projects/..." the mode, so it
      # dies with `invalid mode`. A Windows-style source is not merely wrong
      # here, it is unparseable. Hence /mnt/d and /mnt/c below.
      - /home/hypnodroid/Projects/relay-queue:/app:ro
      # ...except data/, the writable durable store, shared with the bare-node fallback.
      #
      # THE CHECKOUT MUST CONTAIN AN (empty is fine) data/ DIRECTORY or this
      # container will not start at all. /app is mounted read-only, so runc
      # cannot CREATE the /app/data mountpoint; it can only mount over one that
      # already exists. data/ is gitignored, so a fresh clone does NOT have it -
      # which is exactly how the 2026-09-01 cutover took the page down:
      #   error mounting ... to rootfs at "/app/data": create mountpoint for
      #   /app/data mount: mkdirat ...: read-only file system
      # The D: tree never hit this because its data/ had existed for months.
      # `mkdir -p data` in the checkout is the whole fix.
      # DELIBERATELY still on the NTFS disk: only the CODE mount moved to WSL.
      # Moving code and data in the same cutover is how the conversations and
      # the ~3.6k done tasks get lost, so the store stays exactly where it was
      # and this is just /mnt/d - the same bytes the D: spelling reached.
      - /mnt/d/projects/relay-queue/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3901/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Pulls origin/main into the checkout every minute so the page this machine
  # serves is always the latest merged code. server.js watches its own source and
  # exits when it changes, so a pull deploys itself. Needs no Docker socket.
  # Until the repo is published this idles quietly — there is no origin to fetch.
  relay-queue-sync:
    image: alpine/git:latest
    container_name: relay-queue-sync
    restart: unless-stopped
    working_dir: /repo
    entrypoint: ["/bin/sh"]
    command: ["/repo/tools/sync-repo.sh"]
    environment:
      SYNC_INTERVAL: "60"
      SYNC_BRANCH: "main"
    volumes:
      # Writable: this one is here to update the working tree.
      # Follows the code mount to WSL - a sync sidecar pulling into the D: tree
      # while the server serves the WSL tree would deploy nothing, silently.
      - /home/hypnodroid/Projects/relay-queue:/repo
      # origin is a PRIVATE repo, so the fetch needs a credential. This is a
      # dedicated READ-ONLY DEPLOY KEY for relay-queue alone — not the human's
      # personal key, which can push to everything he owns. GitHub refuses
      # pushes for it, so the worst this container can do with it is read the
      # one repo it already serves. It lives in ~/.ssh on the host and is never
      # committed; only this path references it.
      #
      # `origin`'s URL is deliberately left alone. The key is selected inside
      # the container via GIT_SSH_COMMAND (see tools/sync-repo.sh), so his own
      # pushes from the host still authenticate with his own key as before.
      - /mnt/c/Users/hypnodroid/.ssh/relay_queue_deploy:/keys/deploy_key:ro
      # GitHub's published host keys, verified against api.github.com/meta.
      # This is what makes StrictHostKeyChecking=yes possible: the original
      # breakage was a missing known_hosts, and the shortcut fix would have been
      # to stop checking host keys at all.
      - /mnt/c/Users/hypnodroid/.ssh/github_known_hosts:/keys/known_hosts:ro
