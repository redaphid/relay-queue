        + 'have been filled in afterwards.'));
    }

    /*
     * The same name used by more than one run. The roster keeps only the most
     * recent, so "running" here may be a fresh worker wearing the name of one
     * that already finished — which would otherwise read as a single worker
     * that has been going the whole time, and, if it never finishes, as a
     * ghost holding a worktree.
     */
    if (s.nameCollision) {
      body.appendChild(el('div', 'sublong',
        'This name was used more than once' + (s.spawns > 1 ? ' (' + s.spawns + ' starts)' : '')
        + '. Only the most recent run is shown, so the task and timing above may belong to a different '
        + 'worker than an earlier one of the same name.'));
    }

    if (s.running && s.runningForSec !== null && s.runningForSec >= GHOST_SEC) {
      body.appendChild(el('div', 'sublong',
        'Still running after ' + dur(s.runningForSec) + '. If that is not expected it may have died without '
        + 'saying so — a subagent only stops being "running" here when it reports that it finished, and one '
        + 'that never does may still be holding a git worktree.'));
    }
    row.appendChild(body);
    return row;
  }

  var ACT_VERB = {
    spawned: 'started',
    finished: 'finished',
    tool: 'tool',
    note: 'note',
    worktree: 'worktree'
  };

  function feedLine(e) {
    var line = el('div', 'sline' + (e.ok === false ? ' bad' : ''));
    var verb = ACT_VERB[e.kind] || e.kind || 'activity';
    var head = verb;
    if (e.kind === 'spawned' || e.kind === 'finished') {
      head = (e.subagent || 'a subagent') + ' ' + verb;
      if (e.kind === 'finished') head += e.ok === false ? ' — failed' : e.ok === true ? ' — ok' : ' — outcome not reported';
    } else if (e.kind === 'tool') {
      head = e.tool ? 'tool · ' + e.tool : 'tool';
    }
    line.appendChild(el('div', 'w', head + ' · ' + rel(e.at)));
    var text = e.text || (e.kind === 'spawned' ? e.task : '') || '';
    if (text) line.appendChild(el('div', 't', text));
    return line;
  }

  function renderActivity(a) {
    actBody.textContent = '';
    var frag = document.createDocumentFragment();
    var c = convById(actConv);
    var who = (c && c.agent) || 'This coordinator';

    /*
     * BRANCH ONE, before anything else. No counters are drawn in this state —
     * not even zeroes — because every number the endpoint returns here is an
     * artefact of nothing having been posted, not a measurement of the work.
     */
    if (!a.reporting) {
      var un = el('div', 'shead unknown');
      un.appendChild(el('div', null, 'Not instrumented — no activity is reported here.'));
      un.appendChild(el('div', 'ssub',
        who + ' has never reported any activity, so this panel cannot tell you what it is doing — '
        + 'including whether it is doing anything at all. This is NOT the same as idle: it may be '
        + 'working hard right now. Reporting is opt-in, and nothing has opted in for this conversation.'));
      frag.appendChild(un);

      var how = scard('Why this is empty');
      how.appendChild(el('p', 'snote',
        'Coordinators report subagents and tool calls by posting them to the queue, and most have never '
        + 'been asked to. Until one does, there is nothing to show — so nothing is shown, rather than a '
        + 'row of zeroes that would look like a reading.'));
      /*
       * This state is also reachable BACKWARDS, and it looks alarming if you do
       * not know why: "reporting" is recomputed on every read, and tool calls
       * are memory-only. A coordinator that only ever posted tool calls is
       * reporting one minute and not the next, purely because the server
       * restarted. Nothing has broken, so this does not get an alarm — it gets
       * an explanation.
       */
      how.appendChild(el('p', 'snote',
        'A coordinator that reported only tool calls also lands here after a restart, since tool calls '
        + 'are not kept across one. That is not a fault and nothing was lost — subagent starts and '
        + 'finishes would have survived.'));
      how.appendChild(el('p', 'snote',
        'Whether the agent is alive is a different question, answered by Status — heartbeats and real '
        + 'work are tracked there and do not depend on any of this.'));
      frag.appendChild(how);

      actBody.appendChild(frag);
      return;
    }

    /*
     * BRANCH TWO: this coordinator does report. Now — and only now — quiet is
     * real information, and is allowed to look calm.
     */
    var running = a.running || 0;
    var head = el('div', 'shead ' + (running ? 'ok' : 'idle'));
    head.appendChild(el('div', null, running
      ? running + (running === 1 ? ' subagent running now.' : ' subagents running now.')
      : 'Nothing running right now.'));
    head.appendChild(el('div', 'ssub',
      who + ' does report its activity' + (a.lastAt ? ', last heard ' + relAgo(a.lastAt) : '')
      + '. ' + (running ? '' : 'It has nothing running at the moment — this one really is quiet.')));
    frag.appendChild(head);

    // --- the roster ---
    var roster = a.subagents || [];
    var rc = scard('Subagents');
    if (!roster.length) {
      rc.appendChild(el('div', 'sempty', 'No subagents have been reported in this conversation.'));
    } else {
      for (var i = 0; i < roster.length; i++) rc.appendChild(subagentNode(roster[i]));
    }
    rc.appendChild(el('p', 'snote',
      'Subagent starts and finishes are recorded durably: they survive a server restart, so anything '
      + 'left running stays visible until it says it finished.'));
    frag.appendChild(rc);

    // --- tool calls, always scoped to this server process ---
    var tc = scard('Tool calls');
    srow(tc, 'Recorded since ' + clockOf(a.ephemeralSince), String(a.toolCalls || 0));
    if (a.toolCallsAreEphemeral) {
      tc.appendChild(el('p', 'scaveat',
        'This is a live view, not a total. Tool calls are kept in memory only and reset to zero every '
        + 'time the server restarts — which it does whenever its own code changes. The count above covers '
        + 'only since ' + clockOf(a.ephemeralSince) + ' (' + relAgo(a.ephemeralSince) + '), so a low or '
        + 'zero number here can mean a recent restart rather than an agent that stopped working.'));
    }
    frag.appendChild(tc);

    // --- the feed ---
    var fc = scard('Reported activity');
    if (a.capped) {
      fc.appendChild(el('p', 'scaveat',
        'Truncated. Only the most recent ' + (a.cap || a.count) + ' entries are kept — older activity has '
        + 'been dropped and cannot be recovered. What follows is the end of the story, not all of it.'));
    }
    var entries = a.entries || [];
    if (!entries.length) {
      fc.appendChild(el('div', 'sempty', 'Nothing reported yet.'));
    } else {
      // Already newest-first from the server: a panel opens on what just happened.
      for (var j = 0; j < entries.length && j < 60; j++) fc.appendChild(feedLine(entries[j]));
      /*
       * `count` is the length of the whole feed the server holds; `entries` is
       * what this request actually received. They are different quantities and
       * conflating them would put a confident denominator under a number that
       * does not share it, so each is named for what it is.
       */
      if (entries.length > 60) {
        fc.appendChild(el('p', 'snote', 'Showing the 60 most recent of ' + entries.length + ' loaded'
          + (a.count && a.count !== entries.length ? ', out of ' + a.count + ' held by the server' : '') + '.'));
      }
    }
    frag.appendChild(fc);

    actBody.appendChild(frag);
  }

  /*
   * Unreachable is its own state, and it is emphatically not "quiet". If the
   * panel cannot load, it says so in the loudest register it has, because an
   * empty panel that failed to fetch is indistinguishable from an idle agent —
   * the exact confusion this screen exists to prevent.
   */
  function renderActivityError(msg) {
    actBody.textContent = '';
    var head = el('div', 'shead alarm', 'Could not load activity.');
    head.appendChild(el('div', 'ssub',
      'This panel could not read the activity feed — ' + msg + '. That means it does not know what '
      + 'this coordinator is doing; it does not mean the coordinator is idle.'));
    actBody.appendChild(head);
  }

  function loadActivity() {
    var id = actConv;
    if (!id) return Promise.resolve(false);
    return fetch('/conversations/' + encodeURIComponent(id) + '/activity',
      { headers: { accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        /*
         * The service worker does not intercept this route today — it handles
         * only exactly /thread and /conversations, and everything else goes
         * straight to the network. Checked anyway, because if it ever does
         * start caching /conversations/* the failure is SILENT: a stale roster
         * would arrive as a clean 200 and be reported as current.
         */
        var cached = header(r, 'x-relay-from-cache') === '1';
        return r.json().then(function (j) { return { j: j, cached: cached }; });
      })
      .then(function (got) {
        // A conversation switch mid-flight must not paint the wrong panel.
        if (!actOn || id !== actConv) return false;
        var a = got.j;
        /*
         * THREE STATES, NOT TWO: reporting, not-instrumented, and could-not-ask.
         *
         * A 200 with JSON in it is not proof this is an activity payload. A
         * Cloudflare Access session that has expired answers with a login page,
         * a proxy can answer with anything, and a cache keyed on a different
         * route answers with a different endpoint's body entirely. Every one of
         * those has a falsy `reporting`, and treating falsy as "nobody taught
         * this coordinator to report" would state something confident about the
         * coordinator on the strength of a response that was never about it.
         * That is the impostor this whole panel is built to refuse, so the
         * shape is checked before a single word is drawn.
         */
        if (!a || typeof a.reporting !== 'boolean' || !Array.isArray(a.entries)) {
          renderActivityError('the reply was not an activity report — the session may have expired');
          return false;
        }
        if (got.cached) {
          renderActivityError('that answer came from the saved offline copy, so it cannot be trusted as current');
          return false;
        }
        renderActivity(a);
        return true;
      })
      .catch(function (err) {
        if (!actOn || id !== actConv) return false;
        renderActivityError((err && err.message) || 'network error');
        return false;
      });
  }

  function showActivity() {
    if (!actView) return;
    actConv = activeConv;
    actOn = true;
    actView.hidden = false;
    var c = convById(actConv);
    if (actTitle) actTitle.textContent = 'Activity — ' + ((c && (c.title || c.agent)) || 'this conversation');
    closeDrawer();
    actBody.textContent = '';
    actBody.appendChild(el('div', 'sempty', 'Checking…'));
    loadActivity();
    clearInterval(actTimer);
    actTimer = setInterval(function () { if (actOn && !document.hidden) loadActivity(); }, ACT_MS);
    uiSync();
  }

  function hideActivity() {
    if (!actView || !actOn) return;
    actOn = false;
    actView.hidden = true;
    clearInterval(actTimer);
    actTimer = null;
    uiSync();
  }

  function initActivity() {
    if (actOpenBtn) actOpenBtn.addEventListener('click', showActivity);
    if (actCloseBtn) actCloseBtn.addEventListener('click', hideActivity);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideActivity(); });
  }

  /*
   * ---------------------------------------------------------------- pictures
   *
   * Two views. The lightbox is one picture at full size; the gallery is every
   * picture in the conversation. They are separate because the questions are
   * separate — "is this crate any good" and "what did you make tonight" — and
   * because the lightbox has to be openable from the thread, from the gallery,
   * and from a picture written into a message, without any of them knowing
   * about the others.
   */
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbimg');
  var lbCap = document.getElementById('lbcap');
  var lbWrap = document.getElementById('lbwrap');
  var lbRaw = document.getElementById('lbraw');
  var lbZoom = document.getElementById('lbzoom');
  var lbCloseBtn = document.getElementById('lbclose');
  var lightOn = false;

  function setActual(on) {
    if (!lbWrap || !lbZoom) return;
    if (on) lbWrap.classList.add('actual'); else lbWrap.classList.remove('actual');
    lbZoom.textContent = on ? 'Fit' : 'Actual size';
    lbZoom.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  /*
   * `showLightbox` is called from imageNode, which is defined long before this
   * — safe because these are function declarations, and deliberately so: a
   * picture in the thread must not depend on the order the page happens to be
   * assembled in.
   */
  function showLightbox(url, alt) {
    if (!lightbox || !lbImg || !IMG_URL.test(String(url || ''))) return;
    lightOn = true;
    lightbox.hidden = false;
    lbImg.src = url;
    lbImg.alt = alt || 'image';
    if (lbCap) lbCap.textContent = alt || '';
    // The escape hatch. If anything about this view is wrong, the raw bytes are
    // one tap away in a plain browser tab, where his own pinch-zoom works.
    if (lbRaw) lbRaw.href = url;
    setActual(false);
    uiSync();
  }

  function hideLightbox() {
    if (!lightbox || !lightOn) return;
    lightOn = false;
    lightbox.hidden = true;
    // Dropped so a large contact sheet is not held in memory behind a closed
    // screen; the browser cache makes reopening it free anyway.
    if (lbImg) lbImg.removeAttribute('src');
    uiSync();
  }

  function initLightbox() {
    if (lbCloseBtn) lbCloseBtn.addEventListener('click', hideLightbox);
    /*
     * Tapping the picture toggles between fitted and ACTUAL PIXELS, unsmoothed.
     * This is the whole reason the view exists: a 32-pixel sprite scaled up and
     * interpolated by the browser is a blur, and "grey blob or good crate" is
     * precisely the judgement he is trying to make.
     */
    if (lbImg) lbImg.addEventListener('click', function () {
      setActual(!(lbWrap && lbWrap.classList.contains('actual')));
    });
    if (lbZoom) lbZoom.addEventListener('click', function () {
      setActual(!(lbWrap && lbWrap.classList.contains('actual')));
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideLightbox(); });
  }

  var galView = document.getElementById('galview');
  var galGrid = document.getElementById('galgrid');
  var galTitle = document.getElementById('galtitle');
  var galOpenBtn = document.getElementById('galopen');
  var galCloseBtn = document.getElementById('galclose');
  var galOn = false;
  var galConv = null;

  function renderGallery(data) {
    if (!galGrid) return;
    galGrid.textContent = '';
    var list = (data && data.images) || [];
    if (!list.length) {
      galGrid.appendChild(el('div', 'galempty',
        'No pictures in this conversation yet. An agent adds one by POSTing the bytes to /images.'));
      return;
    }
    for (var i = 0; i < list.length; i++) {
      var im = list[i] || {};
      if (!im.url || !IMG_URL.test(im.url)) continue;
      galGrid.appendChild(imageNode(im.url, im.alt, im.width, im.height));
    }
  }

  function loadGallery() {
    var id = galConv;
    return fetch('/images?conversationId=' + encodeURIComponent(id) + '&limit=200', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (data) {
        if (!galOn || id !== galConv) return; // a switch mid-flight must not paint the wrong grid
        renderGallery(data);
      })
      .catch(function (err) {
        if (!galOn || id !== galConv) return;
        if (!galGrid) return;
        galGrid.textContent = '';
        /*
         * Said out loud, for the same reason the activity panel says it: an
         * empty grid that failed to load is indistinguishable from a
         * conversation with no pictures, and he would conclude the agents made
         * nothing.
         */
        galGrid.appendChild(el('div', 'galempty',
          'Could not read the gallery — ' + ((err && err.message) || 'network error') +
          '. This is not the same as there being no pictures; it means this view does not know.'));
      });
  }

  function showGallery() {
    if (!galView) return;
    galConv = activeConv;
    galOn = true;
    galView.hidden = false;
    var c = convById(galConv);
    if (galTitle) galTitle.textContent = 'Gallery — ' + ((c && (c.title || c.agent)) || 'this conversation');
    closeDrawer();
    if (galGrid) { galGrid.textContent = ''; galGrid.appendChild(el('div', 'galempty', 'Looking…')); }
    loadGallery();
    uiSync();
  }

  function hideGallery() {
    if (!galView || !galOn) return;
    galOn = false;
    galView.hidden = true;
    uiSync();
  }

  function initGallery() {
    if (galOpenBtn) galOpenBtn.addEventListener('click', showGallery);
    if (galCloseBtn) galCloseBtn.addEventListener('click', hideGallery);
    document.addEventListener('keydown', function (e) {
      // Only when the lightbox is not the thing on top; it owns Escape first.
      if (e.key === 'Escape' && !lightOn) hideGallery();
    });
    initLightbox();
  }

  /*
   * ---------------------------------------------------------------- sharing
   *
   * "A public URL that shows this conversation, including links, even when my
   * computer is offline." The last clause is the whole design: this server is
   * that computer, so the share cannot point here. Tapping Publish renders the
   * thread to one self-contained HTML file and uploads it to Cloudflare; the
   * link serves from the edge whether or not this machine is awake.
   *
   * The cost is that it is a SNAPSHOT. Nothing in this panel is allowed to
   * imply otherwise — the button says Publish, the shared state says when it
   * was taken, and Refresh is offered next to it rather than hidden, because
   * "it silently went stale" is the failure mode that would embarrass him in
   * front of whoever he sent it to.
   */
  var shareView = document.getElementById('shareview');
  var shareBody = document.getElementById('sharebody');
  var shareTitle = document.getElementById('sharetitle');
  var shareOpenBtn = document.getElementById('shareopen');
  var shareCloseBtn = document.getElementById('shareclose');
  var shareOn = false;
  var shareConv = null;
  var shareBusy = false;

  function shareWhen(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || '');
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function shareBtn(label, cls, onTap) {
    var b = el('button', 'shbtn' + (cls ? ' ' + cls : ''), label);
    b.type = 'button';
    b.addEventListener('click', onTap);
    return b;
  }

  function shareSay(msg, cls) {
    var n = el('div', cls || 'shnote', msg);
    shareBody.appendChild(n);
    return n;
  }

  /* What is about to become public, named rather than gestured at. */
  function shareFacts(p) {
    var box = el('div', 'shfacts');
    var row = function (k, v) {
      var r = el('div');
      r.appendChild(el('span', null, k));
      r.appendChild(el('span', null, v));
      box.appendChild(r);
    };
    row('Messages', String(p.messages));
    row('Pictures', String(p.images));
    if (p.first) row('From', shareWhen(p.first));
    if (p.last) row('To', shareWhen(p.last));
    if (p.authors && p.authors.length) row('Voices', p.authors.join(', '));
    shareBody.appendChild(box);
  }

  /*
   * The scanner is ADVISORY and says so. He was asked and answered that the
   * warning was enough, so this never blocks and never edits — it only makes
   * the warning specific enough to act on.
   */
  function shareFindings(findings) {
    if (!findings || !findings.length) return;
    var box = el('div', 'shfound');
    box.appendChild(el('b', null, 'Possible secrets in this conversation'));
    var ul = document.createElement('ul');
    for (var i = 0; i < findings.length; i++) {
      var f = findings[i];
      ul.appendChild(el('li', null, f.kind + ' \u00d7' + f.count + (f.example ? ' (' + f.example + ')' : '')));
    }
    box.appendChild(ul);
    box.appendChild(el('div', null,
      'Nothing is removed or hidden. If any of these are real, edit or delete those messages before publishing.'));
    shareBody.appendChild(box);
  }

  function renderShare(data) {
    if (!shareBody) return;
    shareBody.textContent = '';
    var p = (data && data.preflight) || { messages: 0, images: 0, authors: [] };

    if (!data.configured) {
      shareSay('Sharing is not configured on this relay yet: ' + (data.reason || 'unknown reason') +
        '. Add data/share-config.json with the publish endpoint and its token.');
      return;
    }

    if (data.shared && data.share) {
      var s = data.share;
      shareSay('Published \u2014 anyone with this link can read it.', 'shlive');
      var url = el('div', 'shurl', s.url);
      shareBody.appendChild(url);

      shareBody.appendChild(shareBtn('Copy link', 'ghost', function () {
        var done = function () { url.textContent = 'Copied \u2014 ' + s.url; setTimeout(function () { url.textContent = s.url; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(s.url).then(done, function () { done(); });
        } else { done(); }
      }));

      var open = el('a', 'shbtn ghost', 'Open it');
      open.href = s.url;
      open.target = '_blank';
      open.rel = 'noopener noreferrer';
      open.style.display = 'block';
      open.style.lineHeight = '48px';
      open.style.textAlign = 'center';
      open.style.textDecoration = 'none';
      shareBody.appendChild(open);

      shareSay('This is a snapshot taken ' + shareWhen(s.sharedAt) + ' \u2014 ' + s.messages +
        ' message' + (s.messages === 1 ? '' : 's') + ', ' + s.images + ' picture' + (s.images === 1 ? '' : 's') +
        ' embedded in the page. It does NOT update as you keep talking. Tap Refresh to replace it with what the ' +
        'conversation says now; the link stays the same.');

      shareBody.appendChild(shareBtn('Refresh snapshot', null, function () { doShare('POST'); }));
      shareBody.appendChild(shareBtn('Unshare \u2014 take it down', 'danger', function () {
        doShare('DELETE');
      }));
      shareSay('Unsharing deletes the published copy. The link then says it was taken down. ' +
        'Anything already saved or screenshotted by someone else is, of course, out of reach.');
      shareFindings(p.findings);
      return;
    }

    var warn = el('div', 'shwarn');
    warn.appendChild(el('b', null, 'Publishing makes this conversation public.'));
    warn.appendChild(el('div', null,
      'Anyone with the link can read every message, picture and link in it \u2014 no login and no Access check. ' +
      'These threads carry file paths, hostnames and sometimes credentials, and nothing is removed or redacted. ' +
      'The link is unguessable, and you can take it down again at any time.'));
    shareBody.appendChild(warn);

    shareFindings(p.findings);
    shareFacts(p);

    shareSay('It publishes a COPY, frozen at the moment you tap. It will not follow the conversation \u2014 ' +
      'share again later to refresh it. Pictures are embedded in the page, so it still works with this computer off.');

    shareBody.appendChild(shareBtn('Publish publicly', 'publish', function () { doShare('POST'); }));
  }

  function doShare(method) {
    if (shareBusy || !shareConv) return;
    shareBusy = true;
    var id = shareConv;
    var btns = shareBody ? shareBody.querySelectorAll('button') : [];
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
    var opts = { method: method, headers: { accept: 'application/json' } };
    if (method === 'POST') {
      opts.headers['content-type'] = 'application/json';
      opts.body = JSON.stringify({ by: 'phone' });
    }
    fetch('/conversations/' + encodeURIComponent(id) + '/share', opts)
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error((j && j.error) || 'HTTP ' + r.status);
          return j;
        });
      })
      .then(function () {
        shareBusy = false;
        refreshShareBadge();
        if (shareOn && id === shareConv) loadShare();
      })
      .catch(function (err) {
        shareBusy = false;
        if (!shareOn || id !== shareConv) return;
        shareBody.textContent = '';
        shareSay('That did not work \u2014 ' + ((err && err.message) || 'network error') +
          '. Nothing was published. Try again, or check the relay log.', 'shfound');
        shareBody.appendChild(shareBtn('Back', 'ghost', loadShare));
      });
  }

  function loadShare() {
    var id = shareConv;
    return fetch('/conversations/' + encodeURIComponent(id) + '/share', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (data) {
        if (!shareOn || id !== shareConv) return; // a switch mid-flight must not paint the wrong panel
        renderShare(data);
      })
      .catch(function (err) {
        if (!shareOn || id !== shareConv) return;
        if (!shareBody) return;
        shareBody.textContent = '';
        // Said out loud for the same reason the gallery says it: a blank panel
        // that failed to load looks exactly like "not shared", and acting on
        // that would mean publishing a second copy of something already public.
        shareSay('Could not read the share state \u2014 ' + ((err && err.message) || 'network error') +
          '. This is not the same as "not shared"; it means this view does not know.', 'shfound');
      });
  }

  function showShare() {
    if (!shareView) return;
    shareConv = activeConv;
    shareOn = true;
    shareView.hidden = false;
    var c = convById(shareConv);
    if (shareTitle) shareTitle.textContent = 'Share \u2014 ' + ((c && (c.title || c.agent)) || 'this conversation');
    closeDrawer();
    if (shareBody) { shareBody.textContent = ''; shareSay('Looking\u2026'); }
    loadShare();
    uiSync();
  }

  function hideShare() {
    if (!shareView || !shareOn) return;
    shareOn = false;
    shareView.hidden = true;
    uiSync();
  }

  /*
   * Whether the conversation on screen is currently public, shown on the header
   * button itself. Cheap (one request per conversation switch) and it answers
   * the question he would otherwise have to open the panel to ask — including
   * the one that matters, "did that unshare actually take?".
   */
  function refreshShareBadge() {
    var btn = document.getElementById('hshare');
    if (!btn) return Promise.resolve();
    var id = activeConv;
    return fetch('/conversations/' + encodeURIComponent(id) + '/share', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || id !== activeConv) return;
        btn.className = d.shared ? 'on' : '';
        btn.setAttribute('aria-label', d.shared
          ? 'Shared publicly — open sharing'
          : 'Share this conversation');
      })
      .catch(function () { /* the badge is a hint, never a blocker */ });
  }

  function initShare() {
    if (shareOpenBtn) shareOpenBtn.addEventListener('click', showShare);
    if (shareCloseBtn) shareCloseBtn.addEventListener('click', hideShare);
    var hs = document.getElementById('hshare');
    if (hs) hs.addEventListener('click', showShare);
    refreshShareBadge();
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !lightOn) hideShare();
    });
  }

  /*
   * ---------------------------------------------------------------- agents
   *
   * Who is out there, what each is working on, who spawned whom, and who is
   * dead. He could previously reach the four or five coordinators holding a
   * conversation and nothing else, so he talked to middlemen about work he
   * could not see.
   *
   * The artwork is DRAWN HERE, in code, for the same reason icons.js draws the
   * home-screen icons rather than shipping PNGs: it keeps public/ text-only and
   * the pictures reviewable as a diff. A feature that added an image route is
   * not the one that should start committing binaries.
   */
  var AG_ART = {
    /* Alive and reporting: a solid mark. Something measured it. */
    live: { d: 'M12 5a7 7 0 1 1 0 14 7 7 0 0 1 0-14z', rule: 'nonzero' },
    /* Registered and never reported again. A ring: an outline, not a reading. */
    mute: { d: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z', rule: 'evenodd' },
    /*
     * PRESUMED dead — so, a ghost. Not merely a joke: a ghost is exactly the
     * right amount of certainty. It may be wandering about perfectly alive, and
     * one of these did precisely that, coming back an hour later with useful
     * work after being declared dead on far stronger evidence than silence.
     */
    ghost: {
      d: 'M12 2a7 7 0 0 0-7 7v12l2.3-2 2.3 2 2.4-2 2.3 2 2.4-2 2.3 2V9a7 7 0 0 0-7-7z'
        + 'M9.4 9.6a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z'
        + 'M14.6 9.6a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z',
      rule: 'evenodd',
    },
    /* CONFIRMED dead. Something first-hand reported it. A stone, and a grave. */
    stone: {
      d: 'M12 2a6 6 0 0 0-6 6v12h12V8a6 6 0 0 0-6-6z'
        + 'M11 6h2v3h3v2h-3v5h-2v-5H8V9h3V6z'
        + 'M4 21h16v2H4z',
      rule: 'evenodd',
    },
  };

  function agIcon(kind) {
    var art = AG_ART[kind] || AG_ART.mute;
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(ns, 'path');
    p.setAttribute('d', art.d);
    p.setAttribute('fill-rule', art.rule);
    svg.appendChild(p);
    var box = el('span', 'agicon');
    box.appendChild(svg);
    return box;
  }

  var agView = document.getElementById('agview');
  var agBody = document.getElementById('agbody');
  var agYard = document.getElementById('agyard');
  var agTitle = document.getElementById('agtitle');
  var agOpenBtn = document.getElementById('agopen');
  var agCloseBtn = document.getElementById('agclose');
  var agSendBox = document.getElementById('agsend');
  var agToLabel = document.getElementById('agto');
  var agText = document.getElementById('agtext');
  var agSendBtn = document.getElementById('agsendbtn');
  var agMsg = document.getElementById('agmsg');
  var agOn = false;
  var agTo = null;
  var AG_MS = 10000;
  var agTimer = null;

  function agSay(text, bad) {
    if (!agMsg) return;
    agMsg.textContent = text || '';
    agMsg.style.color = bad ? '#b42318' : 'var(--muted)';
  }

  /** Point the composer at one agent. This is the direct line he asked for. */
  function agAddress(name) {
    agTo = name;
    if (agToLabel) agToLabel.textContent = '→ ' + name;
    if (agSendBox) agSendBox.hidden = false;
    agSay('');
    if (agText) { try { agText.focus(); } catch (e) { /* no matter */ } }
  }

  function agSendNow() {
    if (!agTo || !agText) return;
    var text = String(agText.value || '').trim();
    if (!text) { agSay('Nothing to send.'); return; }
    var to = agTo;
    agSay('Sending…');
    fetch('/agents/' + encodeURIComponent(to) + '/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: text, from: 'human' }),
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (r) {
        if (!r.ok) { agSay((r.b && r.b.error) || 'Could not send.', true); return; }
        agText.value = '';
        /*
         * Deliberately not "delivered". The line is in its inbox; whether
         * anything is listening is not something this page can see, and saying
         * otherwise would rebuild the very assumption the ack exists to expose.
         */
        agSay('In ' + to + '’s inbox. It counts as picked up when it acks.');
        loadAgents();
      })
      .catch(function (err) { agSay('Could not send — ' + ((err && err.message) || 'network error'), true); });
  }

  function agRow(a) {
    var kind = a.alive ? (a.everReported ? 'live' : 'mute') : (a.death.certain ? 'stone' : 'ghost');
    var row = el('div', 'agrow ' + (a.alive ? (a.everReported ? 'alive' : 'mute') : 'dead'));
    row.style.paddingLeft = ((a.depth || 0) * 14) + 'px';
    row.appendChild(agIcon(kind));

    var body = el('div', 'agbody');
    body.appendChild(el('div', 'agname', a.name));
    /*
     * The field the whole roster is for. "Not saying" is written out rather
     * than left blank, because a blank line reads as "nothing to do" and this
     * one means "nobody taught it to say".
     */
    body.appendChild(el('div', 'agtask', a.task || 'not saying what it is working on'));

    var bits = [];
    if (a.lastActedAgoSec !== null && a.lastActedAgoSec !== undefined) {
      bits.push((a.everReported ? 'acted ' : 'registered ') + rel(a.lastActedAt));
    }
    if (a.inbox && a.inbox.waiting > 0) bits.push(a.inbox.waiting + ' unread');
    if (a.resumes) bits.push('resumed ' + a.resumes + '×');
    var when = el('div', 'agwhen');
    when.textContent = bits.join(' · ');
    if (a.inbox && a.inbox.waiting > 0) when.className += ' agwait';
    body.appendChild(when);
    row.appendChild(body);

    var btn = el('button', 'agbtn', 'Message');
    btn.type = 'button';
    btn.addEventListener('click', function () { agAddress(a.name); });
    row.appendChild(btn);
    return row;
  }

  function agWalk(nodes, into) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (!n || !n.alive) { if (n && n.children) agWalk(n.children, into); continue; }
      into.appendChild(agRow(n));
      if (n.children && n.children.length) agWalk(n.children, into);
    }
  }

  function stoneFor(a) {
    var presumed = !a.death.certain;
    var box = el('div', 'stone' + (presumed ? ' presumed' : ''));
    box.appendChild(agIcon(presumed ? 'ghost' : 'stone'));
    var body = el('div', 'agbody');
    body.appendChild(el('div', 'agname', a.name));
    body.appendChild(el('div', 'agtask', a.task || 'nobody recorded what it was doing'));
    /*
     * Confirmed and presumed are worded as differently as they are rendered.
     * The inference must read as an inference even to someone skimming.
     */
    body.appendChild(el('div', 'stonehow', presumed
      ? 'presumed — ' + (a.death.because || 'it went quiet') + '. ' +
        (a.death.meaning || 'not working right now — not necessarily gone')
      : 'confirmed — ' + (a.death.because || 'it finished') +
        (a.death.at ? ', ' + rel(a.death.at) : '')));
    if (a.death.lastWords) {
      var said = el('div', 'stonesaid');
      said.textContent = '“' + a.death.lastWords + '”';
      body.appendChild(said);
    }
    box.appendChild(body);
    /*
     * THE WAY BACK OUT. Without it a headstone is permanent, and a resurrected
     * agent is in the graveyard and working at the same time — a contradiction
     * this page would be presenting as fact. A presumed death needs no button:
     * it is derived, so it lifts the moment the agent does anything.
     */
    if (!presumed) {
      var up = el('button', 'agbtn', 'It’s alive');
      up.type = 'button';
      up.addEventListener('click', function () {
        fetch('/agents/' + encodeURIComponent(a.name) + '/exhume', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ note: 'exhumed from the page' }),
        }).then(loadAgents).catch(function () { agSay('Could not exhume it.', true); });
      });
      box.appendChild(up);
    } else {
      var poke = el('button', 'agbtn', 'Poke');
      poke.type = 'button';
      poke.addEventListener('click', function () { agAddress(a.name); });
      box.appendChild(poke);
    }
    return box;
  }

  function renderAgents(data) {
    if (!agBody || !agYard) return;
    agBody.textContent = '';
    agYard.textContent = '';
    var tree = (data && data.tree) || [];
    var living = (data && data.living) || 0;

    if (!tree.length) {
      agBody.appendChild(el('div', 'galempty',
        'No agent has registered yet. An agent joins by POSTing its chosen name to /agents.'));
    } else {
      agBody.appendChild(el('div', 'agsec',
        living === 1 ? '1 agent working' : living + ' agents working'));
      agWalk(tree, agBody);
      if (!agBody.querySelector('.agrow')) {
        agBody.appendChild(el('div', 'galempty', 'Everyone who registered is in the graveyard.'));
      }
    }

    var yard = (data && data.graveyard) || [];
    agYard.appendChild(el('div', 'agsec', 'Graveyard'));
    if (!yard.length) {
      agYard.appendChild(el('div', 'yardempty', 'Nobody has died yet. Long may it continue.'));
      return;
    }
    /*
     * Said out loud, above the stones: the two kinds of death are counted
     * apart and must never be added together. One is a report; the other is a
     * guess this page has been wrong about before.
     */
    var conf = data.confirmedDead || 0;
    var pres = data.presumedDead || 0;
    agYard.appendChild(el('div', 'stonehow',
      conf + ' confirmed · ' + pres + ' presumed after ' + (data.presumedAfterMin || 0) +
      ' min of silence. A presumed stone is a guess, not a finding.'));
    for (var i = 0; i < yard.length; i++) agYard.appendChild(stoneFor(yard[i]));
  }

  function loadAgents() {
    return fetch('/agents', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (data) { if (agOn) renderAgents(data); })
      .catch(function (err) {
        if (!agOn || !agBody) return;
        agBody.textContent = '';
        if (agYard) agYard.textContent = '';
        /*
         * An empty roster that failed to load is indistinguishable from having
         * no agents, and he would conclude nobody is working. Say which it is.
         */
        agBody.appendChild(el('div', 'galempty',
          'Could not read the roster — ' + ((err && err.message) || 'network error') +
          '. That is not the same as there being nobody out there; it means this view does not know.'));
      });
  }

  function showAgents() {
    if (!agView) return;
    agOn = true;
    agView.hidden = false;
    if (agTitle) agTitle.textContent = 'Agents';
    closeDrawer();
    if (agBody) { agBody.textContent = ''; agBody.appendChild(el('div', 'galempty', 'Looking…')); }
    loadAgents();
    clearInterval(agTimer);
    agTimer = setInterval(function () { if (agOn && !document.hidden) loadAgents(); }, AG_MS);
    uiSync();
  }

  function hideAgents() {
    if (!agView || !agOn) return;
    agOn = false;
    agView.hidden = true;
    clearInterval(agTimer);
    agTimer = null;
    uiSync();
  }

  function initAgents() {
    if (agOpenBtn) agOpenBtn.addEventListener('click', showAgents);
    if (agCloseBtn) agCloseBtn.addEventListener('click', hideAgents);
    if (agSendBtn) agSendBtn.addEventListener('click', agSendNow);
    if (agText) agText.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); agSendNow(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !lightOn) hideAgents();
    });
  }

  /*
   * ---------------------------------------------------------------- alerts
   *
   * Three ways to get his attention, each a fallback for the one above:
   *   1. web push          — reaches him with the tab closed. The real answer.
   *   2. vibration         — only while the page is open, which is exactly when
   *                          he needs it least, so it is a fallback and not the
   *                          feature.
   *   3. the hamburger dot — what already existed. Never made worse.
   *
   * Permission is requested on a deliberate tap and nowhere else. A prompt
   * fired on page load gets dismissed reflexively, and a denied permission is
   * a dead feature that cannot be revived from inside the page.
   */
  var DEVICE_KEY = 'relay.device';
  // Must match public/sw.js. Duplicated on purpose: the worker cannot import
  // from the page, and a shared file would mean shipping a third asset.
  var VIBE = {
    'needs-you': [0, 100, 70, 100, 70, 300],
    done: [0, 50, 90, 50],
    broken: [0, 300, 100, 300, 100, 300]
  };
  var notifyBody = document.getElementById('notifybody');
  var pushSnap = null;   // last /push/config response
  var pushReg = null;    // ServiceWorkerRegistration, once we have one
  var nEls = null;       // built once, then only its text is updated
  var nBusy = false;

  function notifPermission() {
    try { return window.Notification ? window.Notification.permission : 'unsupported'; }
    catch (e) { return 'unsupported'; }
  }
  function pushCapable() {
    return !!(window.Notification && navigator.serviceWorker && window.PushManager && window.isSecureContext);
  }
  function canVibrate() { return !!(navigator && typeof navigator.vibrate === 'function'); }
  function armedHere() { return !!(pushSnap && pushSnap.subscribedHere) && notifPermission() === 'granted'; }

  function deviceId() {
    var id = pref(DEVICE_KEY);
    if (!id) {
      id = 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      pref(DEVICE_KEY, id);
    }
    return id;
  }

  function b64ToBytes(s) {
    var pad = '='.repeat((4 - (s.length % 4)) % 4);
    var raw = window.atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  /** Buzz with the pattern for a category, if this browser can. */
  function buzz(category) {
    if (!canVibrate()) return false;
    try { return navigator.vibrate(VIBE[category] || VIBE.done); } catch (e) { return false; }
  }

  /*
   * A reply landed while the page is open. If push is armed the service worker
   * is already buzzing for it, so doing it here too would double-buzz for one
   * event. This is the degradation path, not a parallel one.
   */
  function signalArrival(e) {
    if (armedHere()) return;
    if (e && e.conversationId && e.conversationId !== activeConv) return;
    buzz('done');
  }

  function pushFetch(path, opts) {
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function loadPushConfig() {
    return pushFetch('/push/config?deviceId=' + encodeURIComponent(deviceId()), { cache: 'no-store' })
      .then(function (j) { pushSnap = j; renderNotify(); return j; })
      .catch(function () { renderNotify(); return null; });
  }

  function saveConfig(patch) {
    patch.deviceId = deviceId();
    return pushFetch('/push/config', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch)
    }).then(function (j) { pushSnap = j; renderNotify(); }).catch(function (err) {
      if (nEls) nEls.note.textContent = 'Could not save: ' + err.message;
    });
  }

  /*
   * The deliberate tap. Order matters: ask for permission first so a refusal
   * costs nothing, and only then register the worker and subscribe.
   */
  function armPush() {
    if (nBusy) return;
    nBusy = true;
    nEls.note.textContent = 'Asking this browser for permission…';
    renderNotify();
    var perm;
    try { perm = window.Notification.requestPermission(); } catch (e) { perm = null; }
    // Older Firefox hands back a callback API rather than a promise.
    Promise.resolve(perm && perm.then ? perm : new Promise(function (ok) { window.Notification.requestPermission(ok); }))
      .then(function (state) {
        if (state !== 'granted') throw new Error(state === 'denied'
          ? 'Notifications are blocked for this site. Turn them back on in the browser’s site settings, then tap again.'
          : 'Permission was dismissed. Tap again when you are ready.');
        return navigator.serviceWorker.register('/sw.js', { scope: '/' });
      })
      .then(function (reg) { pushReg = reg; return navigator.serviceWorker.ready; })
      .then(function (reg) {
        pushReg = reg || pushReg;
        return pushReg.pushManager.getSubscription().then(function (existing) {
          if (existing) return existing;
          if (!pushSnap || !pushSnap.vapidPublicKey) throw new Error('the server has no push key');
          return pushReg.pushManager.subscribe({
            userVisibleOnly: true, // required, and honoured: every push shows a notification
            applicationServerKey: b64ToBytes(pushSnap.vapidPublicKey)
          });
        });
      })
      .then(function (sub) {
        var j = sub.toJSON();
        return pushFetch('/push/subscribe', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            endpoint: j.endpoint, keys: j.keys, deviceId: deviceId(), ua: navigator.userAgent
          })
        });
      })
      .then(function () { nEls.note.textContent = 'Armed. Send a test to feel it.'; return loadPushConfig(); })
      .catch(function (err) {
        nEls.note.textContent = err.message || String(err);
        logClient('push-arm-failed', { message: (err && err.message) || String(err) });
        return loadPushConfig();
      })
      .then(function () { nBusy = false; renderNotify(); });
  }

  function disarmPush() {
    if (nBusy) return;
    nBusy = true;
    nEls.note.textContent = 'Turning alerts off for this browser…';
    var done = function () {
      return pushFetch('/push/unsubscribe', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ deviceId: deviceId() })
      });
    };
    Promise.resolve(navigator.serviceWorker ? navigator.serviceWorker.getRegistration() : null)
      .then(function (reg) { return reg ? reg.pushManager.getSubscription() : null; })
      .then(function (sub) { return sub ? sub.unsubscribe() : null; })
      .then(done, done)
      .catch(function () { /* the server row is what matters; it is gone either way */ })
      .then(function () { nEls.note.textContent = 'Alerts are off for this browser.'; return loadPushConfig(); })
      .then(function () { nBusy = false; renderNotify(); });
  }

  function testPush() {
    if (nBusy) return;
    nBusy = true;
    nEls.note.textContent = 'Sending a test…';
    renderNotify();
    pushFetch('/push/test', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ category: 'done' })
    }).then(function (j) {
      nEls.note.textContent = j.delivered
        ? ('Sent to ' + j.delivered + ' browser' + (j.delivered === 1 ? '' : 's') + '. It should arrive in a moment.'
           + (j.sentDuringQuietHours ? ' (Quiet hours are on: a real alert would have been held back.)' : ''))
        : 'The push service accepted nothing. Check the device list above.';
    }).catch(function (err) {
      nEls.note.textContent = 'Test failed: ' + err.message;
    }).then(function () { nBusy = false; renderNotify(); });
  }

  function buildNotifyUi() {
    if (!notifyBody || nEls) return;
    var card = scard('Alerts');
    var state = el('div', 'nstate');
    state.appendChild(el('span', 'dot'));
    var stateText = el('span', null, '');
    state.appendChild(stateText);
    card.appendChild(state);

    var arm = el('button', 'nbtn primary', 'Alert me on this phone');
    arm.type = 'button';
    arm.addEventListener('click', function () { armedHere() ? disarmPush() : armPush(); });
    card.appendChild(arm);

    var test = el('button', 'nbtn', 'Send a test alert');
    test.type = 'button';
    test.addEventListener('click', testPush);
    card.appendChild(test);

    var note = el('p', 'snote', '');
    card.appendChild(note);

    // ---- what each buzz means
    var kinds = scard('What the buzzes mean');
    var boxes = {};
    [['needs-you', 'Something needs your answer', 'two taps, then a long one'],
     ['done', 'Something finished', 'two light taps'],
     ['broken', 'Something is broken', 'three long pulses']].forEach(function (c) {
      var row = el('div', 'nrow');

        cats[c[0]] = cb.checked;

      });

      lab.addEventListener('click', function () { buzz(c[0]); });
      row.appendChild(cb);
      row.appendChild(lab);
      kinds.appendChild(row);
      boxes[c[0]] = cb;
    });

    // ---- quiet hours
    var quiet = scard('Quiet hours');
    var fromRow = el('div', 'nrow');
    var fromLab = el('label', null, 'Silent from');
    var from = el('input');
    from.type = 'time';
    from.id = 'nquietfrom';
    fromLab.setAttribute('for', from.id);
    fromRow.appendChild(fromLab);
    fromRow.appendChild(from);
    quiet.appendChild(fromRow);

    var toRow = el('div', 'nrow');
    var toLab = el('label', null, 'until');
    var to = el('input');
    to.type = 'time';
    to.id = 'nquietto';
    toLab.setAttribute('for', to.id);
    toRow.appendChild(toLab);
    toRow.appendChild(to);
    quiet.appendChild(toRow);

    var save = el('button', 'nbtn', 'Save quiet hours');
    save.type = 'button';
    save.addEventListener('click', function () {
      saveConfig({ quietFrom: from.value || null, quietTo: to.value || null });
    });
    quiet.appendChild(save);

    var brRow = el('div', 'nrow');
    var br = el('input');
    br.type = 'checkbox';
    br.id = 'nbreakthrough';
    var brLab = el('label', null, 'Let "something is broken" through anyway');
    brLab.setAttribute('for', br.id);
    br.addEventListener('change', function () { saveConfig({ brokenOverridesQuiet: br.checked }); });
    brRow.appendChild(br);
    brRow.appendChild(brLab);
    quiet.appendChild(brRow);

    // The timezone in force, stated outright. He changes timezone this week,
    // and quiet hours that silently run on the wrong clock protect nobody.
    var tz = el('p', 'ntz', '');
    quiet.appendChild(tz);
    var useTz = el('button', 'nbtn', '');
    useTz.type = 'button';
    useTz.hidden = true;
    useTz.addEventListener('click', function () { saveConfig({ timezone: phoneZone() }); });
    quiet.appendChild(useTz);

    /*
     * ---- reading offline, and the way out of it
     *
     * The button is the point of this card. Caching the app of a project whose
     * checkout is its deployment is a calculated risk, and the calculation only
     * works if there is a way out that does not involve a laptop: no phone
     * browser gives him a "clear this site's service worker" he could find
     * while abroad. Network-first should mean he never needs this. It is here
     * because "should" is not a recovery plan.
     */
    var off = scard('Reading offline');
    off.appendChild(el('p', 'snote',
      'Messages are saved on this phone as you read them, so the thread still opens with no ' +
      'signal. Sending always needs a connection.'));
    var forget = el('button', 'nbtn', 'Forget saved messages');
    forget.type = 'button';
    forget.addEventListener('click', forgetOffline);
    off.appendChild(forget);

    notifyBody.appendChild(card);
    notifyBody.appendChild(kinds);
    notifyBody.appendChild(quiet);
    notifyBody.appendChild(off);
    nEls = { state: state, stateText: stateText, arm: arm, test: test, note: note,
             boxes: boxes, from: from, to: to, br: br, tz: tz, useTz: useTz, forget: forget };
  }

  function phoneZone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; }
  }

  function renderNotify() {
    if (!nEls) return;
    var perm = notifPermission();
    var cls = 'nstate';
    var text;
    if (!pushCapable()) {
      cls += ' warn';
      text = canVibrate()
        ? 'This browser cannot do push. It will buzz while the page is open.'
        : 'This browser cannot do push or vibrate. The menu dot is the only signal.';
    } else if (perm === 'denied') {
      cls += ' warn';
      text = 'Blocked in this browser’s settings. It will buzz while the page is open.';
    } else if (armedHere()) {
      cls += ' on';
      text = 'On for this browser — alerts reach you with the tab closed.';
    } else {
      text = 'Not set up in this browser.';
    }
    nEls.state.className = cls;
    nEls.stateText.textContent = text;
    nEls.arm.textContent = armedHere() ? 'Turn alerts off for this browser' : 'Alert me on this phone';
    nEls.arm.disabled = nBusy || !pushCapable();
    nEls.test.disabled = nBusy || !pushSnap || !pushSnap.devices || pushSnap.devices.length === 0;

    if (!pushSnap) return;
    for (var k in nEls.boxes) {
      if (Object.prototype.hasOwnProperty.call(nEls.boxes, k)) {
        nEls.boxes[k].checked = pushSnap.categories ? pushSnap.categories[k] !== false : true;
      }
    }
    var q = pushSnap.quiet || {};
    if (document.activeElement !== nEls.from) nEls.from.value = q.from || '';
    if (document.activeElement !== nEls.to) nEls.to.value = q.to || '';
    nEls.br.checked = !!pushSnap.brokenOverridesQuiet;

    var tzText = 'Times are in ' + (q.timezone || 'UTC') + ', where it is now ' + (q.zoneNow || '??:??') + '.';
    if (!q.zoneKnown) tzText += ' This server does not know "' + q.requestedTimezone + '", so it is using UTC.';
    if (q.configured) {
      tzText += q.active
        ? ' Quiet now — ends in ' + humanMin(q.changesInMin) + '.'
        : ' Quiet starts in ' + humanMin(q.changesInMin) + '.';
    } else {
      tzText += ' No quiet hours set.';
    }
    nEls.tz.textContent = tzText;

    var mine = phoneZone();
    var mismatch = mine && q.timezone && mine !== q.timezone;
    nEls.useTz.hidden = !mismatch;
    if (mismatch) nEls.useTz.textContent = 'This phone is in ' + mine + ' — use that instead';
