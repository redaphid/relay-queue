<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>relay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='13'%20fill='%232f6fed'/%3E%3C/svg%3E">
<style>
  /*
   * Colour, on purpose.
   *
   * Two independent palettes, kept apart so neither can be mistaken for the other:
   *
   *   1. The PLAYFUL one — a per-conversation hue (`--hue`, set from JS by
   *      hashing the conversation id) plus a rainbow used as an accent only:
   *      the header rule, the send button, active controls. Never message text.
   *      Because the hue is derived from the id, the colour is information —
   *      it tells you at a glance which conversation you are in.
   *
   *   2. The SEMANTIC one — lifecycle (pending/claimed/answered) and trouble
   *      (offline/recording/error). These are FIXED. They never follow the
   *      conversation hue, because "nothing is responding" must never come out
   *      looking festive, and a message's state must mean the same thing in
   *      every conversation.
   *
   * Lifecycle states carry a glyph as well as a colour: hue alone is not
   * information anyone can rely on.
   */
  :root {
    --hue: 217; --hue2: 267;   /* overwritten per conversation */
    --bg:#f4f6f8; --fg:#14161a; --muted:#667085; --line:#dfe3e8; --panel:#ffffff;
    --accent: hsl(var(--hue) 78% 48%);
    --accent-soft: hsl(var(--hue) 78% 48% / .10);
    --accent-grad: linear-gradient(135deg, hsl(var(--hue) 84% 54%), hsl(var(--hue2) 76% 56%));
    --user-bg: var(--accent); --user-fg:#ffffff;
    --agent-bg:#ffffff; --agent-fg:#14161a;
    --err-fg:#8a2018; --err-bg:#fdeceb; --off:#c2410c; --rec:#c0271d;
    /* Lifecycle pills: dark text on a light fill in both themes, so contrast
       never depends on which one is active. */
    --pend-bg:#fde68a; --pend-fg:#5c3d00;
    --claim-bg:#ddd6fe; --claim-fg:#3b1d72;
    --done-bg:#a7f3d0; --done-fg:#053f2c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1116; --fg:#e6e8ec; --muted:#98a2b3; --line:#242a35; --panel:#141922;
      --accent: hsl(var(--hue) 80% 62%);
      --accent-soft: hsl(var(--hue) 80% 62% / .16);
      --accent-grad: linear-gradient(135deg, hsl(var(--hue) 72% 52%), hsl(var(--hue2) 66% 54%));
      --user-bg: var(--accent); --user-fg:#08111f;
      --agent-bg:#1a202b; --agent-fg:#e6e8ec;
      --err-fg:#ffb4ab; --err-bg:#3a1714; --off:#fdba74; --rec:#e5484d;
      --pend-bg:#facc15; --pend-fg:#3a2800;
      --claim-bg:#c4b5fd; --claim-fg:#2a1157;
      --done-bg:#6ee7b7; --done-fg:#04301f;
    }
  }
  /* The one unapologetically rainbow thing: a 3px rule under the header. */
  @keyframes drift { to { background-position: 200% 0; } }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  header {
    position: relative;
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 14px calc(10px);
    padding-top: calc(10px + env(safe-area-inset-top));
    background:
      linear-gradient(var(--accent-soft), var(--accent-soft)),
      var(--panel);
    border-bottom: 1px solid var(--line);
  }
  /* Playful, but three pixels of it. Slow enough to be a background detail. */
  header::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
    background: linear-gradient(90deg,
      #f43f5e, #f59e0b, #facc15, #22c55e, #06b6d4, #6366f1, #a855f7, #f43f5e);
    background-size: 200% 100%;
    animation: drift 18s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    header::after { animation: none; background-size: 100% 100%; }
  }
  header b {
    font-size: 16px; font-weight: 650; letter-spacing: .01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #menu {
    position: relative; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; margin-left: -6px; padding: 0;
    color: var(--fg); background: transparent;
    border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #menu svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  /* Something happened in a conversation you are not looking at. */
  #menudot {
    display: none; position: absolute; top: 6px; right: 6px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--rec);
  }
  #menudot.show { display: block; }

  /* ---- the conversation drawer ---- */
  #drawer { position: fixed; inset: 0; z-index: 20; }
  #drawer[hidden] { display: none; }
  #scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .18s ease; }
  #drawer.open #scrim { opacity: 1; }
  #panel {
    position: absolute; inset: 0 auto 0 0;
    width: min(86vw, 340px);
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform .18s ease;
    overflow-y: auto; overscroll-behavior: contain;
  }
  #drawer.open #panel { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    #scrim, #panel { transition: none; }
  }
  .prow { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; }
  .prow b { font-size: 15px; }
  #drawerclose {
    margin-left: auto; flex: 0 0 auto;
    width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent;
    border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #newtitle {
    flex: 1 1 auto; min-width: 0;
    font-family: inherit; font-size: 16px;
    min-height: 44px; padding: 8px 12px;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px;
  }
  #newconv {
    flex: 0 0 auto; width: 44px; height: 44px;
    font-family: inherit; font-size: 24px; line-height: 1;
    color: #fff; background: var(--accent-grad);
    border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #newconv:disabled { opacity: .5; }
  #converr {
    display: none; margin: 0 4px 8px; padding: 8px 10px; font-size: 14px;
    color: var(--err-fg); background: var(--err-bg); border-radius: 10px;
  }
  #converr.show { display: block; }
  #convlist { display: flex; flex-direction: column; gap: 4px; }
  .conv {
    display: block; width: 100%; min-height: 48px;
    padding: 10px 12px; margin: 0;
    font: inherit; text-align: left; color: var(--fg);
    background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .conv { border-left: 4px solid transparent; }
  .conv.active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--line); }
  .convtop { display: flex; align-items: baseline; gap: 6px; }
  .convname {
    flex: 1 1 auto; min-width: 0; font-weight: 650; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .conv.active .convname { color: var(--accent); }
  .convwhen { flex: 0 0 auto; font-size: 12px; color: var(--muted); }
  .convdot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
  .convsnip {
    margin-top: 2px; font-size: 13px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .convmeta { margin-top: 3px; font-size: 12px; color: var(--off); }
  /* Sparkline: tall enough to read on a phone, no gridlines, no labels. */
  .spark {
    display: flex; align-items: flex-end; gap: 2px;
    height: 24px; margin-top: 8px;
  }
  .spark i { flex: 1 1 0; min-width: 0; background: var(--line); border-radius: 1px 1px 0 0; }
  /* Empty reads as a deliberate flat baseline, never as a broken empty box. */
  .spark.quiet i { background: var(--line); opacity: .8; }
  .convagent { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; font-size: 12px; }
  .convagent .adot { flex: 0 0 auto; font-size: 11px; }
  .convagent.watching { color: #1a7f4b; }
  .convagent.idle { color: var(--muted); }
  .convagent.stale { color: var(--off); }
  /* Beating but not acting. This used to render as the healthiest row here. */
  .convagent.stuck { color: var(--rec); font-weight: 700; }
  /* The one thing this list most needs to shout. Not hue alone: it also says
     "NOT RESPONDING" and swaps the glyph for an exclamation mark. */
  .convagent.silent { color: var(--rec); font-weight: 700; }
  .convagent.never, .convagent.unassigned { color: var(--muted); }
  @media (prefers-color-scheme: dark) { .convagent.watching { color: #4ade80; } }
  #statusopen {
    margin-top: 12px; width: 100%; min-height: 48px;
    font: inherit; font-size: 15px; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }

  /* ---- the status view ---- */
  #statusview {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  }
  #statusview[hidden] { display: none; }
  #statusclose {
    margin-left: auto; width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  /* The headline answers "is it alive?" without scrolling or interpretation. */
  .shead {
    padding: 16px; margin-bottom: 12px;
    font-size: 19px; line-height: 1.35; font-weight: 650;
    border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
  }
  .shead.ok    { color: #1a7f4b; border-color: #1a7f4b55; background: #1a7f4b12; }
  #statusopen { border-left: 4px solid transparent; border-image: linear-gradient(180deg, #f43f5e, #facc15, #22c55e, #6366f1) 1 / 0 0 0 4px; }
  .shead.idle  { color: var(--muted); }
  .shead.warn  { color: var(--off); border-color: currentColor; background: #c2410c12; }
  .shead.alarm { color: var(--rec); border-color: currentColor; background: #c0271d14; }
  .ssub { margin-top: 6px; font-size: 14px; font-weight: 400; opacity: .85; }
  @media (prefers-color-scheme: dark) { .shead.ok { color: #4ade80; border-color: #4ade8055; } }

  .scard {
    padding: 12px 14px; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .scard h2 { margin: 0 0 8px; font-size: 13px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }
  .srow { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; font-size: 15px; }
  .srow .k { flex: 1 1 auto; min-width: 0; color: var(--muted); }
  .srow .v { flex: 0 0 auto; text-align: right; }
  .srow .v.bad { color: var(--rec); }
  .srow .v.good { color: #1a7f4b; }
  @media (prefers-color-scheme: dark) { .srow .v.good { color: #4ade80; } }
  .sline { padding: 6px 0; font-size: 14px; border-top: 1px solid var(--line); }
  .sline:first-of-type { border-top: 0; }
  .sline .w { color: var(--muted); font-size: 12px; }
  .sline .t { overflow-wrap: anywhere; }
  .snote { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .sempty { font-size: 15px; color: var(--muted); }
  /* ---- alerts: web push, quiet hours, and what is actually armed ---- */
  .nbtn {
    display: block; width: 100%; min-height: 48px; margin-top: 8px; padding: 0 14px;
    font: inherit; font-size: 15px; color: var(--fg); text-align: left;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .nbtn.primary { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .nbtn[disabled] { opacity: .5; cursor: default; }
  /* The one line that answers "is this browser armed?" — stated, never implied. */
  .nstate { display: flex; gap: 8px; align-items: baseline; font-size: 15px; padding: 2px 0 6px; }
  .nstate .dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .nstate.on .dot { background: #1a7f4b; }
  .nstate.warn .dot { background: var(--rec); }
  @media (prefers-color-scheme: dark) { .nstate.on .dot { background: #4ade80; } }
  .nrow { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 15px; }
  .nrow label { flex: 1 1 auto; min-width: 0; }
  .nrow input[type="time"], .nrow select {
    font: inherit; font-size: 15px; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 44px;
    -webkit-appearance: none; appearance: none; max-width: 58%;
  }
  .nrow input[type="checkbox"] { flex: 0 0 auto; width: 22px; height: 22px; accent-color: var(--accent); }
  .ntz { font-size: 13px; color: var(--muted); margin: 6px 0 0; overflow-wrap: anywhere; }
  .ntz b { color: var(--fg); font-weight: 600; }
  #conn { margin-left: auto; font-size: 13px; color: var(--off); display: none; }
  #conn.show { display: inline; }
  /* Speaker toggle: mutes spoken replies independently of the microphone. */
  #spk {
    position: relative; margin-left: auto;
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #conn.show + #spk { margin-left: 8px; }
  #spk svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
  #spk.on { color: var(--accent); border-color: var(--accent); }
  /* Muted is drawn struck through, the same language the blocked mic uses. */
  #spk:not(.on)::after {
    content: ''; position: absolute; left: 9px; top: 19px;
    width: 21px; height: 2px; border-radius: 2px;
    background: currentColor; transform: rotate(-45deg);
  }
  #spk.busy { color: var(--rec); border-color: var(--rec); }

  #thread {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 14px 12px 6px;
  }
  #empty { color: var(--muted); text-align: center; margin: 32px 12px; font-size: 15px; }

  .msg { max-width: 86%; margin: 0 0 12px; padding: 10px 13px; border-radius: 17px; }
  /* Blocks bring their own spacing now that the body is rendered Markdown, so
     `pre-wrap` would double every gap. Single newlines inside a paragraph are
     kept as <br> by the renderer, which is what preserves dictated line breaks. */
  .msg .body { white-space: normal; overflow-wrap: anywhere; word-break: break-word; }

  /* ---- rendered Markdown ------------------------------------------------ */
  .msg .body > :first-child { margin-top: 0; }
  .msg .body > :last-child { margin-bottom: 0; }
  .mdp { margin: 0 0 8px; }
  .mdh { margin: 10px 0 6px; font-weight: 700; line-height: 1.3; }
  .mdh1 { font-size: 19px; } .mdh2 { font-size: 17px; } .mdh3 { font-size: 16px; }
  .mdh4, .mdh5, .mdh6 { font-size: 15px; }
  .mdlist, .mdtasks { margin: 0 0 8px; padding-left: 22px; }
  .mdtasks { list-style: none; padding-left: 0; }
  .mdlist li { margin: 2px 0; }
  .mdquote {
    margin: 0 0 8px; padding: 2px 0 2px 10px;
    border-left: 3px solid var(--line); opacity: .85;
  }
  .msg .body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .92em; padding: 1px 5px; border-radius: 6px;
    background: rgba(127, 127, 127, .18);
  }
  .msg .body pre {
    margin: 0 0 8px; padding: 9px 11px; border-radius: 11px;
    overflow-x: auto; background: rgba(127, 127, 127, .16);
  }
  .msg .body pre code { padding: 0; background: none; white-space: pre; }
  .msg .body a { color: inherit; text-underline-offset: 2px; }

  /* ---- checklists -------------------------------------------------------
     The reason markdown is here at all. Rows are big enough to hit with a
     thumb: 44px is the smallest target that reliably works on a phone, and
     this list is read while walking around a bedroom holding a suitcase. */
  .mdtask {
    display: flex; align-items: flex-start; gap: 10px;
    margin: 0; padding: 5px 0; min-height: 34px;
  }
  .mdtask label {
    display: flex; align-items: flex-start; gap: 10px;
    flex: 1 1 auto; min-width: 0; cursor: pointer;
    padding: 4px 0; /* pads the row out to a comfortable target */
  }
  .mdtask input[type="checkbox"] {
    flex: 0 0 auto; width: 22px; height: 22px; margin: 0;
    accent-color: var(--accent); cursor: pointer;
  }
  .mdtask .tlabel { flex: 1 1 auto; min-width: 0; }
  /* Done, and known to be done. Struck through as well as faded: a colour or an
     opacity on its own is not something everyone can read. */
  .mdtask.on .tlabel { text-decoration: line-through; opacity: .62; }
  /*
     A tick that has not been written through yet must NOT look identical to one
     that has. Three states, each with words rather than just a colour, because
     "it says it is done" being a lie is the failure this is designed against.
  */
  .tmark {
    flex: 0 0 auto; align-self: center;
    font-size: 11px; font-weight: 650; line-height: 1.6;
    padding: 0 7px; border-radius: 999px; white-space: nowrap;
  }
  .tmark[hidden] { display: none; }
  .tmark.saving { background: var(--claim-bg); color: var(--claim-fg); }
  .tmark.unsure { background: var(--pend-bg); color: var(--pend-fg); }
  .tmark.failed { background: var(--err-bg); color: var(--err-fg); cursor: pointer; }
  /* The whole row goes amber when the tick is not known to have landed, so it
     is visible while scanning rather than only when read. */
  .mdtask.unsettled { box-shadow: inset 3px 0 0 var(--pend-bg); padding-left: 8px; }
  .mdtask.broken { box-shadow: inset 3px 0 0 var(--err-fg); padding-left: 8px; }
  .msg .meta { margin-top: 5px; font-size: 12px; opacity: .72; }
  .msg.user {
    margin-left: auto; background: var(--accent-grad); color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg.user .meta { text-align: right; }
  /* Lifecycle, shown as a pill with a GLYPH as well as a colour — hue alone is
     not information a colourblind reader can use. Fixed colours, never the
     conversation hue: a state must mean the same thing everywhere. */
  .chip {
    display: inline-block; margin-left: 6px; padding: 1px 8px;
    font-size: 12px; font-weight: 650; line-height: 1.5;
    border-radius: 999px; white-space: nowrap;
  }
  .chip.pending { background: var(--pend-bg); color: var(--pend-fg); }
  .chip.claimed { background: var(--claim-bg); color: var(--claim-fg); }
  .chip.done    { background: var(--done-bg);  color: var(--done-fg); }
  /* A matching edge on the bubble, so the state is legible from across the
     thread without reading the pill. */
  .msg.user.st-pending { box-shadow: inset -4px 0 0 var(--pend-bg); }
  .msg.user.st-claimed { box-shadow: inset -4px 0 0 var(--claim-bg); }
  .msg.user.st-done    { box-shadow: inset -4px 0 0 var(--done-bg); }
  .msg.agent { margin-right: auto; background: var(--agent-bg); color: var(--agent-fg); border: 1px solid var(--line); border-bottom-left-radius: 6px; }

  #err {
    display: none; flex: 0 0 auto;
    margin: 0; padding: 9px 14px; font-size: 14px;
    color: var(--err-fg); background: var(--err-bg); border-top: 1px solid var(--line);
  }
  #err.show { display: block; }
  /* Sticky errors explain something the user has to act on, so they wait to be read. */
  #err.sticky { cursor: pointer; }
  #err.sticky::after { content: ' — tap to dismiss'; opacity: .65; }

  /* Voice dictation: status line + live input level, shown only while listening. */
  #voice {
    display: none; flex: 0 0 auto; align-items: center; gap: 10px;
    margin: 0; padding: 8px 14px; font-size: 14px; color: var(--muted);
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #voice.show { display: flex; }
  #meter {
    flex: 0 0 auto; width: 72px; height: 6px; border-radius: 3px;
    background: var(--line); overflow: hidden;
  }
  #meter i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }
  #voice.hearing { color: var(--fg); }
  #voice.hearing #meter i { background: var(--rec); }
  /* Mic is hard-gated while a reply plays; the bar says so in as many words. */
  #voice.speaking { color: var(--accent); }
  #voice.speaking #meter i { background: var(--accent); width: 100%; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #voice.speaking #meter i { animation: none; } }
  /*
   * Not listening. Coloured like an error rather than like the resting state,
   * because the failure this guards against is glancing at the bar mid-sentence
   * and reading it as "fine" — see micFault() for the full story.
   */
  #voice.deaf { color: var(--err-fg); font-weight: 650; }
  #voice.deaf #meter i { width: 0% !important; background: var(--err-fg); }
  #vstop {
    margin-left: auto; flex: 0 0 auto;
    font-family: inherit; font-size: 14px; font-weight: 650;
    min-height: 32px; padding: 0 12px;
    color: var(--err-fg); background: transparent;
    border: 1px solid currentColor; border-radius: 10px; cursor: pointer;
    -webkit-appearance: none; appearance: none; display: none;
  }
  #voice.live #vstop { display: inline-flex; align-items: center; }

  #composer {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #mic, #convo {
    position: relative;
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; padding: 0;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 15px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #mic svg, #convo svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  #mic:disabled, #convo:disabled { opacity: .5; }
  /* Unusable here (almost always: not an https page). Struck through so it reads as
     blocked rather than broken — but still tappable, because the tap is what explains. */
  #mic.off, #convo.off { color: var(--muted); border-style: dashed; }
  #mic.off::after, #convo.off::after {
    content: ''; position: absolute; left: 11px; top: 22px;
    width: 24px; height: 2px; border-radius: 2px;
    background: currentColor; transform: rotate(-45deg);
  }
  #mic.on { color: #fff; background: var(--rec); border-color: var(--rec); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .62; } }
  @media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } }
  /* Conversation mode shares the mic's visual language; `on` is the same red. */
  #convo.on { color: #fff; background: var(--rec); border-color: var(--rec); }
  /* Muted while the agent is talking — steady blue, not the recording red. */
  #convo.gated { color: #fff; background: var(--accent); border-color: var(--accent); animation: none; }
  #input {
    flex: 1 1 auto; min-width: 0;
    font-family: inherit; font-size: 16px; line-height: 1.4;
    resize: none; overflow-y: auto;
    min-height: 48px; max-height: 40vh; padding: 12px;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 15px;
  }
  #send {
    flex: 0 0 auto; font-family: inherit; font-size: 16px; font-weight: 650;
    min-height: 48px; min-width: 80px; padding: 0 18px;
    color: #fff; background: var(--accent-grad);
    border: 0; border-radius: 15px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  /* One visible, colourful focus ring everywhere, instead of the browser's. */
  button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  #input:focus { border-color: var(--accent); }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
  <header>
    <button id="menu" type="button" aria-label="Conversations" title="Conversations" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      <i id="menudot" aria-hidden="true"></i>
    </button>
    <b id="title">relay</b><span id="conn">offline &mdash; retrying</span>
    <button id="spk" type="button" aria-label="Spoken replies are off" title="Spoken replies are off" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4 4 0 0 0-2.5-3.7v7.4a4 4 0 0 0 2.5-3.7zM13 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.8 8.8 0 0 0 0-17.6z"/></svg>
    </button>
  </header>

  <main id="thread">
    <div id="list"></div>
    <p id="empty">No messages yet. Type below to send one.</p>
  </main>

  <p id="err"></p>

  <div id="voice" aria-live="polite">
    <span id="meter" aria-hidden="true"><i></i></span><span id="vtext"></span>
    <button id="vstop" type="button">Stop</button>
  </div>

  <div id="composer">
    <button id="mic" type="button" aria-label="Dictate a message" title="Dictate a message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
    </button>
    <button id="convo" type="button" aria-label="Start a hands-free conversation" title="Hands-free conversation" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.97 0-9 3.13-9 7 0 1.9.97 3.62 2.55 4.88-.16 1.2-.66 2.3-1.4 3.15-.24.28-.05.72.31.7 1.86-.1 3.5-.75 4.71-1.6 .9.23 1.85.36 2.83.36 4.97 0 9-3.13 9-7s-4.03-7-9-7zm-3.6 8.4a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8zm3.6 0a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8zm3.6 0a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8z"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Message&hellip;" maxlength="8000"
      autocapitalize="sentences" autocomplete="off" spellcheck="true" enterkeyhint="send"></textarea>
    <button id="send" type="button">Send</button>
  </div>

  <div id="drawer" hidden>
    <div id="scrim"></div>
    <nav id="panel" aria-label="Conversations">
      <div class="prow">
        <b>Conversations</b>
        <button id="drawerclose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="prow">
        <input id="newtitle" type="text" placeholder="New conversation&hellip;" maxlength="200"
          autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
        <button id="newconv" type="button" aria-label="Create conversation">+</button>
      </div>
      <p id="converr"></p>
      <div id="convlist"></div>
      <button id="statusopen" type="button">Status &mdash; is anything listening?</button>
    </nav>
  </div>

  <section id="statusview" hidden aria-label="Status">
    <div class="prow">
      <b>Status</b>
      <button id="statusclose" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="statusbody"></div>
    <!--
      Built once by initNotify(), and deliberately a SIBLING of #statusbody:
      renderStatus() wipes #statusbody every 5s while this view is open, which
      would destroy any control placed inside it mid-tap.
    -->
    <div id="notifybody"></div>
  </section>

<script>
(function () {
  'use strict';

  var POLL_MS = 3000;        // poll interval when the live stream is not up
  var STREAM_POLL_MS = 30000;// slow repair poll while the live stream is carrying updates
  var MAX_BACKOFF = 20000;   // slowest retry when the server is unreachable
  var MAX_CHARS = 8000;      // must match the server-side cap
  var FULL_EVERY = 20;       // every Nth poll re-reads the whole thread as a repair pass
  var WINDOW = 250;          // entries fetched by a full read
  /*
   * A hard ceiling on what the thread may hold in memory and on screen. Without
   * it the page's cost grows with the history for ever, and this page is left
   * open for days on a phone — the one device with a memory budget small enough
   * to care. Older messages are not lost, they are simply not resident: the
   * server still has them, and a full read brings the most recent WINDOW back.
   */
  var KEEP = 300;            // most recent entries kept resident

  var thread = document.getElementById('thread');
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var errBar = document.getElementById('err');
  var conn = document.getElementById('conn');

  var entries = new Map();   // id -> entry
  var sigs = new Map();      // id -> change signature
  var cursorMs = 0;          // newest rev seen; drives incremental polling
  var fails = 0, polls = 0, timer = null, errTimer = null;
  var everRendered = false, sending = false;
  var stream = null, streamOk = false;
  var freshAgent = [];       // agent entries merged since the last speech harvest
  var booted = false;        // true once the first read has landed; see harvestSpeech()

  /*
   * Conversations. The thread on screen is always exactly one of them; every
   * read, every send and every spoken reply is scoped to `activeConv`. The id
   * is remembered across reloads so the phone comes back where it was left.
   * `convNew` records conversations that changed while you were looking at a
   * different one — that is what lights the dot on the hamburger.
   */
  var DEFAULT_CONV = 'main';
  var activeConv = DEFAULT_CONV;
  var convs = [];
  var convNew = Object.create(null);
  var convTimer = null;

  var STATUS = { pending: 'pending', claimed: 'claimed', done: 'answered' };
  // Shape, not just colour: an empty ring, a half-filled ring, a tick.
  var GLYPH = { pending: '○', claimed: '◐', done: '✓' };

  /*
   * A conversation's colour is derived from its id, so it is stable, needs no
   * storage, and is the same on every device. It is decoration that carries
   * information: the header, the send button and the active row all shift, so
   * "which conversation am I in" is answerable without reading anything.
   */
  function hueOf(id) {
    var h = 0;
    var s = String(id || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function applyHue(id) {
    var root = document.documentElement;
    if (!root || !root.style) return;
    var h = hueOf(id);
    try {
      root.style.setProperty('--hue', String(h));
      root.style.setProperty('--hue2', String((h + 50) % 360));
    } catch (e) { /* a browser without custom properties keeps the default look */ }
  }

  function ms(s) { var n = Date.parse(s || ''); return isNaN(n) ? 0 : n; }
  function sigOf(e) { return [e.role, e.status, e.ts, e.text].join('|'); }

  function rel(iso) {
    var t = ms(iso);
    if (!t) return '';
    var d = Date.now() - t;
    if (d < 45000) return 'now';
    var m = Math.round(d / 60000); if (m < 60) return m + 'm';
    var h = Math.round(m / 60); if (h < 24) return h + 'h';
    var dd = Math.round(h / 24); if (dd < 7) return dd + 'd';
    return new Date(t).toLocaleDateString();
  }
  function absolute(iso) { var t = ms(iso); return t ? new Date(t).toLocaleString() : ''; }

  function nearBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 120; }
  function scrollBottom() { thread.scrollTop = thread.scrollHeight; }

  // ------------------------------------------------------------------ markdown
  /*
   * A small Markdown subset, rendered by BUILDING NODES rather than by
   * assigning HTML.
   *
   * WHY IT IS SHAPED THIS WAY, AND IT IS NOT A STYLE PREFERENCE. This queue has
   * no authentication and is published on every interface the machine has, so
   * anything that can reach it can put text on this page — and this page is the
   * one that talks to every agent on the box. There is no `innerHTML` anywhere
   * in this file and there is none here: every character of message text
   * reaches the document through `textContent`, which makes injection
   * structurally impossible rather than merely filtered. No library, for the
   * same reason the rest of this project has no dependencies — a Markdown
   * parser is the classic place for an HTML-passthrough option to be on by
   * default.
   *
   * The one place a string becomes something the browser will *act* on is a
   * link's href, so that is allowlisted by scheme and nothing else is linked.
   */
  var SAFE_URL = /^(?:https?:\/\/|mailto:[^\s]|\/(?!\/))/i;

  function linkNode(label, href) {
    var url = String(href || '');
    if (!SAFE_URL.test(url)) {
      // `javascript:`, `data:`, and anything else we do not recognise. Show the
      // text so nothing is hidden from the reader, but do not make it clickable.
      return document.createTextNode(label === url ? url : label + ' (' + url + ')');
    }
    var a = document.createElement('a');
    a.href = url;
    a.textContent = label;
    a.target = '_blank';
    a.rel = 'noopener noreferrer nofollow';
    return a;
  }

  /* Inline spans. Tried in order at each position; every branch consumes at
     least one character, so this cannot spin. */
  function inlineInto(parent, text) {
    var s = String(text == null ? '' : text);
    var i = 0;
    while (i < s.length) {
      var rest = s.slice(i), m;
      if ((m = /^`([^`\n]+)`/.exec(rest))) {
        var code = document.createElement('code');
        code.textContent = m[1];
        parent.appendChild(code);
        i += m[0].length; continue;
      }
      if ((m = /^\[([^\]\n]*)\]\(\s*([^)\s]+)[^)]*\)/.exec(rest))) {
        parent.appendChild(linkNode(m[1] || m[2], m[2]));
        i += m[0].length; continue;
      }
      if ((m = /^(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]])/.exec(rest))) {
        parent.appendChild(linkNode(m[1], m[1]));
        i += m[0].length; continue;
      }
      if ((m = /^(\*\*|__)([\s\S]+?)\1/.exec(rest))) {
        var b = document.createElement('strong');
        inlineInto(b, m[2]);
        parent.appendChild(b);
        i += m[0].length; continue;
      }
      if ((m = /^~~([\s\S]+?)~~/.exec(rest))) {
        var d = document.createElement('del');
        inlineInto(d, m[1]);
        parent.appendChild(d);
        i += m[0].length; continue;
      }
      if ((m = /^(\*|_)([^*_\n]+?)\1/.exec(rest))) {
        var em = document.createElement('em');
        inlineInto(em, m[2]);
        parent.appendChild(em);
        i += m[0].length; continue;
      }
      // A plain run, up to the next thing that could begin a span. The URL case
      // is matched in full rather than by its leading `h`, or every letter h in
      // ordinary prose would end the run and cost a text node.
      var next = rest.slice(1).search(/[`[*_~]|https?:\/\//);
      var take = next === -1 ? rest.length : next + 1;
      parent.appendChild(document.createTextNode(rest.slice(0, take)));
      i += take;
    }
  }

  var RE_FENCE = /^\s*```/;
  var RE_HEAD = /^(#{1,6})\s+(.*)$/;
  var RE_QUOTE = /^\s*>\s?(.*)$/;
  var RE_TASK = /^\s*[-*+]\s+\[([ xX])\]\s*(.*)$/;
  var RE_BULLET = /^\s*[-*+]\s+(.*)$/;
  var RE_ORDER = /^\s*(\d{1,3})[.)]\s+(.*)$/;

  function isBlockStart(line) {
    return RE_FENCE.test(line) || RE_HEAD.test(line) || RE_QUOTE.test(line) ||
      RE_TASK.test(line) || RE_BULLET.test(line) || RE_ORDER.test(line);
  }

  function mdRender(text, entry) {
    var frag = document.createDocumentFragment();
    var lines = String(text == null ? '' : text).split(/\r?\n/);
    var i = 0, taskIndex = 0, list = null, kind = null;
    function endList() { list = null; kind = null; }
    function into(k, cls) {
      if (kind !== k) {
        list = document.createElement(k === 'ol' ? 'ol' : 'ul');
        list.className = cls;
        frag.appendChild(list);
        kind = k;
      }
      return list;
    }

    while (i < lines.length) {
      var line = lines[i], m;

      if (RE_FENCE.test(line)) {
        endList();
        var buf = [];
        i++;
        while (i < lines.length && !RE_FENCE.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // the closing fence, if there was one
        var pre = document.createElement('pre');
        var pc = document.createElement('code');
        pc.textContent = buf.join('\n');
        pre.appendChild(pc);
        frag.appendChild(pre);
        continue;
      }

      if (!line.trim()) { endList(); i++; continue; }

      if ((m = RE_HEAD.exec(line))) {
        endList();
        var h = document.createElement('div');
        h.className = 'mdh mdh' + m[1].length;
        h.setAttribute('role', 'heading');
        h.setAttribute('aria-level', String(m[1].length));
        inlineInto(h, m[2]);
        frag.appendChild(h);
        i++; continue;
      }

      if ((m = RE_QUOTE.exec(line))) {
        endList();
        var q = document.createElement('div');
        q.className = 'mdquote';
        var firstQ = true;
        while (i < lines.length && (m = RE_QUOTE.exec(lines[i]))) {
          if (!firstQ) q.appendChild(document.createElement('br'));
          inlineInto(q, m[1]);
          firstQ = false; i++;
        }
        frag.appendChild(q);
        continue;
      }

      if ((m = RE_TASK.exec(line))) {
        into('task', 'mdtasks').appendChild(taskNode(m[2], /x/i.test(m[1]), entry, taskIndex++));
        i++; continue;
      }

      if ((m = RE_BULLET.exec(line))) {
        var li = document.createElement('li');
        inlineInto(li, m[1]);
        into('ul', 'mdlist').appendChild(li);
        i++; continue;
      }

      if ((m = RE_ORDER.exec(line))) {
        var oli = document.createElement('li');
        inlineInto(oli, m[2]);
        into('ol', 'mdlist').appendChild(oli);
        i++; continue;
      }

      endList();
      var p = document.createElement('p');
      p.className = 'mdp';
      var first = true;
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
        if (!first) p.appendChild(document.createElement('br'));
        inlineInto(p, lines[i]);
        first = false; i++;
      }
      frag.appendChild(p);
    }
    return frag;
  }

  // ---------------------------------------------------------------- checklists
  /*
   * A ticked box has to survive a reload, and it has to reach Vikunja, which is
   * where "what is left to pack" actually lives. Two sources of truth for that
   * is the failure worth avoiding, so this does not keep its own list: the tick
   * renders instantly from local state, and posts a message asking the
   * conversation's agent to make the change in Vikunja. The browser never
   * touches Vikunja and therefore never holds a Vikunja credential.
   *
   * WHICH MEANS THE TICK CAN LIE. The agent may be idle, dead, or holding a
   * token that Vikunja has expired — and it will expire, they always do. A
   * checkbox that silently shows "done" when nothing was written is worse than
   * one that is slow, so a tick that has not been confirmed does not look like
   * one that has: it carries the word "saving", or "not confirmed", or "not
   * saved", and the row is striped. Idle and broken must not look the same.
   *
   * Confirmation reuses machinery that already exists rather than inventing a
   * protocol: the posted message is an ordinary queue task, so its lifecycle
   * (pending -> claimed -> answered) is already tracked and already pushed over
   * SSE. Answered means an agent acted. If the agent later restates the list
   * with the box ticked, the message text itself agrees and the local record
   * stops mattering at all.
   */
  var CHECKS_KEY = 'relay.checks';
  var MAX_CHECKS = 400;      // the record is a cache, not a store; keep it bounded
  var UNSURE_AFTER_MS = 240000; // 4 min unanswered: say so rather than keep spinning
  var checksMem = null;

  function allChecks() {
    if (checksMem) return checksMem;
    try { checksMem = JSON.parse(pref(CHECKS_KEY) || '{}') || {}; } catch (e) { checksMem = {}; }
    return checksMem;
  }
  function checkState(key) { return allChecks()[key] || null; }
  function setCheck(key, val) {
    var all = allChecks();
    all[key] = val;
    var keys = Object.keys(all);
    if (keys.length > MAX_CHECKS) {
      keys.sort(function (a, b) { return (all[a].at || 0) - (all[b].at || 0); });
      for (var i = 0; i < keys.length - MAX_CHECKS; i++) delete all[keys[i]];
    }
    try { pref(CHECKS_KEY, JSON.stringify(all)); } catch (e) { /* stays in memory only */ }
  }

  /*
   * What to say about this tick, in words. Returns null when there is nothing
   * to say — the tick is either untouched by us or known to have landed.
   */
  function checkMark(key, st, agreesWithSource) {
    if (!st) return null;                 // never touched here: the text is the truth
    if (agreesWithSource) return null;    // the agent has restated it our way
    if (st.done) return null;             // we watched the task get answered
    if (st.failed) return { cls: 'failed', text: 'not saved — tap to retry' };
    if (st.taskId) {
      var task = entries.get(st.taskId);
      if (task && task.status === 'done') {
        st.done = true; setCheck(key, st);  // remember it, so eviction cannot un-confirm it
        return null;
      }
      if (Date.now() - (st.at || 0) > UNSURE_AFTER_MS) {
        return { cls: 'unsure', text: 'not confirmed' };
      }
      return { cls: 'saving', text: 'saving' };
    }
    return { cls: 'saving', text: 'saving' };
  }

  function paintTask(li, mark, key, st, agreesWithSource) {
    var m = checkMark(key, st, agreesWithSource);
    mark.className = 'tmark' + (m ? ' ' + m.cls : '');
    mark.textContent = m ? m.text : '';
    mark.hidden = !m;
    li.className = 'mdtask' + ((st ? st.on : false) ? ' on' : '') +
      (m && m.cls === 'failed' ? ' broken' : m ? ' unsettled' : '');
  }

  function taskNode(label, checkedInSource, entry, idx) {
    var key = (entry && entry.id ? entry.id : '?') + ':' + idx;
    var conv = (entry && entry.conversationId) || activeConv;
    var st = checkState(key);
    // The message text is the source of truth until this device changes it —
    // the queue is append-only, so a message can never be rewritten in place.
    var on = st ? !!st.on : checkedInSource;
    if (st) st.on = on;

    var li = document.createElement('li');
    var lab = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = on;

    var span = document.createElement('span');
    span.className = 'tlabel';
    inlineInto(span, label);

    var mark = document.createElement('span');
    mark.className = 'tmark';
    mark.hidden = true;

    lab.appendChild(box);
    lab.appendChild(span);
    li.appendChild(lab);
    li.appendChild(mark);
    paintTask(li, mark, key, st, st ? st.on === checkedInSource : true);

    function send(want) {
      var rec = { on: want, taskId: null, done: false, failed: false, at: Date.now() };
      setCheck(key, rec);
      paintTask(li, mark, key, rec, want === checkedInSource);
      var plain = String(label).replace(/\s+/g, ' ').trim().slice(0, 200);
      postTask((want ? 'Checked off: “' : 'Un-checked: “') + plain +
        (want ? '” — please tick it off in Vikunja.'
          : '” — please un-tick it in Vikunja.'), 'checklist', conv)
        .then(function (j) {
          rec.taskId = (j && j.id) || null;
          rec.failed = false;
          setCheck(key, rec);
          paintTask(li, mark, key, rec, want === checkedInSource);
          // Show the message we just posted without waiting for the next poll.
          if (conv === activeConv) poll(false);
        })
        .catch(function (err) {
          rec.failed = true;
          rec.error = (err && err.message) || 'network error';
          setCheck(key, rec);
          paintTask(li, mark, key, rec, want === checkedInSource);
        });
    }

    box.addEventListener('change', function () { send(!!box.checked); });
    // A failed write is not a dead end: the marker is the retry button.
    mark.addEventListener('click', function () {
      var cur = checkState(key);
      if (cur && cur.failed) send(!!cur.on);
    });
    return li;
  }

  function nodeFor(e) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (e.role === 'agent' ? 'agent' : 'user');

    var body = document.createElement('div');
    body.className = 'body';
    body.appendChild(mdRender(e.text, e));   // nodes only: never innerHTML

    var meta = document.createElement('div');
    meta.className = 'meta';
    var t = document.createElement('span');
    t.className = 'time';
    t.setAttribute('data-ts', e.ts || '');
    t.title = absolute(e.ts);
    t.textContent = rel(e.ts);
    meta.appendChild(t);
    if (e.role !== 'agent') {
      // The glyph is doing as much work as the colour here: pending / claimed /
      // answered has to be distinguishable without relying on hue.
      var st = document.createElement('span');
      st.className = 'chip ' + (e.status || 'pending');
      st.textContent = (GLYPH[e.status] || '') + ' ' + (STATUS[e.status] || e.status || '');
      meta.appendChild(st);
      wrap.className += ' st-' + (e.status || 'pending');
    }

    wrap.appendChild(body);
    wrap.appendChild(meta);
    return wrap;
  }

  function render() {
    var all = Array.from(entries.values());
    all.sort(function (a, b) {
      return (ms(a.ts) - ms(b.ts)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    var stick = !everRendered || nearBottom();

    var frag = document.createDocumentFragment();
    for (var i = 0; i < all.length; i++) frag.appendChild(nodeFor(all[i]));
    list.textContent = '';
    list.appendChild(frag);

    empty.style.display = all.length ? 'none' : 'block';
    if (stick) scrollBottom();
    if (all.length) everRendered = true;
  }

  function refreshTimes() {
    var els = list.querySelectorAll('.time');
    for (var i = 0; i < els.length; i++) els[i].textContent = rel(els[i].getAttribute('data-ts'));
  }

  function merge(arr) {
    var changed = false;
    for (var i = 0; i < arr.length; i++) {
      var e = arr[i];
      if (!e || typeof e.id !== 'string') continue;
      var s = sigOf(e);
      if (sigs.get(e.id) !== s) {
        sigs.set(e.id, s); entries.set(e.id, e); changed = true;
        // Candidates for reading aloud. Collected here rather than at the two
        // call sites so an agent reply is caught whether it arrived by SSE push
        // or by a poll — they merge through the identical code path.
        if (e.role === 'agent') freshAgent.push(e);
      }
      var r = ms(e.rev || e.ts);
      if (r > cursorMs) cursorMs = r;
    }
    if (changed && entries.size > KEEP) trimEntries();
    return changed;
  }

  /*
   * Drop the oldest entries once the thread outgrows KEEP. Insertion order is
   * not send order — a repair pass can merge an old message after a new one —
   * so the cut is made by timestamp, not by Map order, or a slow-arriving old
   * entry would evict a message that is still on screen.
   */
  function trimEntries() {
    var all = Array.from(entries.values());
    all.sort(function (a, b) { return ms(a.ts) - ms(b.ts); });
    for (var i = 0; i < all.length - KEEP; i++) {
      entries.delete(all[i].id);
      sigs.delete(all[i].id);
    }
  }

  function setConn(ok) { conn.className = ok ? '' : 'show'; }

  // `sticky` keeps the message up until it is tapped away. Used when the reason
  // matters and the user has to go do something about it — a nine-second flash is
  // how you end up with "it just didn't work".
  function showErr(msg, sticky) {
    errBar.textContent = msg;
    errBar.className = sticky ? 'show sticky' : 'show';
    clearTimeout(errTimer);
    if (!sticky) errTimer = setTimeout(clearErr, 9000);
  }
  function clearErr() { clearTimeout(errTimer); errBar.className = ''; errBar.textContent = ''; }

  /*
   * Report a client-side failure to the server so it lands in `docker logs
   * relay-queue`. The UI's real home is a phone, where there is no console to
   * read, and "the mic did nothing" is not a diagnosable bug report. Entirely
   * best-effort: it never throws, never blocks, and never surfaces its own errors.
   */
  function logClient(event, detail) {
    try {
      fetch('/client-log', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ event: event, detail: detail, ua: navigator.userAgent, url: location.href })
      }).catch(function () {});
    } catch (e) { /* logging must never be able to break the page */ }
  }

  /*
   * WHY THE CRASH WAS INVISIBLE, AND HOW THIS SEES IT.
   *
   * A tab killed by the phone — Android's low-memory killer, or a content
   * process crash — runs no code on the way out. Every report it might have
   * sent dies with it, which is why hours of `docker logs` showed nothing but
   * the symptoms of the *reload* that followed. So this does not try to catch
   * the crash. It marks the session open on arrival and clears the mark on a
   * clean exit; a mark still standing at the next load means the previous
   * session vanished. The crash is then reported by its successor, with how
   * long it lived and what it was holding when it went.
   *
   * `localStorage` on purpose, not `sessionStorage`: the latter is scoped to a
   * tab that no longer exists by the time anyone can read it.
   */
  var SESSION_KEY = 'relay.session';
  var sessionStartedAt = Date.now();
  var sessionTimer = null;

  function sessionState() {
    return {
      open: true,
      startedAt: sessionStartedAt,
      aliveMs: Date.now() - sessionStartedAt,
      entries: entries ? entries.size : 0,
      conv: !!convOn,
      speak: !!speakOn,
      hidden: !!document.hidden,
      // Firefox does not expose this; Chromium does. Recorded when offered.
      heapMB: (window.performance && performance.memory)
        ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null
    };
  }

  function sessionMark(open) {
    try {
      var s = sessionState();
      s.open = open;
      window.localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    } catch (e) { /* private mode: we simply lose the ability to see a crash */ }
  }

  function reportLastSession() {
    var prev = null;
    try {
      var raw = window.localStorage.getItem(SESSION_KEY);
      if (raw) prev = JSON.parse(raw);
    } catch (e) { return; }
    // A clean exit cleared the flag. Anything still open was killed.
    if (prev && prev.open) {
      logClient('page-vanished', {
        aliveSec: Math.round((prev.aliveMs || 0) / 1000),
        entries: prev.entries,
        conv: prev.conv,
        speak: prev.speak,
        hidden: prev.hidden,
        heapMB: prev.heapMB
      });
    }
  }

  function initCrashWatch() {
    reportLastSession();
    sessionMark(true);
    // Cheap and periodic, so the marker's numbers describe the moment it died
    // rather than the moment it loaded.
    sessionTimer = setInterval(function () { sessionMark(true); }, 15000);

    // A clean exit. `pagehide` fires where `unload` is unreliable on mobile.
    window.addEventListener('pagehide', function () {
      clearInterval(sessionTimer);
      sessionMark(false);
    });

    /*
     * Errors that reach the top level. These were being swallowed entirely: the
     * page has no console anyone can read, because its home is a phone.
     */
    window.addEventListener('error', function (e) {
      logClient('js-error', {
        message: (e && e.message) || 'unknown',
        source: (e && e.filename) || '',
        line: (e && e.lineno) || 0,
        col: (e && e.colno) || 0,
        aliveSec: Math.round((Date.now() - sessionStartedAt) / 1000)
      });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      logClient('js-rejection', {
        message: (r && r.message) || String(r || 'unknown').slice(0, 200),
        aliveSec: Math.round((Date.now() - sessionStartedAt) / 1000)
      });
    });
  }

  // All requests are root-relative so the page works unchanged behind a reverse proxy.
  function poll(fullRead) {
    var scope = 'conversation=' + encodeURIComponent(activeConv);
    var url = (!fullRead && cursorMs)
      ? '/thread?' + scope + '&since=' + cursorMs
      : '/thread?' + scope + '&limit=' + WINDOW;
    return fetch(url, { headers: { accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        var arr = (j && Array.isArray(j.entries)) ? j.entries : [];
        if (merge(arr) || !everRendered) render();
        harvestSpeech();
        fails = 0; setConn(true);
        return true;
      })
      .catch(function () { fails++; setConn(false); return false; });
  }

  function schedule() {
    clearTimeout(timer);
    // Backing off on failure is what keeps a dead server from being hammered; the
    // live stream only ever makes the *healthy* interval longer, never the retry.
    var delay = fails ? Math.min(POLL_MS * Math.pow(2, Math.min(fails, 4)), MAX_BACKOFF)
      : (streamOk ? STREAM_POLL_MS : POLL_MS);
    timer = setTimeout(tick, delay);
  }
  function tick() {
    if (document.hidden) { schedule(); return; }
    polls++;
    var full = polls % FULL_EVERY === 0;
    if (full) loadConvs(); // the repair pass refreshes the menu too
    poll(full).then(schedule);
  }
  function kick() { clearTimeout(timer); timer = setTimeout(tick, 0); }

  /*
   * Live updates. The server pushes every change over SSE, so another device's
   * message lands here immediately. Polling above stays exactly as it was and
   * takes over whenever the stream is not running — EventSource reconnects on
   * its own, and if it never succeeds the page is simply the poller it used to be.
   */
  function openStream() {
    if (!window.EventSource || stream) return;
    try { stream = new EventSource('/events'); } catch (e) { return; }
    stream.onopen = function () {
      streamOk = true;
      // Catch up on anything that changed while the stream was down.
      poll(false).then(schedule);
    };
    stream.onmessage = function (e) {
      var j;
      try { j = JSON.parse(e.data); } catch (err) { return; }
      fails = 0; setConn(true);
      // A conversation was created, renamed, reassigned or archived.
      if (j && j.conversation) { loadConvs(); return; }
      /*
       * One stream carries every conversation, so a change to one you are not
       * looking at must NOT be merged into the thread on screen — it is only
       * flagged, which is what makes switching an informed choice rather than a
       * guess. Scoping this server-side would have needed a second connection.
       */
      if (j && typeof j.conversationId === 'string' && j.conversationId !== activeConv) {
        convNew[j.conversationId] = true;
        markMenu();
        queueConvRefresh();
        return;
      }
      var arr = (j && Array.isArray(j.entries)) ? j.entries : [];
      if (merge(arr)) render();
      harvestSpeech();
      queueConvRefresh(); // keep the menu's snippets and counts honest
    };
    stream.onerror = function () {
      // EventSource retries by itself; fall straight back to fast polling meanwhile.
      if (streamOk) { streamOk = false; kick(); }
    };
  }

  // ------------------------------------------------------------------ conversations
  /*
   * One queue, many threads. A conversation is just a label every task carries;
   * the server derives the list, the counts and a snippet of the latest message
   * from the same task records the thread comes from, so there is no second
   * store and nothing to keep in sync.
   *
   * The menu deliberately shows *why* you might want to switch — what was said
   * last, how long ago, how much is waiting, and which agent is meant to answer
   * — because a list of bare titles tells you nothing on a phone.
   */
  var menuBtn = document.getElementById('menu');
  var menuDot = document.getElementById('menudot');
  var titleEl = document.getElementById('title');
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  var drawerClose = document.getElementById('drawerclose');
  var newTitle = document.getElementById('newtitle');
  var newConvBtn = document.getElementById('newconv');
  var convErr = document.getElementById('converr');
  var convList = document.getElementById('convlist');

  /*
   * ---- the conversation lives in the address bar --------------------------
   *
   * WHY. Reloading is what this user does when the page looks stuck, and the
   * page looking stuck is exactly the failure being fixed elsewhere in this
   * file. Before this, every reload landed back on the default conversation
   * without saying so, so the next message went to whichever agent happened to
   * own `main` rather than the one being talked to. A silently misrouted
   * message is worse than an error: nobody finds out until an agent acts on
   * something that was never meant for it.
   *
   * A HASH, NOT A PATH. The server is a hand-rolled node:http app with an
   * explicit route table; `/c/<id>` would need a catch-all that serves the page
   * for any unmatched path, and that catch-all is precisely the thing that
   * turns a genuine 404 — a typo'd API call, a missing asset — into a silent
   * 200 of HTML. A fragment needs no server change at all, is never sent to the
   * server, and therefore behaves identically through the Cloudflare tunnel and
   * Access. `#/c/` rather than a bare `#<id>` so a later view can have its own
   * route without colliding.
   */
  var CONV_HASH = /^#\/c\/(.*)$/;

  function convFromUrl() {
    var m = CONV_HASH.exec(String(location.hash || ''));
    if (!m || !m[1]) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  /*
   * `replace` for anything the user did not choose — the first paint, and
   * repairing a dead link. Only a deliberate switch earns a history entry, or
   * Back would walk through states nobody navigated to.
   */
  function setUrl(id, replace) {
    var h = '#/c/' + encodeURIComponent(id);
    if (location.hash === h) return;
    try {
      if (window.history && window.history.pushState) {
        window.history[replace ? 'replaceState' : 'pushState'](null, '', h);
        return;
      }
    } catch (e) { /* fall through to the assignment below */ }
    // No History API: still correct, just always a new entry. The hashchange
    // this fires is absorbed by the already-there guard in onUrlChange().
    location.hash = h;
  }

  /*
   * Back and forward move between conversations instead of leaving the app.
   * Both events are listened for because pushState-with-a-fragment fires
   * popstate, hashchange, or both depending on the browser; the guard below
   * makes a duplicate harmless.
   */
  function onUrlChange() {
    var id = convFromUrl() || DEFAULT_CONV; // hash hand-edited away: go home
    if (id === activeConv) return;
    // The URL is already right, so this must not push another entry.
    return switchConv(id, true, 'none').then(function () {
      /*
       * Unlike a tap, a URL can name a conversation this page has never heard
       * of — pasted from another device, or archived since. `switchConv` does
       * not validate, so without this the page sits on an empty thread with a
       * title of "relay" until the ten-minute repair poll comes round, which is
       * indistinguishable from the app being broken. Refreshing the list settles
       * it either way: a conversation made elsewhere simply appears, and a dead
       * one is repaired to the default by loadConvs().
       */
      if (!convById(id)) return loadConvs();
    });
  }

  function markMenu() {
    var any = false;
    for (var k in convNew) { if (k !== activeConv) { any = true; break; } }
    if (menuDot) menuDot.className = any ? 'show' : '';
  }

  /** Coalesce list refreshes: a burst of pushes should cost one request. */
  function queueConvRefresh() {
    if (convTimer) return;
    convTimer = setTimeout(function () { convTimer = null; loadConvs(); }, 400);
  }

  function loadConvs() {
    return fetch('/conversations', { headers: { accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (j && typeof j.defaultId === 'string') DEFAULT_CONV = j.defaultId;
        convs = (j && Array.isArray(j.conversations)) ? j.conversations : [];
        // The conversation in the URL — or the remembered one — may have been
        // archived, or may never have existed. Land on the default rather than
        // on a blank page, say which thread this now is, and REPLACE the bad
        // address so it cannot survive into the next reload. Silence here would
        // be the same misrouting bug wearing a different hat.
        var here = false;
        for (var i = 0; i < convs.length; i++) if (convs[i].id === activeConv) here = true;
        if (!here && convs.length) {
          var missing = activeConv;
          return switchConv(DEFAULT_CONV, true, 'replace').then(function (ok) {
            var c = convById(DEFAULT_CONV);
            showErr('That conversation is not here any more — showing ' +
              ((c && c.title) || 'the main thread') + ' instead.');
            logClient('conv-missing', { wanted: missing });
            return ok;
          });
        }
        applyHue(activeConv);
        renderConvs();
        setTitle();
        return true;
      })
      .catch(function () { return false; });
  }

  function convById(id) {
    for (var i = 0; i < convs.length; i++) if (convs[i].id === id) return convs[i];
    return null;
  }

  function setTitle() {
    if (!titleEl) return;
    var c = convById(activeConv);
    titleEl.textContent = (c && c.title) || 'relay';
  }

  function renderConvs() {
    if (!convList) return;
    convList.textContent = '';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < convs.length; i++) frag.appendChild(convNode(convs[i]));
    convList.appendChild(frag);
    markMenu();
  }

  /*
   * A dozen bars of recent activity. It answers one question — busy, quiet or
   * dead — so it has no axes, no labels and no library. Bars are built from
   * divs rather than SVG because that is one fewer namespace to get wrong and
   * scales perfectly at phone size.
   *
   * A conversation with nothing in it renders as a deliberate flat baseline, NOT
   * as an empty box: "quiet" and "broken" must not look the same. The words are
   * in the aria-label because a row of coloured bars is not information a screen
   * reader or a colourblind reader can use on its own.
   */
  function sparkNode(c) {
    var data = (c && c.spark) || [];
    var wrap = document.createElement('div');
    wrap.className = 'spark';
    var max = 0, total = 0, i;
    for (i = 0; i < data.length; i++) { total += data[i]; if (data[i] > max) max = data[i]; }
    var mins = Math.round(((c && c.sparkBucketMs) || 900000) * data.length / 60000);
    wrap.setAttribute('role', 'img');
    wrap.setAttribute('aria-label', total
      ? total + ' messages in the last ' + (mins >= 60 ? Math.round(mins / 60) + ' hours' : mins + ' minutes')
      : 'nothing in the last ' + (mins >= 60 ? Math.round(mins / 60) + ' hours' : mins + ' minutes'));
    if (!total) wrap.className = 'spark quiet';
    var hue = hueOf(c.id);
    for (i = 0; i < data.length; i++) {
      var bar = document.createElement('i');
      // Always at least a sliver, so an idle stretch reads as a baseline.
      bar.style.height = (max ? Math.max(8, Math.round((data[i] / max) * 100)) : 6) + '%';
      if (total) bar.style.backgroundColor = 'hsl(' + hue + ' 78% 55%)';
      wrap.appendChild(bar);
    }
    return wrap;
  }

  /*
   * Wording matters here. "checking in" is not "working": a heartbeat can come
   * from a background loop and prove nothing about whether the agent is awake.
   * `stuck` is the state that used to look healthiest — beating steadily while
   * a message sits unanswered — so it is the loudest thing in the list.
   */
  var AGENT_STATE = {
    watching: 'working',
    idle: 'idle, nothing waiting',
    stuck: 'STUCK — checking in but doing nothing',
    stale: 'not responding',
    silent: 'NOT RESPONDING',
    never: 'has never checked in',
    unassigned: 'nobody assigned'
  };

  /*
   * Who owns this conversation, and are they actually there? An agent that has
   * gone silent is the most important thing this list can tell you, so it gets
   * a word ("NOT RESPONDING"), a glyph and a colour rather than any one of them.
   */
  function agentNode(c) {
    var st = (c && c.agentState) || { state: 'unassigned', agoSec: null };
    var line = document.createElement('div');
    line.className = 'convagent ' + st.state;
    var dot = document.createElement('span');
    dot.className = 'adot';
    dot.textContent = st.state === 'watching' ? '●'
      : st.state === 'stuck' ? '!'
        : st.state === 'silent' || st.state === 'stale' ? '!'
          : st.state === 'idle' ? '·' : '○';
    line.appendChild(dot);
    var label = c.agent ? c.agent + ' · ' + AGENT_STATE[st.state] : AGENT_STATE.unassigned;
    // For the states that mean trouble, say how long — "stuck" is only credible
    // with a duration attached, and it is the number that makes it actionable.
    if ((st.state === 'stuck' || st.state === 'stale' || st.state === 'silent')
      && st.actedAgoSec !== null && st.actedAgoSec !== undefined) {
      label += ' for ' + rel(new Date(Date.now() - st.actedAgoSec * 1000).toISOString());
    }
    var name = document.createElement('span'); // spacing comes from the flex gap
    name.textContent = label;
    line.appendChild(name);
    return line;
  }

  function convNode(c) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'conv' + (c.id === activeConv ? ' active' : '');
    // Each row wears its own conversation's colour, so the list is scannable
    // and the stripe matches the header once you switch into it.
    row.style.borderLeftColor = 'hsl(' + hueOf(c.id) + ' 78% 55%)';
    if (c.id === activeConv) row.setAttribute('aria-current', 'true');

    var top = document.createElement('div');
    top.className = 'convtop';
    var name = document.createElement('span');
    name.className = 'convname';
    name.textContent = c.title || c.id;      // textContent only, like every other string here
    top.appendChild(name);
    if (convNew[c.id] && c.id !== activeConv) {
      var dot = document.createElement('span');
      dot.className = 'convdot';
      top.appendChild(dot);
    }
    var when = document.createElement('span');
    when.className = 'convwhen';
    when.textContent = rel(c.lastTs || c.createdAt);
    top.appendChild(when);

    var snip = document.createElement('div');
    snip.className = 'convsnip';
    var counts = c.counts || {};
    snip.textContent = c.lastText
      ? (c.lastRole === 'agent' ? 'Reply: ' : '') + c.lastText
      : 'No messages yet';

    row.appendChild(top);
    row.appendChild(snip);

    row.appendChild(sparkNode(c));
    row.appendChild(agentNode(c));

    var bits = [];
    if (counts.pending) bits.push(counts.pending + ' waiting');
    if (counts.claimed) bits.push(counts.claimed + ' in progress');
    if (bits.length) {
      var meta = document.createElement('div');
      meta.className = 'convmeta';
      meta.textContent = bits.join(' · ');
      row.appendChild(meta);
    }

    row.addEventListener('click', function () { switchConv(c.id); });
    return row;
  }

  /*
   * Switching wipes the thread and re-reads from scratch. `booted` is dropped
   * for the duration for the same reason it exists at boot: the incoming full
   * read is history, and reading a conversation's backlog aloud on every switch
   * would be intolerable. Dictation deliberately keeps running — switching must
   * not strand a live microphone — and anything already captured still posts to
   * the conversation it was spoken into.
   */
  function switchConv(id, quiet, urlMode) {
    if (!quiet && id === activeConv) { closeDrawer(); return Promise.resolve(true); }
    activeConv = id;
    pref('relay.conv', id);
    if (urlMode !== 'none') setUrl(id, urlMode === 'replace');
    applyHue(id);
    delete convNew[id];
    entries.clear(); sigs.clear();
    cursorMs = 0; everRendered = false; fails = 0;
    booted = false;
    speakQueue = [];
    render();
    setTitle();
    renderConvs();
    closeDrawer();
    clearTimeout(timer);
    return poll(true).then(function () { booted = true; }).then(function () {
      schedule();
      scrollBottom();
      return true;
    });
  }

  /*
   * `drawerOpen` is the truth, not the class name. The class is applied a tick
   * late so the slide-in transition has a frame to start from — and a create-
   * then-switch can close the drawer inside that tick, which would otherwise
   * leave the deferred `open` to reopen a drawer nobody asked for.
   */
  var drawerOpen = false;

  function openDrawer() {
    if (!drawer || drawerOpen) return;
    drawerOpen = true;
    drawer.hidden = false;
    setTimeout(function () { if (drawerOpen) drawer.className = 'open'; }, 0);
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
    loadConvs();
  }

  function closeDrawer() {
    if (!drawer || !drawerOpen) return;
    drawerOpen = false;
    drawer.className = '';
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
    if (convErr) { convErr.className = ''; convErr.textContent = ''; }
    setTimeout(function () { if (!drawerOpen) drawer.hidden = true; }, 200);
  }

  function createConv() {
    var title = newTitle.value.trim();
    if (!title) { newTitle.focus(); return; }
    newConvBtn.disabled = true;
    convErr.className = ''; convErr.textContent = '';
    fetch('/conversations', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ title: title })
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    }).then(function (j) {
      newTitle.value = '';
      return loadConvs().then(function () { return switchConv(j.id); });
    }).catch(function (err) {
      convErr.textContent = 'Could not create — ' + ((err && err.message) || 'network error') + '.';
      convErr.className = 'show';
    }).then(function () { newConvBtn.disabled = false; });
  }

  function initConvs() {
    /*
     * Precedence: the URL, then what this device last had open, then the
     * default. The URL wins because it is the only one of the three that
     * someone can have deliberately chosen — a shared link, or a reload of a
     * thread this phone was already in. localStorage stays as the fallback so
     * that opening the bare bookmarked address still comes back where it was.
     */
    var saved = pref('relay.conv');
    var fromUrl = convFromUrl();
    if (fromUrl) activeConv = fromUrl;
    else if (saved) activeConv = saved;
    // Put it in the address bar from the first paint, without adding a history
    // entry for a page nobody navigated to. Whether the id is real is not known
    // until /conversations answers; loadConvs() repairs it if it is not.
    setUrl(activeConv, true);
    window.addEventListener('popstate', onUrlChange);
    window.addEventListener('hashchange', onUrlChange);
    applyHue(activeConv);
    if (menuBtn) menuBtn.addEventListener('click', function () {
      if (drawerOpen) closeDrawer(); else openDrawer();
    });
    if (scrim) scrim.addEventListener('click', closeDrawer);
    if (drawerClose) drawerClose.addEventListener('click', closeDrawer);
    if (newConvBtn) newConvBtn.addEventListener('click', createConv);
    if (newTitle) newTitle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); createConv(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });
    loadConvs();
  }

  // ------------------------------------------------------------------ status view
  /*
   * "Is anything actually listening, or am I typing into a void?"
   *
   * That is what this page is for, and it is a question about trust rather than
   * statistics — so the headline comes first, in plain words, and answers it
   * without scrolling or interpretation. Counts are further down where they
   * belong: on their own they are reassurance theatre.
   *
   * The one rule that matters: **quiet must never look broken.** An empty queue
   * with nobody checking in reads "Nothing is waiting", not an alarm. The server
   * decides the level; this only renders it.
   */
  var statusView = document.getElementById('statusview');
  var statusBody = document.getElementById('statusbody');
  var statusOpen = document.getElementById('statusopen');
  var statusClose = document.getElementById('statusclose');
  var statusTimer = null;
  var statusOn = false;
  var lastBootAt = null;
  var sawRestart = false;

  var STATUS_MS = 5000;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function srow(parent, label, value, tone) {
    var r = el('div', 'srow');
    r.appendChild(el('span', 'k', label));
    r.appendChild(el('span', 'v' + (tone ? ' ' + tone : ''), value));
    parent.appendChild(r);
    return r;
  }
  function scard(title) {
    var c = el('div', 'scard');
    if (title) c.appendChild(el('h2', null, title));
    return c;
  }
  function ago(sec) {
    if (sec === null || sec === undefined) return 'never';
    if (sec < 60) return sec + 's ago';
    if (sec < 3600) return Math.round(sec / 60) + ' min ago';
    if (sec < 86400) return Math.round(sec / 3600) + 'h ago';
    return Math.round(sec / 86400) + 'd ago';
  }
  function dur(sec) {
    if (sec === null || sec === undefined) return '—';
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.round(sec / 60) + ' min';
    if (sec < 86400) return Math.round(sec / 3600) + 'h';
    return Math.round(sec / 86400) + 'd';
  }

  function renderStatus(s) {
    statusBody.textContent = '';
    var frag = document.createDocumentFragment();

    // --- the headline ---
    var head = el('div', 'shead ' + ((s.headline && s.headline.level) || 'idle'));
    head.appendChild(el('div', null, (s.headline && s.headline.text) || 'Status unavailable.'));
    /*
     * Both kinds of evidence, always, and never conflated. "Last checked in" is
     * a heartbeat, which anything with a socket can send; "last did something"
     * is a claim or a result, which only a running agent can produce. Showing
     * them side by side is what makes a stuck agent visible — beating at 2s
     * while having done nothing for 8 minutes.
     */
    var w = s.watch || {};
    var sub = [];
    if (w.lastActedAgoSec !== null && w.lastActedAgoSec !== undefined) {
      sub.push('Last did something ' + ago(w.lastActedAgoSec) + '.');
    } else {
      sub.push('No agent has done anything here yet.');
    }
    if (w.lastSeenAgoSec !== null && w.lastSeenAgoSec !== undefined) {
      sub.push((w.agent || 'An agent') + ' last checked in ' + ago(w.lastSeenAgoSec) + '.');
    } else {
      sub.push('Nothing is sending heartbeats.');
    }
    head.appendChild(el('div', 'ssub', sub.join(' ')));
    frag.appendChild(head);

    if (sawRestart) {
      var note = scard(null);
      note.appendChild(el('div', 'snote',
        'The server restarted while you were watching. That is normal — it updates itself when the code changes, and nothing in the queue is lost.'));
      frag.appendChild(note);
    }

    // --- waiting ---
    var wait = scard('Waiting');
    var ow = s.responsiveness && s.responsiveness.oldestWaiting;
    if (ow) {
      srow(wait, 'Oldest unanswered', dur(ow.waitingSec), ow.waitingSec > 600 ? 'bad' : '');
      var q = el('div', 'sline');
      q.appendChild(el('div', 't', ow.text || '(no text)'));
      q.appendChild(el('div', 'w', ow.status === 'claimed' ? 'an agent has picked this up' : 'nobody has picked this up yet'));
      wait.appendChild(q);
    } else {
      wait.appendChild(el('div', 'sempty', 'Nothing is waiting — every message has been answered.'));
    }
    var c = s.counts || {};
    srow(wait, 'Waiting / in progress / answered',
      (c.pending || 0) + ' / ' + (c.claimed || 0) + ' / ' + (c.done || 0));
    frag.appendChild(wait);

    // --- responsiveness ---
    var r = s.responsiveness || {};
    var speed = scard('How fast, recently');
    if ((r.timeToClaimSec && r.timeToClaimSec.samples) || (r.timeToAnswerSec && r.timeToAnswerSec.samples)) {
      if (r.timeToClaimSec) {
        srow(speed, 'Picked up, typically', dur(r.timeToClaimSec.median));
        srow(speed, 'Slowest to pick up', dur(r.timeToClaimSec.worst));
      }
      if (r.timeToAnswerSec) {
        srow(speed, 'Answered, typically', dur(r.timeToAnswerSec.median));
        srow(speed, 'Slowest to answer', dur(r.timeToAnswerSec.worst));
      }
      speed.appendChild(el('p', 'snote', 'Over the last '
        + Math.max((r.timeToClaimSec && r.timeToClaimSec.samples) || 0,
          (r.timeToAnswerSec && r.timeToAnswerSec.samples) || 0) + ' messages.'));
    } else {
      speed.appendChild(el('div', 'sempty', 'Nothing has been answered yet, so there is nothing to measure.'));
    }
    frag.appendChild(speed);

    // --- recent activity ---
    var act = scard('Recent activity');
    var rows = (s.recent || []);
    if (!rows.length) {
      act.appendChild(el('div', 'sempty', 'No messages yet.'));
    } else {
      for (var i = 0; i < rows.length && i < 12; i++) {
        var ev = rows[i];
        var line = el('div', 'sline');
        var verb = ev.kind === 'message' ? 'Message in'
          : ev.kind === 'claimed' ? 'Picked up' + (ev.who ? ' by ' + ev.who : '')
            : 'Answered' + (ev.who ? ' by ' + ev.who : '');
        line.appendChild(el('div', 'w', verb + ' · ' + rel(ev.at)));
        line.appendChild(el('div', 't', ev.text || ''));
        act.appendChild(line);
      }
    }
    frag.appendChild(act);

    // --- plumbing ---
    var sv = s.server || {};
    var plumb = scard('Under the hood');
    srow(plumb, 'Live updates', streamOk ? 'pushed instantly' : 'polling every 3s',
      streamOk ? 'good' : '');
    srow(plumb, 'Conversations', String(sv.conversations === undefined ? '—' : sv.conversations));
