    if (!nBusy && !nEls.note.textContent) {
      nEls.note.textContent = n ? (n + ' browser' + (n === 1 ? '' : 's') + ' armed.') : '';
    }
  }

  function humanMin(m) {
    if (m === null || m === undefined) return 'a while';
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60);
    var r = m % 60;
    return h + 'h' + (r ? ' ' + r + 'm' : '');
  }

  // ------------------------------------------------------------------ offline
  /*
   * Registering the worker so the thread can be read with no connection.
   *
   * This used to happen only when he armed alerts, because the worker did
   * nothing but receive pushes and registering it for anything else would have
   * been registering it for nothing. It now also carries the offline cache, so
   * it is registered on load. Registration on its own is silent — it asks for
   * no permission and shows no prompt — so the rule that matters is untouched:
   * the *notification* permission is still requested only on a deliberate tap.
   *
   * Most of what follows is about the update path rather than the cache. The
   * checkout is the deployment, so the danger is not that offline fails, it is
   * that offline succeeds too well and pins him to a build from last Tuesday.
   * The worker's own network-first rule is the main defence; these are the rest.
   */
  var swReg = null;
  var hadController = false;
  var reloadingForUpdate = false;
  var lastUpdateCheck = 0;

  /** Run `fn` once, as soon as a worker is actually controlling this page. */
  function whenControlled(fn) {
    var sw = navigator.serviceWorker;
    if (!sw) return;
    var ran = false;
    function go() {
      if (ran || !sw.controller) return;
      ran = true;
      try { fn(); } catch (e) { /* the page is mid-teardown */ }
    }
    if (sw.controller) { go(); return; }
    sw.addEventListener('controllerchange', go);
    // A backstop, because controllerchange is one event and missing it would
    // mean an install that quietly saves nothing until the next visit.
    setTimeout(go, 3000);
  }

  function checkForUpdate() {
    // Once a minute at most. update() is a real network request, and this fires
    // on every return to the app.
    if (!swReg || Date.now() - lastUpdateCheck < 60000) return;
    lastUpdateCheck = Date.now();
    try { swReg.update(); } catch (e) { /* browser is between workers */ }
  }

  function initOffline() {
    // A worker needs https (or localhost). Without this the failure is an
    // unhandled rejection on every plain-http load, which is noise, not news.
    if (!navigator.serviceWorker || !window.isSecureContext) return;
    hadController = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(function (reg) {
        swReg = reg;
        if (!pushReg) pushReg = reg;
        lastUpdateCheck = Date.now();
        return navigator.serviceWorker.ready;
      })
      .then(function (reg) {
        swReg = reg || swReg;
        /*
         * On the very first install the worker starts controlling the page
         * mid-life, having missed the reads that already happened — so nothing
         * is saved yet. One more read now goes through it fills the cache,
         * which makes "install it and walk out of signal" work instead of
         * needing a second visit nobody would know to make.
         *
         * It must be poll(TRUE). A normal poll is a `since=` delta, and the
         * worker deliberately refuses to save those — a delta is three messages
         * out of four hundred, and saving one would look like an empty thread.
         *
         * The wait for `controller` is not paranoia: ready() resolves when
         * there is an active worker, which is BEFORE clients.claim() has
         * actually taken this page over. Warming at that moment sends the read
         * straight past the worker and saves nothing, which is precisely the
         * bug this comment replaced.
         */
        whenControlled(function () { poll(true); loadConvs(); flushSave(); });
      })
      .catch(function (err) {
        logClient('sw-register-failed', { message: (err && err.message) || String(err) });
      });

    /*
     * A new worker has taken over, which means the code on screen is older than
     * the code on the server. Reload onto it rather than leaving him reading a
     * page that has already been replaced.
     *
     * Guarded three ways: not on the first install (claiming a page that just
     * loaded is not an update), never twice, and never while there is something
     * in the composer — no update is worth eating what he was in the middle of
     * typing. In that case the next reload picks it up, which is safe because
     * the worker asks the network first anyway.
     */
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; }
      if (reloadingForUpdate || sending) return;
      if (input && input.value && input.value.trim()) return;
      reloadingForUpdate = true;
      location.reload();
    });

    // Coming back to an installed app is exactly when a week-old build would
    // otherwise go unnoticed, since it may never have been closed.
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) checkForUpdate();
    });

    /*
     * The OS's own opinion about connectivity. It is not authoritative — a
     * captive portal or hotel wifi is "online" and reaches nothing — so it is
     * used only to react fast: going offline is believed at once, while coming
     * back merely triggers a read, and the read is what decides.
     */
    window.addEventListener('online', function () { fails = 0; checkForUpdate(); kick(); });
    window.addEventListener('offline', function () { if (offlineAt) setConn(false, offlineAt); });

    // The worker's reply to "forget everything you saved".
    navigator.serviceWorker.addEventListener('message', function (ev) {
      var d = ev && ev.data;
      if (d && d.relay === 'offline-forgotten') location.reload();
    });
  }

  /** The escape hatch: throw the saved copies away and start clean. */
  function forgetOffline() {
    var sw = navigator.serviceWorker;
    if (!sw) return;
    if (sw.controller) {
      try { sw.controller.postMessage({ relay: 'forget-offline' }); return; } catch (e) { /* fall through */ }
    }
    // No controller to ask, so do it from here and reload regardless.
    if (window.caches && caches.keys) {
      caches.keys().then(function (names) {
        return Promise.all(names.map(function (n) {
          return n.indexOf('relay-') === 0 ? caches.delete(n) : null;
        }));
      }).catch(function () { return null; }).then(function () { location.reload(); });
    } else {
      location.reload();
    }
  }

  function initNotify() {
    if (!notifyBody) return;
    buildNotifyUi();
    renderNotify();
    /*
     * Passive on load as far as permission goes: getRegistration() never
     * prompts. initOffline() registers the worker, but registration asks for
     * nothing — only the button calls requestPermission().
     */
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) pushReg = reg;
      }).catch(function () { /* nothing registered yet */ });
      // The worker tells the page when a push arrived while it was in front, so
      // the pattern is played by navigator.vibrate — far more reliable on
      // Firefox Android than the notification's own `vibrate` option.
      navigator.serviceWorker.addEventListener('message', function (ev) {
        var d = ev && ev.data;
        if (d && d.relay === 'notify') buzz(d.category);
      });
    }
    loadPushConfig();
  }

  function autosize() {
    input.style.height = 'auto';
    /*
     * The same budget the CSS max-height uses, and for the same reason: the
     * 40% belongs to the composer, so the tools row above the box comes out of
     * it. Measured rather than assumed, since that row can wrap.
     */
    var tools = document.getElementById('tools');
    var above = tools ? tools.offsetHeight + 8 : 0;
    var cap = Math.max(70, Math.round(window.innerHeight * 0.4) - above);
    input.style.height = Math.min(input.scrollHeight + 2, cap) + 'px';
  }

  /*
   * ------------------------------------------------- attaching pictures
   *
   * The server side of this already existed: POST /images stores the bytes
   * under their sha256 and `images: [<sha>]` on a task attaches them. Agents
   * have been posting pictures for days. What was missing was any way for HIM
   * to send one, because the page had no file input at all.
   *
   * Three ways in, because on a phone they are three different gestures:
   * the button (camera or library, via the system sheet), paste, and drop.
   *
   * Everything is re-encoded through a canvas before upload, and that one step
   * quietly solves three separate phone problems:
   *
   *   HEIC. iPhone photos are frequently HEIC, which sniffImage does not accept
   *   — it knows PNG, JPEG, GIF and WebP. A HEIC upload would 415 and read to
   *   him as "the camera is broken". Safari can DECODE HEIC even though the
   *   server cannot store it, so decoding here and re-encoding to JPEG means
   *   the format never reaches the server. Where the browser cannot decode it
   *   either, the error says so in those words rather than showing a 415.
   *
   *   SIZE. A 12MP photo is several megabytes and MAX_IMAGE is 8 MiB. Sending
   *   the original over mobile data to be refused is the worst of both; the
   *   longest edge is capped at 1600px first, which is far more than the thread
   *   or the lightbox can show.
   *
   *   ROTATION. Phone photos carry EXIF orientation, and a canvas drawn from a
   *   raw bitmap ignores it — the classic sideways photo. `imageOrientation:
   *   'from-image'` bakes the rotation into the pixels, so what he saw in the
   *   camera roll is what lands in the thread.
   *
   * Small PNGs pass through untouched: they are usually screenshots, and
   * re-encoding crisp text as JPEG is a visible downgrade for no gain.
   */
  var fileInput = document.getElementById('filepick');
  var attachBtn = document.getElementById('attach');
  var tray = document.getElementById('tray');
  var pending = [];        // { key, file, node, blob, failed }
  var pendingSeq = 0;

  var MAX_DIM = 1600;              // longest edge after downscale
  var JPEG_Q = 0.85;
  var PASS_THROUGH = 400 * 1024;   // a PNG under this is left exactly as it is

  var isImage = function (f) {
    // A HEIC picked on some Androids arrives with an empty type, so the name is
    // the fallback rather than the primary test.
    return !!f && (/^image\//.test(f.type || '') || /\.(png|jpe?g|gif|webp|heic|heif|avif|bmp)$/i.test(f.name || ''));
  };

  var THUMB_DIM = 200;

  function scaledCanvas(bm, maxDim) {
    var longest = Math.max(bm.width, bm.height);
    var scale = longest > maxDim ? maxDim / longest : 1;
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bm.width * scale));
    c.height = Math.max(1, Math.round(bm.height * scale));
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return c;
  }

  function asDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(new Error('could not read that file')); };
      fr.readAsDataURL(file);
    });
  }

  /*
   * One decode, two outputs: the bytes to upload and a small data: URI for the
   * tray. A data: URI rather than URL.createObjectURL because this page is
   * served under `img-src 'self' data:` and a blob: URL is silently blocked —
   * which showed up as a tray full of broken-image icons.
   */
  function prepare(file) {
    if (!window.createImageBitmap) {
      // No decoder to resize with: send it as-is and preview the raw file.
      return asDataUrl(file).then(function (u) {
        return { body: file, type: file.type || 'image/jpeg', thumb: u };
      });
    }
    return createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bm) {
      var thumb = scaledCanvas(bm, THUMB_DIM).toDataURL('image/jpeg', 0.7);
      var longest = Math.max(bm.width, bm.height);
      // A small PNG that is already a sane size goes up byte-for-byte: these are
      // usually screenshots, and re-encoding crisp text as JPEG is a visible
      // downgrade for nothing.
      if (/^image\/png$/.test(file.type || '') && file.size <= PASS_THROUGH && longest <= MAX_DIM) {
        if (bm.close) bm.close();
        return { body: file, type: file.type, thumb: thumb };
      }
      var c = scaledCanvas(bm, MAX_DIM);
      if (bm.close) bm.close();
      return new Promise(function (resolve, reject) {
        c.toBlob(function (b) {
          if (b) resolve({ body: b, type: 'image/jpeg', thumb: thumb });
          else reject(new Error('this browser could not re-encode the picture'));
        }, 'image/jpeg', JPEG_Q);
      });
    }, function () {
      throw new Error('this browser cannot read that picture format (HEIC?) — try Settings > Camera > Most Compatible');
    });
  }

  function drawTray() {
    if (!tray) return;
    tray.hidden = pending.length === 0;
    if (attachBtn) {
      attachBtn.setAttribute('aria-label',
        pending.length ? 'Attach a picture (' + pending.length + ' waiting)' : 'Attach a picture');
    }
  }

  function dropAttachment(key) {
    for (var i = 0; i < pending.length; i++) {
      if (pending[i].key !== key) continue;
      if (pending[i].node && pending[i].node.parentNode) pending[i].node.parentNode.removeChild(pending[i].node);
      // A rejected `ready` with no other handler would surface as an unhandled
      // rejection in the console when its item is removed before sending.
      if (pending[i].ready) pending[i].ready.catch(function () { /* already reported in the tray */ });
      pending.splice(i, 1);
      break;
    }
    drawTray();
  }

  /*
   * One picture. A function per file rather than a loop body, and that is a bug
   * fix rather than a style preference: `var` is function-scoped, so as a loop
   * every asynchronous `prepare` callback closed over the SAME `img` and
   * `node` — the last pair created. Picking two pictures left the first tile
   * permanently blank and painted the second one twice, a failure only
   * reachable with `multiple`, i.e. exactly the case this feature is for.
   */
  function addOne(f) {
    var key = 'a' + (++pendingSeq);
    var node = el('div', 'thumb');
    var img = document.createElement('img');
    img.alt = f.name || 'attached picture';
    node.appendChild(img);
    var x = el('button', 'x');
    x.type = 'button';
    x.setAttribute('aria-label', 'Remove ' + (f.name || 'this picture'));
    x.appendChild(el('i', null, '\u00d7'));
    x.addEventListener('click', function () { dropAttachment(key); });
    node.appendChild(x);
    tray.appendChild(node);
    var item = { key: key, file: f, node: node, blob: null, failed: false, ready: null };
    /*
     * Decoding starts the moment it is picked rather than at send time, so the
     * wait for a big photo happens while he is still typing the caption.
     */
    item.ready = prepare(f).then(function (p) {
      img.src = p.thumb;
      return p;
    }, function (err) {
      item.failed = true;
      node.className = 'thumb bad';
      node.appendChild(el('div', 'err', 'unreadable'));
      showErr('That picture could not be read — ' + ((err && err.message) || 'unknown format') + '.');
      throw err;
    });
    pending.push(item);
  }

  function addFiles(list) {
    if (!list || !tray) return;
    var added = 0;
    for (var i = 0; i < list.length; i++) {
      if (!isImage(list[i])) continue;
      addOne(list[i]);
      added++;
    }
    if (added) { drawTray(); clearErr(); }
  }

  /* Upload everything still waiting; resolves to the list of sha ids. */
  function uploadPending() {
    if (!pending.length) return Promise.resolve([]);
    if (attachBtn) attachBtn.className = 'busy';
    var jobs = pending.map(function (it) {
      if (it.blob) return Promise.resolve(it.blob); // already up: a retried send
      var spin = el('div', 'spin', 'sending');
      if (it.node) it.node.appendChild(spin);
      // Already decoded and downscaled at pick time; this just waits for it.
      return it.ready.then(function (p) {
        return fetch('/images?conversationId=' + encodeURIComponent(activeConv) +
          '&alt=' + encodeURIComponent((it.file.name || 'picture').slice(0, 120)), {
          method: 'POST',
          headers: { 'content-type': p.type || 'application/octet-stream' },
          body: p.body
        });
      }).then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) {
          if (!r.ok) throw new Error((j && j.error) || ('upload failed (HTTP ' + r.status + ')'));
          return j.image.blob;
        });
      }).then(function (sha) {
        it.blob = sha;
        if (spin.parentNode) spin.parentNode.removeChild(spin);
        return sha;
      }).catch(function (err) {
        if (spin.parentNode) spin.parentNode.removeChild(spin);
        it.failed = true;
        if (it.node) {
          it.node.className = 'thumb bad';
          it.node.appendChild(el('div', 'err', 'failed'));
        }
        throw err;
      });
    });
    return Promise.all(jobs).then(function (ids) {
      if (attachBtn) attachBtn.className = '';
      return ids;
    }, function (err) {
      if (attachBtn) attachBtn.className = '';
      throw err;
    });
  }

  function clearAttachments() {
    while (pending.length) dropAttachment(pending[0].key);
  }

  function initAttach() {
    if (attachBtn && fileInput) {
      attachBtn.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        addFiles(fileInput.files);
        // Cleared so picking the SAME file twice in a row still fires change.
        fileInput.value = '';
      });
    }
    // Paste. Reads .files rather than .items so a screenshot pasted from the
    // system clipboard and a file copied from a folder both arrive.
    var onPaste = function (e) {
      var dt = e.clipboardData;
      if (!dt) return;
      var files = dt.files && dt.files.length ? dt.files : null;
      if (!files && dt.items) {
        var got = [];
        for (var i = 0; i < dt.items.length; i++) {
          if (dt.items[i].kind === 'file') { var f = dt.items[i].getAsFile(); if (f) got.push(f); }
        }
        files = got.length ? got : null;
      }
      if (!files) return;
      var before = pending.length;
      addFiles(files);
      // Only swallow the paste if we actually took something, or pasting text
      // into the box would stop working.
      if (pending.length > before) e.preventDefault();
    };
    if (input) input.addEventListener('paste', onPaste);
    document.addEventListener('paste', function (e) {
      if (e.target === input) return; // already handled above
      onPaste(e);
    });
    // Drag and drop, for the desktop case. Guarded the same as everything else.
    var depth = 0;
    document.addEventListener('dragenter', function (e) {
      if (!e.dataTransfer) return;
      depth++; document.body.classList.add('dropping');
    });
    document.addEventListener('dragleave', function () {
      depth = Math.max(0, depth - 1);
      if (!depth) document.body.classList.remove('dropping');
    });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      depth = 0; document.body.classList.remove('dropping');
      if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });
  }

  /*
   * The one write path for a new message. `conversationId` is passed explicitly
   * rather than read from `activeConv` here, because a dictated utterance must
   * land in the conversation that was open when it was *spoken* — not wherever
   * the user has switched to while it was being transcribed.
   */
  function postTask(text, from, conversationId, images) {
    var payload = { text: text, from: from, conversationId: conversationId || activeConv };
    if (images && images.length) payload.images = images;
    return fetch('/tasks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('send failed (HTTP ' + r.status + ')'));
        return j;
      });
    });
  }

  // `from` marks the origin of the message: 'web' when typed, 'voice' when dictated.
  function doSend(from) {
    if (sending) return Promise.resolve(false);
    // Send pre-empts the stitch debounce: the words are already in the box, and
    // letting the timer fire too would post them twice.
    if (pendingInBox) { from = 'voice-conversation'; clearStitch(true); }
    var text = input.value;
    // A picture with no caption is a whole message on a phone, so an empty box
    // is only refused when there is nothing attached either.
    if (!text.trim() && !pending.length) { input.focus(); return Promise.resolve(false); }
    /*
     * Refuse before trying, when we already know there is nothing to try. The
     * button is disabled in this state, but Enter reaches here too, and so does
     * a dictated utterance — and the one outcome that must never happen is a
     * message that looks sent and is not. This is also why there is no offline
     * send queue: the honest failure is worth more than a hopeful one.
     */
    if (offlineAt) {
      showErr('Offline — not sent. Your words are still here; send them when you are back on.', true);
      return Promise.resolve(false);
    }
    if (text.length > MAX_CHARS) {
      showErr('Too long — ' + text.length + ' of ' + MAX_CHARS + ' characters.');
      return Promise.resolve(false);
    }
    var ok = true;
    sending = true; sendBtn.disabled = true; clearErr();
    var origin = from === 'voice' || from === 'voice-conversation' ? from : 'web';
    /*
     * Pictures go up FIRST and the message only follows once every one of them
     * has a sha. The other order would post his words attached to an upload
     * that then failed, leaving a message in the thread pointing at nothing.
     * A blob that did upload is remembered on its tray item, so a retry after a
     * partial failure re-sends only what is still missing.
     */
    return uploadPending().then(function (ids) {
      return postTask(text, origin, activeConv, ids);
    }).then(function () {
      input.value = '';            // cleared only after the POST succeeded
      clearAttachments();          // ...and so is the tray
      autosize();
      return poll(false);
    }).then(function () {
      scrollBottom();
    }).catch(function (err) {
      // Draft and attachments are left untouched so nothing is ever lost.
      ok = false;
      showErr('Not sent — ' + ((err && err.message) || 'network error') +
        '. Your text and pictures are still here.');
    }).then(function () {
      sending = false; sendBtn.disabled = false;
      return ok;
    });
  }

  sendBtn.addEventListener('click', function () { doSend('web'); });
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    // Enter sends; Shift+Enter is a newline. Ctrl/Cmd+Enter still sends too.
    if (e.shiftKey) return;
    e.preventDefault();
    doSend('web');
  });
  errBar.addEventListener('click', clearErr);

  /*
   * Coming back to the window puts the cursor in the composer, so you can switch
   * to this tab and just start typing.
   *
   * Gated on a fine pointer on purpose. On a phone, focusing a textarea throws up
   * the on-screen keyboard — having that happen every single time you switch apps
   * would be unusable, and there is no way to focus without it. So desktop gets
   * real auto-focus and touch devices are left alone.
   */
  var AUTOFOCUS = !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches);

  function focusComposer() {
    if (!AUTOFOCUS || document.hidden) return;
    if (vox) return; // never yank focus mid-dictation
    var el = document.activeElement;
    // Someone typing in another field keeps it.
    if (el && el !== input && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
    // Don't destroy a selection the user is in the middle of copying.
    var sel = window.getSelection && window.getSelection();
    if (sel && String(sel).trim()) return;
    try { input.focus({ preventScroll: true }); } catch (e) {
      try { input.focus(); } catch (e2) { /* focus is a nicety, never fatal */ }
    }
  }

  window.addEventListener('focus', focusComposer);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { clearTimeout(timer); fails = 0; tick(); focusComposer(); resumeAudio(); }
  });

  /*
   * Phones suspend a backgrounded tab's audio, and both contexts come back
   * suspended — a conversation left running would sit there deaf and mute. Ask
   * them to resume on the way back in. This cannot always work (iOS may require
   * a fresh gesture), which is why the conversation says what state it is in
   * rather than pretending.
   */
  function resumeAudio() {
    [playCtx, vox && vox.ctx].forEach(function (ctx) {
      if (!ctx || ctx.state !== 'suspended' || !ctx.resume) return;
      var p = null;
      try { p = ctx.resume(); } catch (e) { /* handled below, like a rejection */ }
      /*
       * iOS refuses without a fresh user gesture, and refuses with a REJECTED
       * PROMISE. Left unhandled that is an uncaught-error report every time the
       * tab is opened; worse, the conversation is still deaf and the bar used
       * to go on saying otherwise. Whichever way it goes, re-read the truth.
       */
      if (p && p.then) p.then(reconcileMic, reconcileMic);
      else reconcileMic();
    });
  }
  /** Make the status bar agree with the microphone, whatever just happened. */
  function reconcileMic() { if (vox) micChanged(vox); }
  window.addEventListener('resize', function () { if (nearBottom()) scrollBottom(); });

  // ------------------------------------------------------------------ voice dictation
  /*
   * Tap the mic, talk, stop talking — the message sends itself.
   *
   * Mic audio is captured as raw PCM, watched frame by frame for loudness, and
   * ended automatically after SILENCE_MS of quiet. The speech is then downsampled
   * to 16 kHz mono int16 and POSTed to /stt, which relays it to a whisper engine
   * on this machine and returns the text. The transcript goes into the composer
   * and is sent through the normal send path, so a failed send leaves the words
   * in the box exactly like a typed message. Nothing leaves the machine, and the
   * request is root-relative like every other one — so it works unchanged behind
   * an HTTPS reverse proxy.
   *
   * The thresholds below are the knobs worth turning if endpointing feels wrong:
   * raise SILENCE_MS if it cuts you off mid-thought, raise NOISE_MULT/RMS_FLOOR
   * if a noisy room keeps it from ever hearing silence. SILENCE_MS has already
   * been raised once for exactly that reason — read the note on it before
   * moving it back.
   */
  var V = {
    RATE: 16000,         // sample rate the engine wants
    FRAME: 512,          // samples per analysis frame (~32 ms at 16 kHz)
    CALIB_MS: 400,       // ambient noise is measured for this long before listening
    NOISE_MULT: 2.2,     // speech must be this many times louder than the room
    RMS_FLOOR: 0.010,    // ...and at least this loud outright
    START_MS: 120,       // sustained loud audio before it counts as speech
    /*
     * Trailing silence that ends a one-shot dictation. Was 1200, and that was
     * wrong — DO NOT TUNE IT BACK DOWN because short utterances feel slow.
     *
     * The old value came with the reasoning that one-shot means "the user is
     * deliberately saying one thing and wants it to end promptly". That is not
     * how this user dictates: he pauses to think mid-sentence, and 1.2 s is
     * shorter than his thinking pause, so messages were being cut off in the
     * middle — "I mean that my…", "Okay, I'm so dumb of…" are both real
     * examples from one evening's queue.
     *
     * The trade-off is real in both directions: a longer window means every
     * short utterance takes about a second longer to send. That is the cheaper
     * mistake by a wide margin. A truncated message costs a whole round trip to
     * notice and repair, on a phone, and the repair is itself dictated.
     */
    SILENCE_MS: 2400,
    // Conversation mode is longer still: there the user is talking continuously
    // and the stitch debounce joins the fragments anyway.
    CONV_SILENCE_MS: 3000,
    NO_SPEECH_MS: 8000,  // give up if nothing is ever said
    MAX_MS: 60000,       // hard cap on one dictation
    MIN_SPEECH_MS: 250,  // shorter than this is a cough, not a message
    PRE_ROLL_MS: 250,    // audio kept from just before speech was detected
    TAIL_MS: 300,        // audio kept after speech stopped
    /*
     * A capture graph that has stopped delivering frames for this long is not
     * listening, whatever it claims about itself. Well clear of any scheduling
     * hiccup (frames arrive every ~32 ms), and short enough that you find out
     * before you have said a whole sentence into nothing. See micFault().
     */
    STALL_MS: 2000
  };

  /*
   * Conversation mode + spoken replies.
   *
   * THE PROBLEM THIS SECTION EXISTS TO SOLVE: with the microphone live and the
   * speaker playing, the page hears its own voice, transcribes it, posts it as a
   * message, gets a reply, speaks that, hears it... forever. Six independent
   * defences, so that no single one failing produces that loop:
   *
   *   1. `track.enabled = false` on the mic track before playback starts. The
   *      browser then hands us digital silence — this is the load-bearing one,
   *      and it holds even if every line of JS below is wrong.
   *   2. onFrame() returns immediately while gated: nothing is buffered, no
   *      loudness is measured, endpointing cannot fire.
   *   3. Whatever was half-captured when the gate closed is thrown away, so a
   *      fragment cannot be stitched onto the next utterance.
   *   4. SETTLE_MS of silence after playback ends before the mic is trusted
   *      again — room reverb and Bluetooth latency outlive `onended`.
   *   5. A transcript that overlaps what we just said is dropped as an echo,
   *      even if it somehow got through 1-4.
   *   6. `echoCancellation: true` on the capture stream. Real AEC where the
   *      device offers it — a bonus, never the defence.
   *
   * Tuning notes: SETTLE_MS is the one to raise if a reply's tail ever comes
   * back as a message (Bluetooth speakers are the likely culprit). ECHO_OVERLAP
   * is the one to raise if genuine replies get eaten for quoting the agent.
   */
  var C = {
    SETTLE_MS: 500,          // quiet gap after playback before the mic is live again
    ECHO_WINDOW_MS: 4000,    // how long a transcript is still suspected of being our own voice
    ECHO_OVERLAP: 0.7,       // share of heard words that must be in what we just said
    MIN_SPEECH_MS: 350,      // stricter than one-shot: nothing here is confirmed before posting
    IDLE_RECALIB_MS: 10000,  // re-measure the room after this long hearing nothing
    MAX_QUEUE: 4,            // utterances allowed to pile up behind transcription
    MAX_SPEAK: 900,          // characters sent to /tts; the rest stays on screen
    /*
     * A trailing-edge debounce on the MESSAGE, not the audio. Even with a long
     * silence window, one train of thought still arrives as several utterances —
     * so a finished transcript waits this long before being posted, and anything
     * that arrives meanwhile is appended to it instead of becoming its own
     * message. The wait re-arms while speech is in progress or a transcription is
     * still in flight, so it only ever fires once the user has genuinely stopped.
     */
    STITCH_MS: 1800,
    /*
     * A ceiling on that debounce, and it is load-bearing.
     *
     * `stillTalking()` reports speech whenever the endpointer sits in its
     * 'speak' phase — and a room with background noise (a fan, a television,
     * someone packing a suitcase) holds it there indefinitely, because every
     * rustle refreshes the last-loud timestamp. The re-arm then never fires and
     * the message is NEVER posted, while the status bar says it is about to be.
     * A page that has silently stopped sending is indistinguishable from a dead
     * one, and the reload it provokes is what misroutes the next message.
     *
     * Measured from the last transcript that actually arrived, not from the
     * start of the pending message, and only consulted when nothing is in
     * flight — see wedged(). That distinction is what keeps this from
     * reintroducing the fragmentation bug: a genuine train of thought keeps
     * producing transcripts and keeps its deferral, whereas a wedged endpointer
     * produces nothing and gets cut loose.
     */
    MAX_DEFER_MS: 12000,
    // ...and a ceiling on the buffer itself, well under the server's 8000-char
    // limit, so a long noisy stretch cannot grow one unsendable message.
    MAX_PENDING: 4000
  };

  var convOn = false;        // conversation mode engaged
  var micGated = false;      // defence 1-3: the mic is muted because we are talking
  var convQueue = [];        // captured utterances waiting to be transcribed
  var convBusy = false;      // a transcription is in flight
  var speakOn = false;       // spoken replies enabled (independent of the mic)
  var audioUnlocked = false; // a user gesture has been spent on unlocking playback
  var playCtx = null;        // AudioContext used only for playback
  var playing = null;        // { token } of the reply currently being spoken

  var speakQueue = [];       // replies waiting to be spoken
  var speaking = false;

  var audioWarned = false;

  var WORKLET = 'class P extends AudioWorkletProcessor{' +
    'constructor(o){super();this.n=o.processorOptions.n;this.b=new Float32Array(this.n);this.i=0;}' +

    'for(var k=0;k<c.length;k++){this.b[this.i++]=c[k];' +
    'if(this.i===this.n){this.port.postMessage(this.b);this.b=new Float32Array(this.n);this.i=0;}}' +
    'return true;}}' +
    'registerProcessor("pcm",P);';

  var micBtn = document.getElementById('mic');
  var convoBtn = document.getElementById('convo');
  var spkBtn = document.getElementById('spk');
  var stopBtn = document.getElementById('vstop');
  var voiceBar = document.getElementById('voice');
  var vtext = document.getElementById('vtext');
  var meter = document.querySelector('#meter i');
  var vox = null; // the live capture session (one-shot or conversation), or null

  // bar also gets `live`, which is what reveals the Stop button.
  function vStatus(msg, mood) {

  }
  function vHide() {

  }

  function resample(x, inRate, outRate) {
    if (inRate === outRate) return x;
    // Box average rather than plain picking: downsampling without it aliases badly.
    var ratio = inRate / outRate;
    var out = new Float32Array(Math.floor(x.length / ratio));
    for (var i = 0; i < out.length; i++) {
      var a = Math.floor(i * ratio);

      lastLoudMs: 0, speechStartMs: 0,

      fault: null, lastFrameAt: 0, watch: null

  }

  /*
   * ==================================================================
   * IS THE MICROPHONE ACTUALLY LISTENING? Not "did we ask it to" — is it.
   *
   * THE BUG THIS EXISTS TO KILL: the bar said "Listening — go ahead." when it
   * was not listening, intermittently. It is dictated into from a phone, so a
   * bar that lies costs a whole message — spoken into nothing, and not noticed
   * until the reply never comes.
   *
   * The cause was that the status line was written by whoever last had an
   * opinion about what *should* be happening. Start the mic, write the words,
   * leave them there until something deliberately stops. Every way the
   * microphone goes away WITHOUT being asked therefore left the words standing,
   * and on a phone that is most of the ways it ends:
   *
   *   - the source goes for good ('ended'): a Bluetooth headset walks out of
   *     range, another app claims the capture device, the permission is revoked.
   *     The stream object survives, the graph stays wired, and the source node
   *     quietly emits digital silence forever. Conversation mode has no timeout
   *     by design, so it sat there saying "go ahead" until the tab was closed.
   *   - the source is borrowed ('muted'): an incoming call. Same silence — but
   *     it comes back, so this one must NOT tear the conversation down.
   *   - the tab is backgrounded or the screen locks: the AudioContext is
   *     suspended and stops pulling the graph. Nothing ends, nothing mutes, no
   *     frame ever arrives again, and every object still looks healthy.
   *   - resume() is refused (iOS wants a fresh gesture, and refuses with a
   *     rejected promise), or the worklet simply dies. NO event fires for these
   *     at all, which is why there is a watchdog as well as listeners.
   *
   * So the bar is DERIVED from the answer below and never from an intention.
   * If you are reaching for another boolean that means "we think we are
   * listening" — this function is the thing you actually wanted.
   */
  function micTrack(s) {

    } catch (e) { return null; }
  }

    s = s || vox;

    var t = micTrack(s);

    if (state === 'closed') return 'closed';
    if (state && state !== 'running') return 'suspended';
    // Last resort, and the only check that catches a graph which has stopped
    // without anything saying so. Not consulted before the first frame lands.
    if (s.lastFrameAt && Date.now() - s.lastFrameAt > V.STALL_MS) return 'stalled';
    return null;

  // just moves the confusion along.
  var MIC_FAULT_MSG = {
    ended: 'Not listening — the microphone was taken away. Another app has it, or a headset disconnected. Start it again when you have it back.',
    muted: 'Not listening — something else is using the microphone. It comes back on its own.',
    suspended: 'Not listening — the browser stopped the audio while this tab was in the background. Tap the page, then start again.',
    stalled: 'Not listening — audio has stopped arriving. Start it again.',
    closed: ''

  function faultStatus(why) {

  }

  /*

   * so there is exactly one description of what is on screen.

  function micChanged(s) {

   */
  function micLost(s) {
    var GONE = 'The microphone stopped — another app took it, or a headset disconnected.';
    logClient('mic-lost', { mode: s.mode, conv: s.mode === 'conv', phase: s.phase });

      // how nothing already said gets lost on the way out.
      if (convOn) stopConversation('mic-lost');
      else if (vox === s) { vox = null; teardown(s); }
      vStatus(MIC_FAULT_MSG.ended, 'deaf');

    }

     * message, so it is transcribed rather than binned — losing it would be the
     * same failure as the lying indicator, one step further along.

    var salvage = s.phase === 'speak' && (s.lastLoudMs - s.speechStartMs) >= V.MIN_SPEECH_MS;

   * what makes a conversation a conversation: the stream, the graph and the

   * have been talking over it or after a long silence.

  function transcribeAndSend(s) {

  function onFrame(block) {

    // keep arriving as digital silence, and micFault() must not call that a
    // stall. This timestamp is the only proof that audio is genuinely flowing.
    s.lastFrameAt = Date.now();
    // DEFENCE 2. Nothing is buffered and no loudness is measured while we are
    // speaking, so no endpoint can fire and no audio exists to transcribe.

    s.blocks.push(block);

  /*
   * End of one utterance inside a conversation. The mic is NOT stopped: the PCM
   * is handed to the transcription queue and capture resets for the next thing

   * transcribed does not lose it.

    // threads while this is being transcribed must not misroute it.

  // A muted sink keeps the graph pulled without anything being audible.

  /*

  function markBlocked(btn, reason) {

  /*
   * Open the microphone and wire up the capture graph. Shared by one-shot

  function openCapture(mode) {

      // DEFENCE 6. Real acoustic echo cancellation where the device offers it.
      // It is a bonus on top of the hard gate and never a substitute: plenty of

      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }

        // refuses, we get its native rate and resample in resample() instead.
        try { ctx = new AC({ sampleRate: V.RATE }); } catch (e) { ctx = new AC(); }
        s = newSession(stream, ctx, mode);
        s.source = ctx.createMediaStreamSource(stream);
      } catch (err) {

        // recording indicator stays lit with nothing listening.
        if (s) teardown(s);
        else try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        throw captureErr(err, 'could not open an audio context');
      }
      return attach(s).then(function () {
        // A rejected resume() is how iOS says "not without a fresh gesture".
        // Unhandled it is an uncaught error report; either way micFault() is
        // what decides whether we ended up listening, so it is safe to ignore.
        if (s.ctx.state === 'suspended' && s.ctx.resume) {
          try { var p = s.ctx.resume(); if (p && p.then) p.then(null, function () {}); } catch (e) {}

      }).catch(function (err) {

      });
    });
  }

  /** Turn a getUserMedia/capture rejection into a message worth reading. */
  function micError(err) {
    var name = (err && err.name) || '';
    var msg, sticky = false;
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
      // Distinct from 'insecure': the browser *can* record, you said no.
      msg = 'Microphone permission denied — this site is blocked from using the mic. ' +
        'Allow it in the browser\'s site settings (the icon by the address bar), then tap the mic again.';
      sticky = true;
    } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
