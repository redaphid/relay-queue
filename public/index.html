<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  `user-scalable=no` because pinch-zooming a full-bleed chat detaches the page
  from the screen edges and strands you somewhere you cannot get back from;
  `viewport-fit=cover` because the safe-area insets below depend on it; and
  `interactive-widget=resizes-content` because otherwise the on-screen keyboard
  shrinks only the VISUAL viewport, leaving this fixed-height layout — and the
  composer pinned to the bottom of it — behind the keyboard. See initNoZoom()
  and fitToKeyboard() for the halves of this no browser will honour from here.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>relay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='13'%20fill='%232f6fed'/%3E%3C/svg%3E">
<!--
  Installable, so the thread can be read with no connection at all.

  `crossorigin="use-credentials"` is not optional here and is easy to miss: a
  manifest is fetched WITHOUT cookies by default, so behind Cloudflare Access it
  would come back as the login page and the install prompt would simply never
  appear, with nothing in the page to say why.
-->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<!-- Colours the Android status bar to match the page, in whichever theme is on. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116">
<style>
  /*
   * Colour, on purpose.
   *
   * Two independent palettes, kept apart so neither can be mistaken for the other:
   *
   *   1. The PLAYFUL one — a per-conversation hue (`--hue`, set from JS by
   *      hashing the conversation id) plus a rainbow used as an accent only:
   *      the header rule, the send button, active controls. Never message text.
   *      Because the hue is derived from the id, the colour is information —
   *      it tells you at a glance which conversation you are in.
   *
   *   2. The SEMANTIC one — lifecycle (pending/claimed/answered) and trouble
   *      (offline/recording/error). These are FIXED. They never follow the
   *      conversation hue, because "nothing is responding" must never come out
   *      looking festive, and a message's state must mean the same thing in
   *      every conversation.
   *
   * Lifecycle states carry a glyph as well as a colour: hue alone is not
   * information anyone can rely on.
   */
  :root {
    --hue: 217; --hue2: 267;   /* overwritten per conversation */
    --bg:#f4f6f8; --fg:#14161a; --muted:#667085; --line:#dfe3e8; --panel:#ffffff;
    --accent: hsl(var(--hue) 78% 48%);
    --accent-soft: hsl(var(--hue) 78% 48% / .10);
    --accent-grad: linear-gradient(135deg, hsl(var(--hue) 84% 54%), hsl(var(--hue2) 76% 56%));
    --user-bg: var(--accent); --user-fg:#ffffff;
    --agent-bg:#ffffff; --agent-fg:#14161a;
    --err-fg:#8a2018; --err-bg:#fdeceb; --off:#c2410c; --rec:#c0271d;
    /* Lifecycle pills: dark text on a light fill in both themes, so contrast
       never depends on which one is active. */
    --pend-bg:#fde68a; --pend-fg:#5c3d00;
    --claim-bg:#ddd6fe; --claim-fg:#3b1d72;
    --done-bg:#a7f3d0; --done-fg:#053f2c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1116; --fg:#e6e8ec; --muted:#98a2b3; --line:#242a35; --panel:#141922;
      --accent: hsl(var(--hue) 80% 62%);
      --accent-soft: hsl(var(--hue) 80% 62% / .16);
      --accent-grad: linear-gradient(135deg, hsl(var(--hue) 72% 52%), hsl(var(--hue2) 66% 54%));
      --user-bg: var(--accent); --user-fg:#08111f;
      --agent-bg:#1a202b; --agent-fg:#e6e8ec;
      --err-fg:#ffb4ab; --err-bg:#3a1714; --off:#fdba74; --rec:#e5484d;
      --pend-bg:#facc15; --pend-fg:#3a2800;
      --claim-bg:#c4b5fd; --claim-fg:#2a1157;
      --done-bg:#6ee7b7; --done-fg:#04301f;
    }
  }
  /* The one unapologetically rainbow thing: a 3px rule under the header. */
  @keyframes drift { to { background-position: 200% 0; } }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    /* Kills double-tap-to-zoom, and the 300ms tap delay that comes with it,
       without touching one-finger scrolling or text selection. */
    touch-action: manipulation;
    display: flex; flex-direction: column;
    /* `svh`, not `dvh`: the SMALL viewport is the smallest the visible area
       ever gets — browser chrome fully extended — so the app can be shorter
       than what is on screen but never taller than it. Only the second of
       those can hide the composer, and hiding the composer is the bug this
       page has now shipped twice. `vh` first, for browsers with neither. The
       keyboard is a separate mechanism again: see fitToKeyboard(). */
    height: 100vh; height: 100svh;
    overflow: hidden;
  }
  header {
    position: relative;
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 14px calc(10px);
    padding-top: calc(10px + env(safe-area-inset-top));
    background:
      linear-gradient(var(--accent-soft), var(--accent-soft)),
      var(--panel);
    border-bottom: 1px solid var(--line);
  }
  /* Playful, but three pixels of it. Slow enough to be a background detail. */
  header::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
    background: linear-gradient(90deg,
      #f43f5e, #f59e0b, #facc15, #22c55e, #06b6d4, #6366f1, #a855f7, #f43f5e);
    background-size: 200% 100%;
    animation: drift 18s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    header::after { animation: none; background-size: 100% 100%; }
  }
  header b {
    font-size: 16px; font-weight: 650; letter-spacing: .01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #menu {
    position: relative; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; margin-left: -6px; padding: 0;
    color: var(--fg); background: transparent;
    border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #menu svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  /* Something happened in a conversation you are not looking at. */
  #menudot {
    display: none; position: absolute; top: 6px; right: 6px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--rec);
  }
  #menudot.show { display: block; }

  /* ---- the conversation drawer ---- */
  #drawer { position: fixed; inset: 0; z-index: 20; }
  #drawer[hidden] { display: none; }
  #scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .18s ease; }
  #drawer.open #scrim { opacity: 1; }
  #panel {
    position: absolute; inset: 0 auto 0 0;
    width: min(86vw, 340px);
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform .18s ease;
    overflow-y: auto; overscroll-behavior: contain;
  }
  #drawer.open #panel { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    #scrim, #panel { transition: none; }
  }
  .prow { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; }
  .prow b { font-size: 15px; }
  #drawerclose {
    margin-left: auto; flex: 0 0 auto;
    width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent;
    border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #newtitle {
    flex: 1 1 auto; min-width: 0;
    font-family: inherit; font-size: 16px;
    min-height: 44px; padding: 8px 12px;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px;
  }
  #newconv {
    flex: 0 0 auto; width: 44px; height: 44px;
    font-family: inherit; font-size: 24px; line-height: 1;
    color: #fff; background: var(--accent-grad);
    border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #newconv:disabled { opacity: .5; }
  #converr {
    display: none; margin: 0 4px 8px; padding: 8px 10px; font-size: 14px;
    color: var(--err-fg); background: var(--err-bg); border-radius: 10px;
  }
  #converr.show { display: block; }
  #convlist { display: flex; flex-direction: column; gap: 4px; }
  .conv {
    display: block; width: 100%; min-height: 48px;
    padding: 10px 12px; margin: 0;
    font: inherit; text-align: left; color: var(--fg);
    background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .conv { border-left: 4px solid transparent; }
  .conv.active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--line); }
  .convtop { display: flex; align-items: baseline; gap: 6px; }
  .convname {
    flex: 1 1 auto; min-width: 0; font-weight: 650; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .conv.active .convname { color: var(--accent); }
  .convwhen { flex: 0 0 auto; font-size: 12px; color: var(--muted); }
  .convdot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
  .convsnip {
    margin-top: 2px; font-size: 13px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .convmeta { margin-top: 3px; font-size: 12px; color: var(--off); }
  /* Sparkline: tall enough to read on a phone, no gridlines, no labels. */
  .spark {
    display: flex; align-items: flex-end; gap: 2px;
    height: 24px; margin-top: 8px;
  }
  .spark i { flex: 1 1 0; min-width: 0; background: var(--line); border-radius: 1px 1px 0 0; }
  /* Empty reads as a deliberate flat baseline, never as a broken empty box. */
  .spark.quiet i { background: var(--line); opacity: .8; }
  .convagent { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; font-size: 12px; }
  .convagent .adot { flex: 0 0 auto; font-size: 11px; }
  .convagent.watching { color: #1a7f4b; }
  .convagent.idle { color: var(--muted); }
  .convagent.stale { color: var(--off); }
  /* Beating but not acting. This used to render as the healthiest row here. */
  .convagent.stuck { color: var(--rec); font-weight: 700; }
  /* The one thing this list most needs to shout. Not hue alone: it also says
     "NOT RESPONDING" and swaps the glyph for an exclamation mark. */
  .convagent.silent { color: var(--rec); font-weight: 700; }
  .convagent.never, .convagent.unassigned { color: var(--muted); }
  @media (prefers-color-scheme: dark) { .convagent.watching { color: #4ade80; } }
  #statusopen {
    margin-top: 12px; width: 100%; min-height: 48px;
    font: inherit; font-size: 15px; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }

  /* ---- the status view ---- */
  #statusview {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  }
  #statusview[hidden] { display: none; }
  #statusclose {
    margin-left: auto; width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  /* The headline answers "is it alive?" without scrolling or interpretation. */
  .shead {
    padding: 16px; margin-bottom: 12px;
    font-size: 19px; line-height: 1.35; font-weight: 650;
    border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
  }
  .shead.ok    { color: #1a7f4b; border-color: #1a7f4b55; background: #1a7f4b12; }
  #statusopen { border-left: 4px solid transparent; border-image: linear-gradient(180deg, #f43f5e, #facc15, #22c55e, #6366f1) 1 / 0 0 0 4px; }
  .shead.idle  { color: var(--muted); }
  .shead.warn  { color: var(--off); border-color: currentColor; background: #c2410c12; }
  .shead.alarm { color: var(--rec); border-color: currentColor; background: #c0271d14; }
  .ssub { margin-top: 6px; font-size: 14px; font-weight: 400; opacity: .85; }
  @media (prefers-color-scheme: dark) { .shead.ok { color: #4ade80; border-color: #4ade8055; } }

  .scard {
    padding: 12px 14px; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .scard h2 { margin: 0 0 8px; font-size: 13px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }
  .srow { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; font-size: 15px; }
  .srow .k { flex: 1 1 auto; min-width: 0; color: var(--muted); }
  .srow .v { flex: 0 0 auto; text-align: right; }
  .srow .v.bad { color: var(--rec); }
  .srow .v.good { color: #1a7f4b; }
  @media (prefers-color-scheme: dark) { .srow .v.good { color: #4ade80; } }
  .sline { padding: 6px 0; font-size: 14px; border-top: 1px solid var(--line); }
  .sline:first-of-type { border-top: 0; }
  .sline .w { color: var(--muted); font-size: 12px; }
  .sline .t { overflow-wrap: anywhere; }
  .snote { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .sempty { font-size: 15px; color: var(--muted); }

  /* ---- the subagent activity panel ----
   *
   * Shares the status view's vocabulary (.shead/.scard/.srow/.sline) on purpose:
   * this is the same kind of screen answering a different question, and giving
   * it its own look would imply the two disagree about what a card means.
   */
  #actview {
    position: fixed; inset: 0; z-index: 31;
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  }
  #actview[hidden] { display: none; }
  #actclose {
    margin-left: auto; width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #acttitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #actopen {
    margin-top: 8px; width: 100%; min-height: 48px; padding: 0 12px;
    font: inherit; font-size: 15px; text-align: left; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    border-left: 4px solid transparent;
    border-image: linear-gradient(180deg, #06b6d4, #6366f1, #a855f7) 1 / 0 0 0 4px;
  }

  /*
   * THE IMPORTANT ONE. "Nobody taught this coordinator to report" is not a
   * status — it is the absence of one, and it must borrow the vocabulary of
   * neither health nor failure. It gets a DASHED edge, because a dashed border
   * reads as "no signal here" where every solid one on this screen reads as a
   * measurement that was actually taken. It is not `.ok` and not `.idle`: an
   * unreporting coordinator may be working flat out, and rendering that as a
   * calm empty feed is the same lie as a heartbeat with nobody home.
   */
  .shead.unknown {
    color: var(--fg);
    border: 1px dashed var(--muted);
    background: var(--panel);
  }
  .shead.unknown .ssub { opacity: 1; color: var(--muted); }

  /* One subagent. Never removed when it fails to finish — see renderActivity. */
  .subrow { display: flex; gap: 8px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
  .subrow:first-of-type { border-top: 0; }
  .subrow .sdot { flex: 0 0 auto; width: 1.2em; text-align: center; font-size: 12px; color: var(--muted); }
  .subrow .sbody { flex: 1 1 auto; min-width: 0; }
  .subname { font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
  .subtask { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .subwhen { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .subrow.running .sdot { color: #1a7f4b; }
  .subrow.running .subwhen { color: #1a7f4b; }
  .subrow.failed .sdot, .subrow.failed .subwhen { color: var(--rec); font-weight: 650; }
  /* Finished, but nobody said whether it worked. Not the same as "it worked". */
  .subrow.noverdict .subwhen { color: var(--off); }
  /* Running far longer than a subagent plausibly should: possibly a ghost still
     holding a git worktree. Surfaced, never timed out or tidied away. */
  .sublong { margin-top: 3px; font-size: 12px; color: var(--off); overflow-wrap: anywhere; }
  /* Where a timestamp came from. Quieter than .sublong: an inferred start is a
     caveat on a number, not a problem with the worker. */
  .subprov { margin-top: 3px; font-size: 12px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
  @media (prefers-color-scheme: dark) {
    .subrow.running .sdot, .subrow.running .subwhen { color: #4ade80; }
  }

  /* A caveat attached to a specific number, rather than buried in a footnote. */
  .scaveat {
    margin: 8px 0 0; padding: 8px 10px;
    font-size: 12px; line-height: 1.4; color: var(--off);
    background: #c2410c10; border: 1px dashed currentColor; border-radius: 10px;
  }
  .afeed .sline .t { overflow-wrap: anywhere; }
  .afeed .sline.bad .w { color: var(--rec); }

  /* The collapsed badge in the conversation list. Costs no extra request: the
     summary already rides along on /conversations. */
  .convact { display: flex; gap: 6px; align-items: baseline; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .convact .acount { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convact.live { color: #1a7f4b; font-weight: 650; }
  @media (prefers-color-scheme: dark) { .convact.live { color: #4ade80; } }

  /* ---- alerts: web push, quiet hours, and what is actually armed ---- */
  .nbtn {
    display: block; width: 100%; min-height: 48px; margin-top: 8px; padding: 0 14px;
    font: inherit; font-size: 15px; color: var(--fg); text-align: left;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .nbtn.primary { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .nbtn[disabled] { opacity: .5; cursor: default; }
  /* The one line that answers "is this browser armed?" — stated, never implied. */
  .nstate { display: flex; gap: 8px; align-items: baseline; font-size: 15px; padding: 2px 0 6px; }
  .nstate .dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .nstate.on .dot { background: #1a7f4b; }
  .nstate.warn .dot { background: var(--rec); }
  @media (prefers-color-scheme: dark) { .nstate.on .dot { background: #4ade80; } }
  .nrow { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 15px; }
  .nrow label { flex: 1 1 auto; min-width: 0; }
  /* 16px is a hard floor on every text-entry control, not a taste: below it,
     mobile Safari and Chrome zoom the page in on focus and never zoom back. */
  .nrow input[type="time"], .nrow select {
    font: inherit; font-size: 16px; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 44px;
    -webkit-appearance: none; appearance: none; max-width: 58%;
  }
  .nrow input[type="checkbox"] { flex: 0 0 auto; width: 22px; height: 22px; accent-color: var(--accent); }
  .ntz { font-size: 13px; color: var(--muted); margin: 6px 0 0; overflow-wrap: anywhere; }
  .ntz b { color: var(--fg); font-weight: 600; }
  #conn { margin-left: auto; font-size: 13px; color: var(--off); display: none; }
  #conn.show { display: inline; }
  /* Speaker toggle: mutes spoken replies independently of the microphone. */
  #spk {
    position: relative; margin-left: auto;
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #conn.show + #spk { margin-left: 8px; }
  /*
     Share lives in the header because the drawer was not a home for it: below
     the conversation list, it sat 625px past the bottom of the screen and he
     reported the feature as simply missing. Same 40px shape as its neighbours.
  */
  #hshare {
    position: relative; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; margin-left: 8px; padding: 0;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #hshare svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
  /* Lit when this conversation is currently published, so "is this public?" is
     answerable at a glance rather than by opening the panel. */
  #hshare.on { color: var(--accent); border-color: var(--accent); }
  #hshare.on::after {
    content: ''; position: absolute; top: -3px; right: -3px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--panel);
  }
  #spk svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
  #spk.on { color: var(--accent); border-color: var(--accent); }
  /* Muted is drawn struck through, the same language the blocked mic uses. */
  #spk:not(.on)::after {
    content: ''; position: absolute; left: 9px; top: 19px;
    width: 21px; height: 2px; border-radius: 2px;
    background: currentColor; transform: rotate(-45deg);
  }
  #spk.busy { color: var(--rec); border-color: var(--rec); }

  #thread {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 14px 12px 6px;
  }
  #empty { color: var(--muted); text-align: center; margin: 32px 12px; font-size: 15px; }

  .msg { max-width: 86%; margin: 0 0 12px; padding: 10px 13px; border-radius: 17px; }
  /* Blocks bring their own spacing now that the body is rendered Markdown, so
     `pre-wrap` would double every gap. Single newlines inside a paragraph are
     kept as <br> by the renderer, which is what preserves dictated line breaks. */
  .msg .body { white-space: normal; overflow-wrap: anywhere; word-break: break-word; }

  /* ---- rendered Markdown ------------------------------------------------ */
  .msg .body > :first-child { margin-top: 0; }
  .msg .body > :last-child { margin-bottom: 0; }
  .mdp { margin: 0 0 8px; }
  .mdh { margin: 10px 0 6px; font-weight: 700; line-height: 1.3; }
  .mdh1 { font-size: 19px; } .mdh2 { font-size: 17px; } .mdh3 { font-size: 16px; }
  .mdh4, .mdh5, .mdh6 { font-size: 15px; }
  .mdlist, .mdtasks { margin: 0 0 8px; padding-left: 22px; }
  .mdtasks { list-style: none; padding-left: 0; }
  .mdlist li { margin: 2px 0; }
  /* A nested list is a continuation of the row above it, not a new block, so it
     loses the trailing gap. A sub-list of tasks keeps a small indent of its own,
     since it has no bullet to sit under. */
  .mdlist .mdlist, .mdlist .mdtasks, .mdtasks .mdlist, .mdtasks .mdtasks { margin-bottom: 0; }
  .mdtasks .mdtasks, .mdlist .mdtasks { padding-left: 16px; }
  .msg .body hr {
    border: 0; height: 1px; margin: 11px 0;
    background: var(--line); opacity: .8;
  }

  /* ---- tables -----------------------------------------------------------
     An itinerary is a table, and a phone is 390px wide. A wide table gets its
     own horizontal scroller so it can never push the thread — or the composer —
     sideways: `max-width:100%` on the wrapper plus `min-width:0` on the flex
     parents is what actually contains it. `-webkit-overflow-scrolling` keeps
     the scroll feeling native under a thumb. */
  .mdtablewrap {
    max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 0 0 9px; border-radius: 10px;
    border: 1px solid var(--line);
    /* A faint edge, so it is discoverable that there is more to the right. */
    background: rgba(127, 127, 127, .06);
  }
  .mdtablewrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mdtable { border-collapse: collapse; width: auto; min-width: 100%; font-size: 14px; }
  .mdtable th, .mdtable td {
    padding: 7px 10px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--line);
    white-space: normal; min-width: 44px;
    /*
     * The bubble sets `overflow-wrap: anywhere` so a pasted URL cannot burst it.
     * Inside a table that rule is actively wrong: it rendered "09:15" as "09:1"
     * then "5" on the next line, and a departure time split across two lines is
     * worse than a table you have to scroll. Cells wrap BETWEEN words only, and
     * the wrapper's scroller absorbs whatever that costs in width.
     */
    overflow-wrap: normal; word-break: normal; hyphens: none;
  }
  /* A cell that is only a time, a date or a number never wraps at all. */
  .mdtable td:first-child, .mdtable th:first-child { white-space: nowrap; }
  .mdtable thead th {
    font-weight: 680; white-space: nowrap;
    background: rgba(127, 127, 127, .12);
    position: sticky; top: 0;
  }
  .mdtable tbody tr:last-child td { border-bottom: 0; }
  .mdquote {
    margin: 0 0 8px; padding: 2px 0 2px 10px;
    border-left: 3px solid var(--line); opacity: .85;
  }
  .msg .body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .92em; padding: 1px 5px; border-radius: 6px;
    background: rgba(127, 127, 127, .18);
  }
  .msg .body pre {
    margin: 0 0 8px; padding: 9px 11px; border-radius: 11px;
    overflow-x: auto; background: rgba(127, 127, 127, .16);
  }
  .msg .body pre code { padding: 0; background: none; white-space: pre; }
  .msg .body a { color: inherit; text-underline-offset: 2px; }

  /* ---- checklists -------------------------------------------------------
     The reason markdown is here at all. Rows are big enough to hit with a
     thumb: 44px is the smallest target that reliably works on a phone, and
     this list is read while walking around a bedroom holding a suitcase. */
  .mdtask {
    display: flex; align-items: flex-start; gap: 10px;
    margin: 0; padding: 2px 0; min-height: 44px;
    /* A task row is a flex container, so a NESTED list inside it would otherwise
       become a flex sibling and sit *beside* the label — which squeezed the
       parent's tap target from 287px to 113px at 390px wide. Wrapping, and
       forcing a sub-list to a full-width line, puts it underneath where it
       belongs. Caught by tools/mobile-selftest.js, which is the entire reason
       that suite exists. */
    flex-wrap: wrap;
  }
  .mdtask > .mdtasks, .mdtask > .mdlist { flex: 0 0 100%; width: 100%; }
  .mdtask label {
    display: flex; align-items: center; gap: 12px;
    flex: 1 1 auto; min-width: 0; cursor: pointer;
    /* The LABEL is the tap target, not the box: 44px tall and the full width of
       the row, so a thumb aimed anywhere near the words hits it. This is read
       while walking around holding a suitcase, one-handed. */
    min-height: 44px; padding: 4px 0;
    -webkit-tap-highlight-color: rgba(127, 127, 127, .18);
  }
  .mdtask input[type="checkbox"] {
    flex: 0 0 auto; width: 24px; height: 24px; margin: 0;
    accent-color: var(--accent); cursor: pointer;
  }
  .mdtask label:active { opacity: .7; }
  .mdtask .tlabel { flex: 1 1 auto; min-width: 0; }
  /* Done, and known to be done. Struck through as well as faded: a colour or an
     opacity on its own is not something everyone can read. */
  .mdtask.on .tlabel { text-decoration: line-through; opacity: .62; }
  /*
     A tick that has not been written through yet must NOT look identical to one
     that has. Three states, each with words rather than just a colour, because
     "it says it is done" being a lie is the failure this is designed against.
  */
  .tmark {
    flex: 0 0 auto; align-self: center;
    font-size: 11px; font-weight: 650; line-height: 1.6;
    padding: 0 7px; border-radius: 999px; white-space: nowrap;
  }
  .tmark[hidden] { display: none; }
  .tmark.saving { background: var(--claim-bg); color: var(--claim-fg); }
  .tmark.unsure { background: var(--pend-bg); color: var(--pend-fg); }
  .tmark.failed { background: var(--err-bg); color: var(--err-fg); cursor: pointer; }
  /* The whole row goes amber when the tick is not known to have landed, so it
     is visible while scanning rather than only when read. */
  .mdtask.unsettled { box-shadow: inset 3px 0 0 var(--pend-bg); padding-left: 8px; }
  .mdtask.broken { box-shadow: inset 3px 0 0 var(--err-fg); padding-left: 8px; }
  .msg .meta { margin-top: 5px; font-size: 12px; opacity: .72; }
  .msg.user {
    margin-left: auto; background: var(--accent-grad); color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg.user .meta { text-align: right; }
  /* Lifecycle, shown as a pill with a GLYPH as well as a colour — hue alone is
     not information a colourblind reader can use. Fixed colours, never the
     conversation hue: a state must mean the same thing everywhere. */
  .chip {
    display: inline-block; margin-left: 6px; padding: 1px 8px;
    font-size: 12px; font-weight: 650; line-height: 1.5;
    border-radius: 999px; white-space: nowrap;
  }
  .chip.pending { background: var(--pend-bg); color: var(--pend-fg); }
  .chip.claimed { background: var(--claim-bg); color: var(--claim-fg); }
  .chip.done    { background: var(--done-bg);  color: var(--done-fg); }
  /* A matching edge on the bubble, so the state is legible from across the
     thread without reading the pill. */
  .msg.user.st-pending { box-shadow: inset -4px 0 0 var(--pend-bg); }
  .msg.user.st-claimed { box-shadow: inset -4px 0 0 var(--claim-bg); }
  .msg.user.st-done    { box-shadow: inset -4px 0 0 var(--done-bg); }
  .msg.agent { margin-right: auto; background: var(--agent-bg); color: var(--agent-fg); border: 1px solid var(--line); border-bottom-left-radius: 6px; }

  #err {
    display: none; flex: 0 0 auto;
    margin: 0; padding: 9px 14px; font-size: 14px;
    color: var(--err-fg); background: var(--err-bg); border-top: 1px solid var(--line);
  }
  #err.show { display: block; }
  /* Sticky errors explain something the user has to act on, so they wait to be read. */
  #err.sticky { cursor: pointer; }
  #err.sticky::after { content: ' — tap to dismiss'; opacity: .65; }

  /*
   * The offline bar. Deliberately NOT the error bar: an error is an event that
   * has happened and can be dismissed, this is a condition that is still true.
   * It cannot be tapped away, because the whole point is that it stays up for
   * as long as what he is reading might be out of date.
   *
   * It sits directly above the composer, which is the one place it cannot be
   * missed by someone about to type — that is the message it is really
   * carrying: not "you are offline" but "this will not send".
   */
  #offbar {
    display: none; flex: 0 0 auto;
    margin: 0; padding: 9px 14px; font-size: 13px; line-height: 1.45;
    color: var(--off); background: var(--panel);
    border-top: 1px solid var(--line);
  }
  #offbar.show { display: block; }
  #offbar b { font-weight: 600; }
  #offbar .when { opacity: .8; }
  /* Offline is a state of the composer too, not just a banner above it. */
  #composer.off textarea { opacity: .75; }

  /* Voice dictation: status line + live input level, shown only while listening. */
  #voice {
    display: none; flex: 0 0 auto; align-items: center; gap: 10px;
    margin: 0; padding: 8px 14px; font-size: 14px; color: var(--muted);
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #voice.show { display: flex; }
  #meter {
    flex: 0 0 auto; width: 72px; height: 6px; border-radius: 3px;
    background: var(--line); overflow: hidden;
  }
  #meter i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }
  #voice.hearing { color: var(--fg); }
  #voice.hearing #meter i { background: var(--rec); }
  /* Mic is hard-gated while a reply plays; the bar says so in as many words. */
  #voice.speaking { color: var(--accent); }
  #voice.speaking #meter i { background: var(--accent); width: 100%; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #voice.speaking #meter i { animation: none; } }
  /*
   * Not listening. Coloured like an error rather than like the resting state,
   * because the failure this guards against is glancing at the bar mid-sentence
   * and reading it as "fine" — see micFault() for the full story.
   */
  #voice.deaf { color: var(--err-fg); font-weight: 650; }
  #voice.deaf #meter i { width: 0% !important; background: var(--err-fg); }
  #vstop {
    margin-left: auto; flex: 0 0 auto;
    font-family: inherit; font-size: 14px; font-weight: 650;
    min-height: 32px; padding: 0 12px;
    color: var(--err-fg); background: transparent;
    border: 1px solid currentColor; border-radius: 10px; cursor: pointer;
    -webkit-appearance: none; appearance: none; display: none;
  }
  #voice.live #vstop { display: inline-flex; align-items: center; }

  /*
     Two rows, not one: the tools on top, the box he types in below at full
     width. Inline, the three 48px buttons and Send left the textarea 114px
     wide on a 390px screen — 29% of it — and a narrow box wraps early, so it
     also grew TALLER than the two-row layout it replaced. Widening the input
     buys back vertical space rather than spending it.
  */
  #composer {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;
    padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #tools { display: flex; gap: 8px; align-items: center; }
  #entry { display: flex; gap: 8px; align-items: flex-end; }
  #mic, #convo {
    position: relative;
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; padding: 0;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 15px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #mic svg, #convo svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  #mic:disabled, #convo:disabled { opacity: .5; }
  /* Unusable here (almost always: not an https page). Struck through so it reads as
     blocked rather than broken — but still tappable, because the tap is what explains. */
  #mic.off, #convo.off { color: var(--muted); border-style: dashed; }
  #mic.off::after, #convo.off::after {
    content: ''; position: absolute; left: 11px; top: 22px;
    width: 24px; height: 2px; border-radius: 2px;
    background: currentColor; transform: rotate(-45deg);
  }
  #mic.on { color: #fff; background: var(--rec); border-color: var(--rec); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .62; } }
  @media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } }
  /* Conversation mode shares the mic's visual language; `on` is the same red. */
  #convo.on { color: #fff; background: var(--rec); border-color: var(--rec); }
  /* Muted while the agent is talking — steady blue, not the recording red. */
  #convo.gated { color: #fff; background: var(--accent); border-color: var(--accent); animation: none; }
  /* ---- attaching pictures ----
     #attach is a sibling of the mic and wears the same 48px shape, because it
     is the same KIND of thing: another way to put something into a message. */
  #attach {
    position: relative;
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; padding: 0;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 15px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #attach svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  /* iOS zooms the whole page when a form control under 16px takes focus, and
     the zoom does not come back. This one is hidden and cannot be focused, so
     it is safe today — but a file input defaults to 13.3px, and leaving that
     in place would arm the trap for whoever un-hides it. mobile-selftest
     checks every field for exactly this. */
  #filepick { font-size: 16px; }
  #attach:disabled { opacity: .5; }
  #attach.busy { color: #fff; background: var(--accent); border-color: var(--accent); }
  /*
     The tray of what is about to be sent. It sits ABOVE the composer and inside
     the same fixed bottom block, so it rides up with the keyboard instead of
     hiding behind it — the mistake that made a search box unusable elsewhere.
  */
  #tray {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
    padding: 8px 10px 0; background: var(--panel);
    overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  }
  #tray[hidden] { display: none; }
  .thumb {
    position: relative; flex: 0 0 auto; width: 80px; height: 80px;
    border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--bg);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 44px of tap area, drawn as a 26px dot. The target is what the thumb needs;
     the dot is what the picture needs. */
  .thumb .x {
    position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0;
    display: flex; align-items: flex-start; justify-content: flex-end;
    background: transparent; border: 0; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .thumb .x i {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: 3px 3px 0 0;
    font-style: normal; font-size: 17px; line-height: 1; color: #fff;
    background: rgba(0,0,0,.62); border-radius: 50%;
  }
  .thumb.bad { border-color: var(--bad, #dc2626); }
  .thumb .err {
    position: absolute; inset: auto 0 0 0; padding: 2px 4px;
    font-size: 10px; line-height: 1.2; color: #fff; background: rgba(220,38,38,.92);
  }
  .thumb .spin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); color: #fff; font-size: 11px; }
  /* Dropping a file anywhere on the thread. No hover states anywhere here —
     there is no hover on the device this is for; this only shows mid-drag. */
  body.dropping #thread { outline: 3px dashed var(--accent); outline-offset: -6px; }
  #input {
    flex: 1 1 auto; min-width: 0;
    font-family: inherit; font-size: 16px; line-height: 1.4;
    resize: none; overflow-y: auto;
    /*
       Two lines at rest. The keyboard covers half the screen, so the few lines
       above it are the whole of what he can see of what he is saying; one line
       meant a sentence scrolled out of view as he typed it.
       16px x 1.4 = 22.4 per line, plus 24 of padding.
    */
    /*
       40vh MINUS the tools row above it. The budget belongs to the composer as
       a whole, not to the textarea: leaving this at a flat 40vh after moving
       the icons onto their own line pushed Send below the bottom of the
       screen once a long dictated draft grew the box, with the keyboard up.
    */
    min-height: 70px; max-height: calc(40vh - 56px); padding: 12px;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 15px;
  }
  #send {
    flex: 0 0 auto; font-family: inherit; font-size: 16px; font-weight: 650;
    min-height: 48px; min-width: 80px; padding: 0 18px;
    color: #fff; background: var(--accent-grad);
    border: 0; border-radius: 15px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  /* One visible, colourful focus ring everywhere, instead of the browser's. */
  button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  #input:focus { border-color: var(--accent); }
  #send:disabled { opacity: .5; }
  /* ---- pictures ----
   *
   * He is judging pixel art on a phone. A thumbnail alone cannot answer the
   * question he actually has — "grey blob or good crate" — so every picture is
   * openable at full size, and the full-size view can be switched to ACTUAL
   * pixels with smoothing off. A 32px sprite blown up and blurred by the
   * browser's default interpolation is unjudgeable, which would make the whole
   * feature decorative.
   */
  .shots { margin-top: 8px; display: grid; gap: 6px; }
  .shots.one { grid-template-columns: 1fr; }
  /* Two up from the second picture on: a contact sheet and eleven sprites are
     both browsable, and neither becomes a column of full-width scrolling. */
  .shots.many { grid-template-columns: repeat(2, 1fr); }
  .shots img, img.relimg {
    display: block; background: var(--line);
    border: 1px solid var(--line); border-radius: 10px; cursor: zoom-in;
  }
  .shots.one img, img.relimg { width: 100%; height: auto; max-height: 60vh; object-fit: contain; }
  .shots.many img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
  img.relimg { margin: 8px 0; }
  /* The alt text, shown when the bytes do not arrive. Without this a failed
     image is an empty box that looks identical to a bug in this page. */
  .shots img, img.relimg { color: var(--muted); font-size: 12px; }

  /* ---- the full-size view ---- */
  #lightbox {
    position: fixed; inset: 0; z-index: 60; background: #000;
    display: flex; flex-direction: column;
  }
  #lightbox[hidden] { display: none; }
  #lbbar {
    display: flex; align-items: center; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
    color: #e6e8ec; font-size: 13px;
  }
  #lbcap { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lbbar a, #lbbar button {
    flex: 0 0 auto; min-height: 40px; padding: 0 10px;
    font: inherit; color: #e6e8ec; background: transparent;
    border: 1px solid #333a45; border-radius: 10px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  #lbclose { width: 44px; justify-content: center; font-size: 24px; border-color: transparent; }
  #lbwrap {
    flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #lbimg { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  /* Actual pixels, unsmoothed, and free to overflow into a scroll. This is the
     mode in which a 32x32 sprite can actually be judged. */
  #lbwrap.actual { display: block; }
  #lbwrap.actual #lbimg {
    max-width: none; max-height: none; width: auto; height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: zoom-out;
  }

  /* ---- the gallery ---- */
  #galview {
    position: fixed; inset: 0; z-index: 32;
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  }
  #galview[hidden] { display: none; }
  #galclose {
    margin-left: auto; width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #galtitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #galopen {
    margin-top: 8px; width: 100%; min-height: 48px; padding: 0 12px;
    font: inherit; font-size: 15px; text-align: left; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    border-left: 4px solid transparent;
    border-image: linear-gradient(180deg, #f59e0b, #ec4899, #8b5cf6) 1 / 0 0 0 4px;
  }
  #galgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  #galgrid img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    background: var(--line); border: 1px solid var(--line); border-radius: 10px; cursor: zoom-in;
  }
  .galempty { padding: 16px 0; color: var(--muted); font-size: 14px; }

  /* ---- choosing between pictures ----
     Sized for judging artwork one-handed in the dark: one big image, a label
     that stays put, one unmistakable commit button, and a filmstrip for the
     rest. Selection is never carried by colour alone — every chosen state also
     has a tick glyph and a solid ring. */
  .picker { margin-top: 8px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .pk-stage {
    position: relative; display: flex; align-items: center; justify-content: center;
    /* A neutral bed so a 2000x560 comparison sheet letterboxes instead of being
       cropped. Aspect ratios here are wild and must all survive. */
    background: var(--code); min-height: 180px;
  }
  .pk-big {
    display: block; max-width: 100%; max-height: 46vh; width: auto; height: auto;
    /* contain, never cover: cropping a sprite lineup to a square defeats the
       entire point of showing it large. */
    object-fit: contain; cursor: zoom-in;
  }
  .pk-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center;
    font-size: 22px; line-height: 1; color: #fff; background: rgba(0,0,0,.5);
    border: 0; border-radius: 50%; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .pk-prev { left: 6px; } .pk-next { right: 6px; }
  .pk-nav[disabled] { opacity: .3; }
  .pk-count {
    position: absolute; top: 8px; right: 8px; padding: 3px 9px;
    font-size: 12px; font-variant-numeric: tabular-nums; color: #fff;
    background: rgba(0,0,0,.6); border-radius: 999px;
  }
  /* The "this one is chosen" mark on the big image. Glyph AND ring AND fill. */
  .pk-mark {
    position: absolute; top: 8px; left: 8px; display: none;
    align-items: center; gap: 5px; padding: 4px 10px 4px 8px;
    font-size: 13px; font-weight: 650; color: #fff; background: #16a34a;
    border-radius: 999px;
  }
  .picker.on .pk-mark { display: inline-flex; }
  .picker.on .pk-stage { box-shadow: inset 0 0 0 4px #16a34a; }
  .pk-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .pk-label {
    flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 650;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .pk-choose {
    flex: 0 0 auto; min-height: 48px; padding: 0 16px;
    font: inherit; font-size: 15px; font-weight: 650;
    color: #fff; background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .pk-choose.on { background: #16a34a; }
  .pk-choose[disabled] { opacity: .6; }
  .pk-strip {
    display: flex; gap: 6px; padding: 0 10px 8px; overflow-x: auto;
    overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  }
  .pk-thumb {
    position: relative; flex: 0 0 auto; width: 64px; height: 64px; padding: 0;
    background: var(--code); border: 2px solid transparent; border-radius: 10px;
    overflow: hidden; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .pk-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Where you ARE (dashed) is deliberately a different language from what you
     CHOSE (solid + tick), so the two can never be read for one another. */
  .pk-thumb.here { border-color: var(--fg); border-style: dashed; }
  .pk-thumb.on { border-color: #16a34a; border-style: solid; }
  .pk-thumb.on::after {
    content: '\2713'; position: absolute; right: 2px; bottom: 1px;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff; background: #16a34a; border-radius: 50%;
  }
  .pk-sum { padding: 0 10px 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .pk-sum b { color: var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ---- sharing ----
     Sized for a thumb on a 390px screen: every control is full width and at
     least 48px tall, and nothing here is revealed by hover, because there is
     no hover on the device this is for. */
  #shareview {
    position: fixed; inset: 0; z-index: 33;
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  }
  #shareview[hidden] { display: none; }
  #shareclose {
    margin-left: auto; width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #sharetitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #shareopen {
    margin-top: 8px; width: 100%; min-height: 48px; padding: 0 12px;
    font: inherit; font-size: 15px; text-align: left; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    border-left: 4px solid transparent;
    border-image: linear-gradient(180deg, #06b6d4, #3b82f6, #8b5cf6) 1 / 0 0 0 4px;
  }
  #sharebody { padding-bottom: 8px; }
  .shsec { margin: 14px 0 0; }
  .shwarn {
    margin: 12px 0 0; padding: 12px; border-radius: 12px; font-size: 14px; line-height: 1.5;
    background: #fff7ed; color: #7c2d12; border: 1px solid #fed7aa;
  }
  .shwarn b { display: block; margin-bottom: 4px; }
  .shfound {
    margin: 10px 0 0; padding: 12px; border-radius: 12px; font-size: 13px; line-height: 1.5;
    background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
  }
  .shfound ul { margin: 6px 0 0; padding-left: 18px; }
  .shnote { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .shfacts { margin: 10px 0 0; font-size: 14px; }
  .shfacts div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .shfacts span:last-child { color: var(--muted); text-align: right; }
  .shbtn {
    margin-top: 10px; width: 100%; min-height: 48px; padding: 0 14px;
    font: inherit; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .shbtn[disabled] { opacity: .55; }
  .shbtn.ghost { color: var(--fg); background: var(--panel); border: 1px solid var(--line); }
  .shbtn.danger { color: #fff; background: #dc2626; }
  /* Deliberately NOT the conversation accent. The accent is whatever hue this
     conversation hashes to, and landing on green would read as the safe,
     default action for the one button here that cannot be fully undone. */
  .shbtn.publish { color: #fff; background: #b45309; }
  .shurl {
    margin-top: 10px; width: 100%; min-height: 48px; padding: 10px 12px;
    font: inherit; font-size: 13px; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; word-break: break-all;
    -webkit-appearance: none; appearance: none;
  }
  .shlive {
    margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 13px;
    background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line);
  }
  @media (prefers-color-scheme: dark) {
    .shwarn { background: #2a1a0d; color: #fdba74; border-color: #7c2d12; }
    .shfound { background: #2a1113; color: #fca5a5; border-color: #7f1d1d; }
  }

  /* ---- the agent roster, the tree, and the graveyard ----
   *
   * Borrows the status view's vocabulary for the same reason the activity panel
   * does: this is the same kind of screen answering a different question, and a
   * separate look would imply the two disagree about what a row means.
   */
  #agview {
    position: fixed; inset: 0; z-index: 33;
    display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  }
  #agview[hidden] { display: none; }
  #agclose {
    margin-left: auto; width: 44px; height: 44px; font-size: 26px; line-height: 1;
    color: var(--muted); background: transparent; border: 0; border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #agopen {
    margin-top: 8px; width: 100%; min-height: 48px; padding: 0 12px;
    font: inherit; font-size: 15px; text-align: left; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    border-left: 4px solid transparent;
    border-image: linear-gradient(180deg, #10b981, #14b8a6, #0ea5e9) 1 / 0 0 0 4px;
  }
  /* Talking to one agent directly, which is the thing he asked for by name. */
  #agsend { display: flex; gap: 6px; align-items: center; margin: 8px 0 4px; }
  #agsend[hidden] { display: none; }
  #agto { flex: 0 0 auto; font-size: 13px; font-weight: 650; }
  #agtext {
    flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 0 10px;
    /* 16px is a floor, not a preference: below it iOS zooms the whole page on
       focus and he then has to pinch back out to reach anything. */
    font: inherit; font-size: 16px; color: var(--fg);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  #agsendbtn {
    flex: 0 0 auto; min-height: 44px; padding: 0 14px; font: inherit;
    color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  #agmsg { margin: 4px 0; font-size: 13px; color: var(--muted); }

  .agsec { margin-top: 14px; font-size: 13px; font-weight: 650; color: var(--muted); }
  .agrow {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  .agrow:first-of-type { border-top: 0; }
  .agicon { flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; }
  .agicon svg { width: 22px; height: 22px; display: block; }
  .agbody { flex: 1 1 auto; min-width: 0; }
  .agname { font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
  /* WHAT IT IS WORKING ON. The reason the roster is worth having: two agents on
     one job are visible here before the work is wasted, not after. */
  .agtask { font-size: 13px; color: var(--fg); opacity: .85; overflow-wrap: anywhere; }
  .agwhen { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .agbtn {
    flex: 0 0 auto; min-height: 36px; padding: 0 10px; font: inherit; font-size: 13px;
    color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  .agwait { color: #b45309; font-weight: 650; }
  .agrow.alive .agicon svg { fill: #1a7f4b; }
  /*
   * NEVER REPORTED ANYTHING. Not idle, not broken — unknown. Dashed, like the
   * activity panel's unknown state, because every solid marker on these screens
   * means a measurement was actually taken.
   */
  .agrow.mute .agicon svg { fill: var(--muted); }
  .agrow.mute .agname { color: var(--muted); }

  /* ---- the graveyard ---- */
  #agyard { margin-top: 10px; }
  .stone {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px; margin-top: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .stone .agicon svg { fill: var(--muted); }
  .stone .agname { font-weight: 650; }
  .stonehow { font-size: 12px; color: var(--muted); margin-top: 2px; }
  /* LAST WORDS. Usually the most useful sentence an agent ever produces, and at
     least one collision happened because nobody could tell whether an agent had
     stopped or was mid-task. */
  .stonesaid {
    margin-top: 6px; padding-left: 8px; font-size: 13px; font-style: italic;
    border-left: 2px solid var(--line); overflow-wrap: anywhere;
  }
  /*
   * A PRESUMED death must never look like a confirmed one. This is the exact
   * mistake the graveyard exists to cure — a tombstone for someone still alive,
   * which has already happened here on evidence that felt overwhelming. Dashed
   * and faded: an inference, wearing an inference's clothes.
   */
  .stone.presumed { border-style: dashed; opacity: .78; }
  .stone.presumed .agname::after { content: ' ?'; color: var(--muted); }
  .yardempty { padding: 12px 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <header>
    <button id="menu" type="button" aria-label="Conversations" title="Conversations" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      <i id="menudot" aria-hidden="true"></i>
    </button>
    <b id="title">relay</b><span id="conn">offline &mdash; retrying</span>
    <button id="spk" type="button" aria-label="Spoken replies are off" title="Spoken replies are off" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4 4 0 0 0-2.5-3.7v7.4a4 4 0 0 0 2.5-3.7zM13 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.8 8.8 0 0 0 0-17.6z"/></svg>
    </button>
    <button id="hshare" type="button" aria-label="Share this conversation" title="Share this conversation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08a2.9 2.9 0 0 0-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81a3 3 0 1 0 0 4.38l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></svg>
    </button>
  </header>

  <main id="thread">
    <div id="list"></div>
    <p id="empty">No messages yet. Type below to send one.</p>
  </main>

  <p id="err"></p>
  <p id="offbar" aria-live="polite"></p>

  <div id="voice" aria-live="polite">
    <span id="meter" aria-hidden="true"><i></i></span><span id="vtext"></span>
    <button id="vstop" type="button">Stop</button>
  </div>

  <!--
    What is attached but not yet sent. Emptied only after the message lands.
  -->
  <div id="tray" hidden aria-label="Attached pictures"></div>

  <div id="composer">
    <!--
      No `capture` attribute, deliberately. `capture="environment"` forces the
      camera open and REMOVES the gallery from the sheet; plain accept="image/*"
      is what makes the system offer camera *and* photo library, which is what
      he asked for. `multiple` because picking three photos at once is normal.
    -->
    <input id="filepick" type="file" accept="image/*" multiple hidden>
    <!-- The tools, on their own line above the box. -->
    <div id="tools">
      <button id="attach" type="button" aria-label="Attach a picture" title="Attach a picture">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5h-3.2l-1.8-2H9L7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-8 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      </button>
      <button id="mic" type="button" aria-label="Dictate a message" title="Dictate a message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
      </button>
      <button id="convo" type="button" aria-label="Start a hands-free conversation" title="Hands-free conversation" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.97 0-9 3.13-9 7 0 1.9.97 3.62 2.55 4.88-.16 1.2-.66 2.3-1.4 3.15-.24.28-.05.72.31.7 1.86-.1 3.5-.75 4.71-1.6 .9.23 1.85.36 2.83.36 4.97 0 9-3.13 9-7s-4.03-7-9-7zm-3.6 8.4a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8zm3.6 0a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8zm3.6 0a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8z"/></svg>
      </button>
    </div>
    <div id="entry">
      <textarea id="input" rows="2" placeholder="Message&hellip;" maxlength="8000"
        autocapitalize="sentences" autocomplete="off" spellcheck="true" enterkeyhint="send"></textarea>
      <button id="send" type="button">Send</button>
    </div>
  </div>

  <div id="drawer" hidden>
    <div id="scrim"></div>
    <nav id="panel" aria-label="Conversations">
      <div class="prow">
        <b>Conversations</b>
        <button id="drawerclose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="prow">
        <input id="newtitle" type="text" placeholder="New conversation&hellip;" maxlength="200"
          autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
        <button id="newconv" type="button" aria-label="Create conversation">+</button>
      </div>
      <p id="converr"></p>
      <div id="convlist"></div>
      <button id="statusopen" type="button">Status &mdash; is anything listening?</button>
      <button id="actopen" type="button">Activity &mdash; what are its subagents doing?</button>
      <button id="galopen" type="button">Gallery &mdash; every picture in this conversation</button>
      <button id="shareopen" type="button">Share &mdash; publish a public snapshot</button>
      <button id="agopen" type="button">Agents &mdash; who is working, and on what</button>
    </nav>
  </div>

  <section id="statusview" hidden aria-label="Status">
    <div class="prow">
      <b>Status</b>
      <button id="statusclose" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="statusbody"></div>
    <!--
      Built once by initNotify(), and deliberately a SIBLING of #statusbody:
      renderStatus() wipes #statusbody every 5s while this view is open, which
      would destroy any control placed inside it mid-tap.
    -->
    <div id="notifybody"></div>
  </section>

  <!--
    The subagent activity panel. Per-conversation, not global: it answers "what
    is THIS coordinator doing right now", which is a different question from
    "is the server alive" that #statusview answers.
  -->
  <section id="actview" hidden aria-label="Subagent activity">
    <div class="prow">
      <b id="acttitle">Activity</b>
      <button id="actclose" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="actbody" aria-live="polite"></div>
  </section>

  <!--
    Every picture in this conversation, newest first, whether it was attached to
    a message or written into one as markdown. The thread shows pictures where
    they were said; this answers "show me everything you made", which is the
    question he actually asked and the one a thread cannot answer once the
    conversation has moved on.
  -->
  <section id="galview" hidden aria-label="Gallery">
    <div class="prow">
      <b id="galtitle">Gallery</b>
      <button id="galclose" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="galbody" aria-live="polite"><div id="galgrid"></div></div>
  </section>

  <!--
    Publishing this conversation to a public URL.

    The thing this panel exists to make unmissable is that it is a COPY. The
    relay runs on his desktop, so a link that pointed here would be a 502 the
    moment the machine sleeps — which is exactly when someone he sent it to
    would open it. So sharing exports a snapshot to Cloudflare and this machine
    leaves the path entirely, at the cost of the page being frozen at the
    moment he tapped it. Every string here says so.
  -->
  <section id="shareview" hidden aria-label="Share this conversation">
    <div class="prow">
      <b id="sharetitle">Share</b>
      <button id="shareclose" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="sharebody" aria-live="polite"></div>
  </section>

  <!--
    Who is out there, what each one is working on, and who spawned whom. The
    tree is the shape that matters: workers spawn workers, so a flat list cannot
    show who is under whom, and "two agents on the same job" is only obvious
    when they are side by side.
  -->
  <section id="agview" hidden aria-label="Agents">
    <div class="prow">
      <b id="agtitle">Agents</b>
      <button id="agclose" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="agsend" hidden>
      <span id="agto"></span>
      <input id="agtext" type="text" placeholder="Say something to it&hellip;" maxlength="4000"
        autocomplete="off" autocapitalize="sentences" enterkeyhint="send">
      <button id="agsendbtn" type="button">Send</button>
    </div>
    <p id="agmsg"></p>
    <div id="agbody" aria-live="polite"></div>
    <div id="agyard"></div>
  </section>

  <!--
    Full size. Deliberately not a modal over the thread but its own black
    screen: the judgement being made here is about pixels, and anything else on
    screen is a distraction and a source of accidental taps.
  -->
  <div id="lightbox" hidden role="dialog" aria-label="Full size image">
    <div id="lbbar">
      <span id="lbcap"></span>
      <button id="lbzoom" type="button">Actual size</button>
      <a id="lbraw" href="#" target="_blank" rel="noopener noreferrer">Open</a>
      <button id="lbclose" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="lbwrap"><img id="lbimg" alt=""></div>
  </div>

<script>
(function () {
  'use strict';

  var POLL_MS = 3000;        // poll interval when the live stream is not up
  var STREAM_POLL_MS = 30000;// slow repair poll while the live stream is carrying updates
  var MAX_BACKOFF = 20000;   // slowest retry when the server is unreachable
  var MAX_CHARS = 8000;      // must match the server-side cap
  var FULL_EVERY = 20;       // every Nth poll re-reads the whole thread as a repair pass
  var WINDOW = 250;          // entries fetched by a full read
  /*
   * A hard ceiling on what the thread may hold in memory and on screen. Without
   * it the page's cost grows with the history for ever, and this page is left
   * open for days on a phone — the one device with a memory budget small enough
   * to care. Older messages are not lost, they are simply not resident: the
   * server still has them, and a full read brings the most recent WINDOW back.
   */
  var KEEP = 300;            // most recent entries kept resident

  var thread = document.getElementById('thread');
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var errBar = document.getElementById('err');
  var offBar = document.getElementById('offbar');
  var conn = document.getElementById('conn');
  var composer = document.getElementById('composer');

  var entries = new Map();   // id -> entry
  var sigs = new Map();      // id -> change signature
  var cursorMs = 0;          // newest rev seen; drives incremental polling
  var fails = 0, polls = 0, timer = null, errTimer = null;
  var everRendered = false, sending = false;
  var stream = null, streamOk = false;
  /*
   * `offlineAt` is the moment the newest thing on screen was saved by the
   * service worker, or null when the page is genuinely talking to the server.
   * It is the difference between "we are having trouble reaching the queue" and
   * "you are reading history", and the two must never be shown as the same
   * thing — one of them means a message he sends will not arrive.
   */
  var offlineAt = null;
  var freshAgent = [];       // agent entries merged since the last speech harvest
  var booted = false;        // true once the first read has landed; see harvestSpeech()

  /*
   * Conversations. The thread on screen is always exactly one of them; every
   * read, every send and every spoken reply is scoped to `activeConv`. The id
   * is remembered across reloads so the phone comes back where it was left.
   * `convNew` records conversations that changed while you were looking at a
   * different one — that is what lights the dot on the hamburger.
   */
  var DEFAULT_CONV = 'main';
  var activeConv = DEFAULT_CONV;
  var convs = [];
  // Whether the last /conversations read was answered from the offline copy.
  // Everything derived from it is then history, not news — see activityNode().
  var convsFromCache = false;
  var convNew = Object.create(null);
  var convTimer = null;

  var STATUS = { pending: 'pending', claimed: 'claimed', done: 'answered' };
  // Shape, not just colour: an empty ring, a half-filled ring, a tick.
  var GLYPH = { pending: '○', claimed: '◐', done: '✓' };

  /*
   * A conversation's colour is derived from its id, so it is stable, needs no
   * storage, and is the same on every device. It is decoration that carries
   * information: the header, the send button and the active row all shift, so
   * "which conversation am I in" is answerable without reading anything.
   */
  function hueOf(id) {
    var h = 0;
    var s = String(id || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function applyHue(id) {
    var root = document.documentElement;
    if (!root || !root.style) return;
    var h = hueOf(id);
    try {
      root.style.setProperty('--hue', String(h));
      root.style.setProperty('--hue2', String((h + 50) % 360));
    } catch (e) { /* a browser without custom properties keeps the default look */ }
  }

  function ms(s) { var n = Date.parse(s || ''); return isNaN(n) ? 0 : n; }
  function sigOf(e) { return [e.role, e.status, e.ts, e.text].join('|'); }

  function rel(iso) {
    var t = ms(iso);
    if (!t) return '';
    var d = Date.now() - t;
    if (d < 45000) return 'now';
    var m = Math.round(d / 60000); if (m < 60) return m + 'm';
    var h = Math.round(m / 60); if (h < 24) return h + 'h';
    var dd = Math.round(h / 24); if (dd < 7) return dd + 'd';
    return new Date(t).toLocaleDateString();
  }
  function absolute(iso) { var t = ms(iso); return t ? new Date(t).toLocaleString() : ''; }

  function nearBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 120; }
  function scrollBottom() { thread.scrollTop = thread.scrollHeight; }

  // ------------------------------------------------------------------ markdown
  /*
   * A small Markdown subset, rendered by BUILDING NODES rather than by
   * assigning HTML.
   *
   * WHY IT IS SHAPED THIS WAY, AND IT IS NOT A STYLE PREFERENCE. This queue has
   * no authentication and is published on every interface the machine has, so
   * anything that can reach it can put text on this page — and this page is the
   * one that talks to every agent on the box. There is no `innerHTML` anywhere
   * in this file and there is none here: every character of message text
   * reaches the document through `textContent`, which makes injection
   * structurally impossible rather than merely filtered. No library, for the
   * same reason the rest of this project has no dependencies — a Markdown
   * parser is the classic place for an HTML-passthrough option to be on by
   * default.
   *
   * The one place a string becomes something the browser will *act* on is a
   * link's href, so that is allowlisted by scheme and nothing else is linked.
   */
  var SAFE_URL = /^(?:https?:\/\/|mailto:[^\s]|\/(?!\/))/i;

  function linkNode(label, href) {
    var url = String(href || '');
    if (!SAFE_URL.test(url)) {
      // `javascript:`, `data:`, and anything else we do not recognise. Show the
      // text so nothing is hidden from the reader, but do not make it clickable.
      return document.createTextNode(label === url ? url : label + ' (' + url + ')');
    }
    var a = document.createElement('a');
    a.href = url;
    a.textContent = label;
    a.target = '_blank';
    a.rel = 'noopener noreferrer nofollow';
    return a;
  }

  /*
   * A picture in the thread.
   *
   * ONLY this server's own /images/<sha256> is ever turned into an <img>, and
   * that is the same rule linkNode follows above rather than a new one. Two
   * reasons, and the second is the one that matters: the page's CSP allows
   * `img-src 'self'`, so any other source renders as a broken box — and a
   * broken box is indistinguishable from a bug in this page, which is exactly
   * the class of thing this codebase refuses to ship. Anything not matching
   * falls through to the link rule and behaves precisely as it did before.
   */
  var IMG_URL = /^\/images\/[a-f0-9]{64}$/;

  function imageNode(url, alt, w, h) {
    var img = document.createElement('img');
    img.className = 'relimg';
    img.src = url;
    /* The alt is what he sees if the bytes never arrive, so it must say what
       the picture WAS, not merely that there was one. */
    img.alt = alt || 'image';
    img.loading = 'lazy';
    img.decoding = 'async';
    /* Given as attributes, the browser derives an aspect ratio and reserves the
       box before the bytes land. Omitted when unknown: a flexible box is
       correct, a guessed one lays the thread out around a wrong number. */
    if (w > 0 && h > 0) { img.width = w; img.height = h; }
    img.addEventListener('click', function () { showLightbox(url, alt); });
    return img;
  }

  /* Inline spans. Tried in order at each position; every branch consumes at
     least one character, so this cannot spin. */
  function inlineInto(parent, text) {
    var s = String(text == null ? '' : text);
    var i = 0;
    while (i < s.length) {
      var rest = s.slice(i), m;
      if ((m = /^`([^`\n]+)`/.exec(rest))) {
        var code = document.createElement('code');
        code.textContent = m[1];
        parent.appendChild(code);
        i += m[0].length; continue;
      }
      /*
       * `![alt](/images/<id>)`. Tried BEFORE the link rule, which would
       * otherwise match the `[alt](...)` part and leave a stray `!` in front of
       * a link — which is exactly what this page did until now. Anything that
       * is not one of our own image URLs is left to the link rule, so every
       * `![...]()` that renders as text today still renders as text.
       */
      if ((m = /^!\[([^\]\n]*)\]\(\s*([^)\s]+)\s*\)/.exec(rest)) && IMG_URL.test(m[2])) {
        parent.appendChild(imageNode(m[2], m[1], 0, 0));
        i += m[0].length; continue;
      }
      if ((m = /^\[([^\]\n]*)\]\(\s*([^)\s]+)[^)]*\)/.exec(rest))) {
        parent.appendChild(linkNode(m[1] || m[2], m[2]));
        i += m[0].length; continue;
      }
      if ((m = /^(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]])/.exec(rest))) {
        parent.appendChild(linkNode(m[1], m[1]));
        i += m[0].length; continue;
      }
      if ((m = /^(\*\*|__)([\s\S]+?)\1/.exec(rest))) {
        var b = document.createElement('strong');
        inlineInto(b, m[2]);
        parent.appendChild(b);
        i += m[0].length; continue;
      }
      if ((m = /^~~([\s\S]+?)~~/.exec(rest))) {
        var d = document.createElement('del');
        inlineInto(d, m[1]);
        parent.appendChild(d);
        i += m[0].length; continue;
      }
      if ((m = /^(\*|_)([^*_\n]+?)\1/.exec(rest))) {
        var em = document.createElement('em');
        inlineInto(em, m[2]);
        parent.appendChild(em);
        i += m[0].length; continue;
      }
      // A plain run, up to the next thing that could begin a span. The URL case
      // is matched in full rather than by its leading `h`, or every letter h in
      // ordinary prose would end the run and cost a text node. `!` is matched
      // only when an image could follow it, for exactly the same reason — and
      // it MUST be here: without it a run swallows the `!` of a mid-sentence
      // `![alt](/images/…)`, the next pass sees a bare `[alt](…)`, and the
      // picture silently renders as a link instead.
      var next = rest.slice(1).search(/[`[*_~]|!\[|https?:\/\//);
      var take = next === -1 ? rest.length : next + 1;
      parent.appendChild(document.createTextNode(rest.slice(0, take)));
      i += take;
    }
  }

  /*
   * `~~~` counts as a fence as well as ``` ``` ``` — the server's checklist
   * parser skips both, and the two MUST agree about which lines are code, or a
   * `- [ ]` written as an example inside a fence would be a task on one side and
   * not the other, and every checkbox after it would be off by one.
   */
  var RE_FENCE = /^\s*(?:```|~~~)/;
  var RE_HEAD = /^(#{1,6})\s+(.*)$/;
  var RE_QUOTE = /^\s*>\s?(.*)$/;
  /* A rule is that character and nothing else. Checked before bullets, because
     `- - -` is a rule and would otherwise read as a one-item list. */
  var RE_RULE = /^\s{0,3}([-*_])\s*(?:\1\s*){2,}$/;
  var RE_TASK = /^(\s*)[-*+]\s+\[([ xX])\]\s*(.*)$/;
  var RE_BULLET = /^(\s*)[-*+]\s+(.*)$/;
  var RE_ORDER = /^(\s*)(\d{1,3})[.)]\s+(.*)$/;
  /* The `|---|:--:|` line under a table's header row is what makes it a table;
     a line full of pipes on its own is just prose about pipes. */
  var RE_TSEP = /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)*\|?\s*$/;

  function isTableAt(lines, i) {
    return i + 1 < lines.length &&
      lines[i].indexOf('|') !== -1 &&
      RE_TSEP.test(lines[i + 1]) && lines[i + 1].indexOf('-') !== -1;
  }

  function isBlockStart(line, lines, i) {
    return RE_FENCE.test(line) || RE_HEAD.test(line) || RE_QUOTE.test(line) ||
      RE_RULE.test(line) || RE_TASK.test(line) || RE_BULLET.test(line) ||
      RE_ORDER.test(line) || (lines ? isTableAt(lines, i) : false);
  }

  /** Cells of one table row. `\|` is an escaped pipe, not a cell boundary. */
  function splitRow(line) {
    var s = String(line).trim();
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.charAt(s.length - 1) === '|' && s.charAt(s.length - 2) !== '\\') s = s.slice(0, -1);
    var cells = [], cur = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (ch === '\\' && s.charAt(i + 1) === '|') { cur += '|'; i++; continue; }
      if (ch === '|') { cells.push(cur); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur);
    return cells.map(function (c) { return c.trim(); });
  }

  function alignsOf(sep) {
    return splitRow(sep).map(function (c) {
      var l = c.charAt(0) === ':', r = c.charAt(c.length - 1) === ':';
      return l && r ? 'center' : r ? 'right' : l ? 'left' : '';
    });
  }

  /** Leading whitespace as a column count; a tab is four columns. */
  function indentOf(s) {
    return /^[ \t]*/.exec(s)[0].replace(/\t/g, '    ').length;
  }

  function mdRender(text, entry) {
    var frag = document.createDocumentFragment();
    var lines = String(text == null ? '' : text).split(/\r?\n/);
    var i = 0, taskIndex = 0;
    /*
