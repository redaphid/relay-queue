     * Open lists, outermost first. Nesting is decided by indentation rather than
     * by a fixed step, so a list written with two spaces and one written with
     * four both nest — which matters because an itinerary is usually pasted from
     * somewhere else and its indentation is whatever that somewhere used.
     */
    var stack = [];
    function endList() { stack.length = 0; }

    function listAt(indent, kind, cls) {
      while (stack.length && indent < stack[stack.length - 1].indent) stack.pop();
      var top = stack[stack.length - 1];
      if (top && indent === top.indent) {
        if (top.kind === kind) return top;
        stack.pop();  // bullets turning into numbers at the same level: a new list
      }
      var el = document.createElement(kind === 'ol' ? 'ol' : 'ul');
      el.className = cls;
      var parent = stack[stack.length - 1];
      // Hung off the parent's last item, so a sub-list indents under its owner
      // instead of restarting at the margin.
      if (parent && parent.lastLi) parent.lastLi.appendChild(el);
      else if (parent) parent.el.appendChild(el);
      else frag.appendChild(el);
      var frame = { indent: indent, el: el, kind: kind, lastLi: null };
      stack.push(frame);
      return frame;
    }

    function addItem(indent, kind, cls, li) {
      var frame = listAt(indent, kind, cls);
      frame.el.appendChild(li);
      frame.lastLi = li;
      return li;
    }

    while (i < lines.length) {
      var line = lines[i], m;

      if (RE_FENCE.test(line)) {
        endList();
        var buf = [];
        i++;
        while (i < lines.length && !RE_FENCE.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // the closing fence, if there was one
        var pre = document.createElement('pre');
        var pc = document.createElement('code');
        pc.textContent = buf.join('\n');
        pre.appendChild(pc);
        frag.appendChild(pre);
        continue;
      }

      if (!line.trim()) { endList(); i++; continue; }

      if ((m = RE_HEAD.exec(line))) {
        endList();
        var h = document.createElement('div');
        h.className = 'mdh mdh' + m[1].length;
        h.setAttribute('role', 'heading');
        h.setAttribute('aria-level', String(m[1].length));
        inlineInto(h, m[2]);
        frag.appendChild(h);
        i++; continue;
      }

      if (RE_RULE.test(line)) {
        endList();
        frag.appendChild(document.createElement('hr'));
        i++; continue;
      }

      if (isTableAt(lines, i)) {
        endList();
        var aligns = alignsOf(lines[i + 1]);
        var heads = splitRow(lines[i]);
        // A table is the one thing that genuinely cannot always fit 390px, so it
        // gets its own scroll container rather than pushing the whole thread
        // sideways. Overflow is contained, never inflicted on the page.
        var twrap = document.createElement('div');
        twrap.className = 'mdtablewrap';
        twrap.setAttribute('role', 'region');
        twrap.setAttribute('aria-label', 'table');
        twrap.tabIndex = 0;   // reachable, and scrollable, by keyboard too
        var table = document.createElement('table');
        table.className = 'mdtable';
        var thead = document.createElement('thead');
        var hrow = document.createElement('tr');
        for (var c = 0; c < heads.length; c++) {
          var th = document.createElement('th');
          if (aligns[c]) th.style.textAlign = aligns[c];
          inlineInto(th, heads[c]);
          hrow.appendChild(th);
        }
        thead.appendChild(hrow);
        table.appendChild(thead);
        var tbody = document.createElement('tbody');
        i += 2;
        while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1) {
          var cells = splitRow(lines[i]);
          var tr = document.createElement('tr');
          for (var c2 = 0; c2 < Math.max(cells.length, heads.length); c2++) {
            var td = document.createElement('td');
            if (aligns[c2]) td.style.textAlign = aligns[c2];
            inlineInto(td, cells[c2] === undefined ? '' : cells[c2]);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
          i++;
        }
        table.appendChild(tbody);
        twrap.appendChild(table);
        frag.appendChild(twrap);
        continue;
      }

      if ((m = RE_QUOTE.exec(line))) {
        endList();
        var q = document.createElement('div');
        q.className = 'mdquote';
        var firstQ = true;
        while (i < lines.length && (m = RE_QUOTE.exec(lines[i]))) {
          if (!firstQ) q.appendChild(document.createElement('br'));
          inlineInto(q, m[1]);
          firstQ = false; i++;
        }
        frag.appendChild(q);
        continue;
      }

      if ((m = RE_TASK.exec(line))) {
        addItem(indentOf(m[1]), 'task', 'mdtasks',
          taskNode(m[3], /x/i.test(m[2]), entry, taskIndex++));
        i++; continue;
      }

      if ((m = RE_BULLET.exec(line))) {
        var li = document.createElement('li');
        inlineInto(li, m[2]);
        addItem(indentOf(m[1]), 'ul', 'mdlist', li);
        i++; continue;
      }

      if ((m = RE_ORDER.exec(line))) {
        var oli = document.createElement('li');
        inlineInto(oli, m[3]);
        addItem(indentOf(m[1]), 'ol', 'mdlist', oli);
        i++; continue;
      }

      endList();
      var p = document.createElement('p');
      p.className = 'mdp';
      var first = true;
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i], lines, i)) {
        if (!first) p.appendChild(document.createElement('br'));
        inlineInto(p, lines[i]);
        first = false; i++;
      }
      // A line that is only a block *start* by lookahead must still be consumed
      // somewhere, or this loop would never advance.
      if (first) { inlineInto(p, lines[i]); i++; }
      frag.appendChild(p);
    }
    return frag;
  }

  // ---------------------------------------------------------------- checklists
  /*
   * A ticked box is SERVER STATE. It has to survive a reload, a second device
   * and a restart of the server, and — the actual point of the feature — an
   * agent has to be able to read it: "check things off and have Claude notice."
   * A tick that only one browser knows about satisfies none of that, so
   * localStorage is no longer where this lives. `POST /tasks/:entryId/checks`
   * writes it to the event log, `GET` reads it back, and the state arrives with
   * every thread poll on `entry.checklist`.
   *
   * WHICH LEAVES ONE HONEST FAILURE MODE: the write can be in flight, or he can
   * be on a plane. The tick shows immediately either way, because waiting for a
   * round trip to move a checkbox feels broken — but a tick that has not landed
   * MUST NOT look like one that has. It carries a word: "saving" while in
   * flight, "queued — offline" when there is no network, "not saved — tap to
   * retry" when the server refused. Idle and broken never look the same.
   *
   * Nothing is ever silently dropped. An offline tick goes to the outbox in
   * localStorage and is retried when the browser comes back, and on every poll
   * after that; only a write the server actively rejects (a 4xx — a message that
   * no longer exists, an index off the end) stops being retried, and that one
   * says so on the row.
   */
  var OUTBOX_KEY = 'relay.checks.outbox';
  var MAX_OUTBOX = 200;
  var outboxMem = null;
  /* Live checkbox rows, so a status change repaints just those rather than
     re-rendering the thread under his thumb. Rebuilt by every render(). */
  var taskRows = [];

  function outbox() {
    if (outboxMem) return outboxMem;
    try { outboxMem = JSON.parse(pref(OUTBOX_KEY) || '{}') || {}; } catch (e) { outboxMem = {}; }
    return outboxMem;
  }
  function saveOutbox() {
    var box = outbox();
    var keys = Object.keys(box);
    if (keys.length > MAX_OUTBOX) {
      keys.sort(function (a, b) { return (box[a].at || 0) - (box[b].at || 0); });
      for (var i = 0; i < keys.length - MAX_OUTBOX; i++) delete box[keys[i]];
    }
    try { pref(OUTBOX_KEY, JSON.stringify(box)); } catch (e) { /* memory only */ }
  }
  function outKey(entryId, index) { return entryId + '#' + index; }
  function outRec(entryId, index) { return outbox()[outKey(entryId, index)] || null; }

  /* Who ticked it. There is no login here, so the honest answer is which device
     — which is still the useful one when a list is shared with an agent. */
  function checkAuthor() {
    try { return 'web/' + String(deviceId()).slice(0, 8); } catch (e) { return 'web'; }
  }

  /** The server's word on one item, when the thread has told us. */
  function serverItem(entry, idx) {
    var cl = entry && entry.checklist;
    return (cl && cl.items && cl.items[idx]) || null;
  }

  /* What to say about this tick, in words. null when there is nothing to say. */
  function checkMark(rec) {
    if (!rec) return null;                       // settled: the server agrees
    /* A login page came back, so there IS a network — whatever navigator.onLine
       says. Waiting will not fix this one; signing in will, so name that. */
    if (rec.challenge) return { cls: 'failed', text: 'not saved — sign in again' };
    if (rec.state === 'queued') return { cls: 'unsure', text: 'queued — offline' };
    if (rec.state === 'failed') return { cls: 'failed', text: 'not saved — tap to retry' };
    return { cls: 'saving', text: 'saving' };
  }

  function paintTask(row) {
    var rec = outRec(row.entryId, row.index);
    var srv = serverItem(entries.get(row.entryId), row.index);
    var on = rec ? !!rec.on : (srv ? !!srv.checked : row.inText);
    var m = checkMark(rec);
    row.box.checked = on;
    row.mark.className = 'tmark' + (m ? ' ' + m.cls : '');
    row.mark.textContent = m ? m.text : '';
    row.mark.hidden = !m;
    row.li.className = 'mdtask' + (on ? ' on' : '') +
      (m && m.cls === 'failed' ? ' broken' : m ? ' unsettled' : '');
    // Who and when, for a tick the server has recorded. Not shouted on the row —
    // it is the answer to a question you only sometimes ask.
    if (srv && srv.source === 'checked' && srv.by) {
      row.lab.title = (srv.checked ? 'ticked' : 'un-ticked') + ' by ' + srv.by +
        (srv.at ? ' · ' + absolute(srv.at) : '');
    } else {
      row.lab.title = '';
    }
  }

  function paintAllTasks() { for (var i = 0; i < taskRows.length; i++) paintTask(taskRows[i]); }

  /** Fold a checklist the server just returned into the entry we are showing. */
  function applyChecklist(entryId, cl) {
    var e = entries.get(entryId);
    if (e && cl) e.checklist = { total: cl.total, done: cl.done, items: cl.items };
  }

  function sendCheck(entryId, index, on) {
    var k = outKey(entryId, index);
    var box = outbox();
    box[k] = { entryId: entryId, index: index, on: !!on, at: Date.now(), state: 'sending' };
    saveOutbox();
    paintAllTasks();
    return fetch('/tasks/' + encodeURIComponent(entryId) + '/checks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ index: index, on: !!on, by: checkAuthor() })
    }).then(function (r) {
      /*
       * A CHALLENGE IS NOT AN ANSWER. An expired Cloudflare Access session does
       * not answer 4xx — it redirects to a login page, so what lands here is a
       * 200 full of HTML. `r.ok` says yes to that, and a branch that reads only
       * the status files a login screen as a successful write: the tick is
       * deleted from the outbox, the row loses its mark, and a mark-less row
       * means "settled, the server agrees". Silently wrong, with nothing left
       * to retry — strictly worse than the failure this outbox was built for.
       *
       * So only THIS SERVER'S JSON is allowed to settle a tick or to kill one.
       * Anything else in the path — a login page, a captive portal, a proxy's
       * error page — is "not now": kept, shown, and retried once the way back
       * is open. The service worker already refuses to cache a login page as
       * the app shell (`x-relay-app`); this is the same guard on the write.
       */
      var ourJson = /^application\/json/i.test(String(r.headers.get('content-type') || ''));
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!ourJson || !j || typeof j !== 'object' || r.redirected) {
          var ch = new Error(r.redirected
            ? 'not saved — a login page answered instead of the server'
            : 'not saved — HTTP ' + r.status + ' did not come from the server');
          ch.permanent = false; // signing back in fixes it, so it must keep trying
          ch.challenge = true;  // ...and waiting for signal will not, so say so
          throw ch;
        }
        if (!r.ok) {
          var err = new Error((j && j.error) || ('HTTP ' + r.status));
          // 4xx is the server saying "never, stop asking"; 5xx is "not now".
          err.permanent = r.status >= 400 && r.status < 500;
          throw err;
        }
        return j;
      });
    }).then(function (j) {
      delete outbox()[k];
      saveOutbox();
      if (j && j.checklist) applyChecklist(entryId, j.checklist);
      paintAllTasks();
    }).catch(function (err) {
      var rec = outbox()[k];
      if (!rec) return;
      // Offline is not a failure. It is a write that has not happened yet, and
      // saying "not saved" about it would be a lie in the alarming direction.
      /*
       * A challenge outranks `navigator.onLine`. That flag is a hint, not a
       * fact — a captive portal or a limping hotspot can leave it false while a
       * login page comes back perfectly well — and a response in hand is proof
       * there is a network. Calling that "offline" sends him off to wait for
       * signal he already has, which is the same lie in a quieter voice.
       */
      var challenge = !!err.challenge;
      var offline = !challenge &&
        ((typeof navigator !== 'undefined' && navigator.onLine === false) ||
        (!err.permanent && /network|fetch|load failed/i.test(String(err && err.message))));
      rec.state = err.permanent ? 'failed' : (offline ? 'queued' : 'failed');
      rec.permanent = !!err.permanent;
      rec.challenge = challenge;
      rec.error = (err && err.message) || 'network error';
      saveOutbox();
      paintAllTasks();
    });
  }

  /** Retry everything the network lost. Called on reconnect and on every poll. */
  function flushOutbox() {
    var box = outbox();
    var keys = Object.keys(box);
    for (var i = 0; i < keys.length; i++) {
      var rec = box[keys[i]];
      if (!rec || rec.state === 'sending' || rec.permanent) continue;
      sendCheck(rec.entryId, rec.index, rec.on);
    }
  }
  // Coming back from a tunnel is the case this is for: the ticks he made
  // underground go up the moment there is signal, without him doing anything.
  try { window.addEventListener('online', flushOutbox); } catch (e) { /* no matter; the poll retries too */ }

  function taskNode(label, checkedInSource, entry, idx) {
    var entryId = (entry && entry.id) ? entry.id : '?';

    var li = document.createElement('li');
    var lab = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox';

    var span = document.createElement('span');
    span.className = 'tlabel';
    inlineInto(span, label);

    var mark = document.createElement('span');
    mark.className = 'tmark';
    mark.hidden = true;

    lab.appendChild(box);
    lab.appendChild(span);
    li.appendChild(lab);
    li.appendChild(mark);

    var row = { entryId: entryId, index: idx, li: li, lab: lab, box: box, mark: mark, inText: !!checkedInSource };
    taskRows.push(row);
    paintTask(row);

    box.addEventListener('change', function () { sendCheck(entryId, idx, !!box.checked); });
    // A failed write is not a dead end: the marker is the retry button.
    mark.addEventListener('click', function () {
      var cur = outRec(entryId, idx);
      if (cur && cur.state === 'failed') sendCheck(entryId, idx, !!cur.on);
    });
    return li;
  }

  /*
   * The strip of pictures under a message.
   *
   * One picture gets the full width of the bubble, because a single render is
   * the thing being judged. Two or more go into a two-up grid of squares, so
   * eleven candidate crates stay browsable instead of becoming eleven
   * full-width images to scroll past. Either way a tap opens the real thing.
   */
  function shotsNode(list) {
    var box = document.createElement('div');
    box.className = 'shots ' + (list.length === 1 ? 'one' : 'many');
    for (var i = 0; i < list.length; i++) {
      var im = list[i] || {};
      // Tolerant of a bare id as well as the object the server sends: the saved
      // offline copy may predate either shape, and a picture is never worth
      // throwing a thread away for.
      var url = typeof im === 'string' ? ('/images/' + im) : im.url;
      if (!url || !IMG_URL.test(url)) continue;
      box.appendChild(imageNode(url, im.alt, im.width, im.height));
    }
    return box;
  }

  /*
   * ------------------------------------------------- choosing between pictures
   *
   * State lives on the server (see pickListOf in server.js); this only draws it
   * and posts taps. Which image is currently BEING VIEWED is the one piece of
   * genuinely local state, so it is kept out here — the thread re-renders on
   * every poll and a pick changes the entry's rev, so a cursor stored on the
   * node would jump back to the first image the moment he chose something.
   */
  var pickCursor = {};   // entryId -> index currently on the stage
  var pickBusy = {};     // entryId -> true while a POST is in flight

  function postPick(entryId, index, on) {
    return fetch('/tasks/' + encodeURIComponent(entryId) + '/picks', {
      method: 'POST',
      headers: { 'content-type': 'application/json', accept: 'application/json' },
      body: JSON.stringify({ index: index, on: on, by: 'web' })
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function pickerNode(e) {
    var sel = e.selection;
    var items = sel.items || [];
    var entryId = e.id;
    var many = sel.mode === 'many';
    var at = pickCursor[entryId];
    if (typeof at !== 'number' || at < 0 || at >= items.length) {
      // Open on what he already chose, not on the first candidate: coming back
      // to a decided set should show the decision.
      var firstOn = -1;
      for (var q = 0; q < items.length; q++) { if (items[q].selected) { firstOn = q; break; } }
      at = firstOn >= 0 ? firstOn : 0;
      pickCursor[entryId] = at;
    }

    var box = el('div', 'picker');
    // Which entry this belongs to, so a second picker in the same thread is
    // addressable — by a test, and by anyone reading the DOM to debug one.
    box.setAttribute('data-entry', entryId);
    var stage = el('div', 'pk-stage');
    var big = document.createElement('img');
    big.className = 'pk-big';
    big.loading = 'lazy';
    big.decoding = 'async';
    stage.appendChild(big);

    var mark = el('div', 'pk-mark');
    mark.appendChild(el('span', null, '\u2713'));
    mark.appendChild(el('span', null, many ? 'Selected' : 'Chosen'));
    stage.appendChild(mark);

    var count = el('div', 'pk-count');
    stage.appendChild(count);

    var prev = el('button', 'pk-nav pk-prev', '\u2039');
    var next = el('button', 'pk-nav pk-next', '\u203a');
    prev.type = 'button'; next.type = 'button';
    prev.setAttribute('aria-label', 'Previous picture');
    next.setAttribute('aria-label', 'Next picture');
    stage.appendChild(prev); stage.appendChild(next);
    box.appendChild(stage);

    var bar = el('div', 'pk-bar');
    var label = el('div', 'pk-label');
    var choose = el('button', 'pk-choose');
    choose.type = 'button';
    bar.appendChild(label); bar.appendChild(choose);
    box.appendChild(bar);

    var strip = el('div', 'pk-strip');
    box.appendChild(strip);
    var sum = el('div', 'pk-sum');
    box.appendChild(sum);

    var thumbs = [];
    for (var i = 0; i < items.length; i++) {
      (function (idx) {
        var t = el('button', 'pk-thumb');
        t.type = 'button';
        t.setAttribute('aria-label', 'View ' + items[idx].label);
        var ti = document.createElement('img');
        ti.src = items[idx].url; ti.alt = items[idx].label;
        ti.loading = 'lazy';
        t.appendChild(ti);
        // Browsing only. Never selects — see the header comment.
        t.addEventListener('click', function () { show(idx); });
        strip.appendChild(t);
        thumbs.push(t);
      })(i);
    }

    function draw() {
      var it = items[at];
      if (!it) return;
      big.src = it.url;
      big.alt = it.label;
      if (it.width > 0 && it.height > 0) { big.width = it.width; big.height = it.height; }
      label.textContent = it.label;
      count.textContent = (at + 1) + ' / ' + items.length;
      box.className = 'picker' + (it.selected ? ' on' : '');
      choose.className = 'pk-choose' + (it.selected ? ' on' : '');
      choose.textContent = it.selected
        ? (many ? '\u2713 Selected' : '\u2713 Chosen')
        : (many ? 'Select' : 'Choose this');
      choose.setAttribute('aria-pressed', it.selected ? 'true' : 'false');
      choose.setAttribute('aria-label',
        (it.selected ? 'Deselect ' : 'Select ') + it.label);
      prev.disabled = at <= 0;
      next.disabled = at >= items.length - 1;
      for (var k = 0; k < thumbs.length; k++) {
        thumbs[k].className = 'pk-thumb' + (k === at ? ' here' : '') + (items[k].selected ? ' on' : '');
      }
      var chosen = [];
      for (var m2 = 0; m2 < items.length; m2++) if (items[m2].selected) chosen.push(items[m2].label);
      sum.textContent = '';
      if (!chosen.length) {
        // "Nothing chosen yet" and "he chose none" are different, and the copy
        // says which this is.
        sum.appendChild(el('span', null, many
          ? 'Nothing selected yet — browse, then tap Select.'
          : 'Nothing chosen yet — browse, then tap Choose this.'));
      } else {
        sum.appendChild(el('span', null, (many ? 'Selected: ' : 'Chosen: ')));
        for (var c = 0; c < chosen.length; c++) {
          if (c) sum.appendChild(el('span', null, ', '));
          sum.appendChild(el('b', null, chosen[c]));
        }
      }
    }

    function show(idx) {
      if (idx < 0 || idx >= items.length) return;
      at = idx;
      pickCursor[entryId] = idx;
      draw();
      if (thumbs[idx] && thumbs[idx].scrollIntoView) {
        try { thumbs[idx].scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (err) { /* old browser */ }
      }
    }

    prev.addEventListener('click', function () { show(at - 1); });
    next.addEventListener('click', function () { show(at + 1); });

    /*
     * Swipe browses. The threshold, and the check that the gesture was more
     * horizontal than vertical, are what keep it from stealing his scroll — and
     * a swipe never selects, so a misread gesture costs him nothing but a step.
     */
    var sx = 0, sy = 0, moved = false;
    stage.addEventListener('touchstart', function (ev) {
      var t = ev.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
    }, { passive: true });
    stage.addEventListener('touchend', function (ev) {
      var t = ev.changedTouches[0];
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        moved = true;
        show(at + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    // Tapping the picture itself is "show me this properly", the same as
    // everywhere else in the thread. Suppressed right after a swipe.
    big.addEventListener('click', function () {
      if (moved) { moved = false; return; }
      var it = items[at];
      if (it) showLightbox(it.url, it.label);
    });

    choose.addEventListener('click', function () {
      if (pickBusy[entryId]) return;
      var it = items[at];
      if (!it) return;
      var wantOn = !it.selected;
      pickBusy[entryId] = true;
      choose.disabled = true;
      postPick(entryId, at, wantOn).then(function (j) {
        var fresh = (j && j.selection && j.selection.items) || null;
        if (fresh) {
          // Trust the server's answer rather than assuming: single-select
          // clears the others there, and this is how the strip learns.
          items = fresh;
          e.selection = j.selection;
        } else {
          it.selected = wantOn;
        }
        draw();
      }).catch(function (err) {
        showErr('That did not save — ' + ((err && err.message) || 'network error') + '. Nothing was changed.');
      }).then(function () {
        pickBusy[entryId] = false;
        choose.disabled = false;
      });
    });

    draw();
    return box;
  }

  function nodeFor(e) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (e.role === 'agent' ? 'agent' : 'user');

    var body = document.createElement('div');
    body.className = 'body';
    body.appendChild(mdRender(e.text, e));   // nodes only: never innerHTML
    /*
     * Pictures attached to the message, as opposed to written into its text.
     * Guarded rather than assumed: an entry from before this feature, or one
     * restored from the service worker's saved copy, has no `images` at all,
     * and a thread that threw here would take the whole page down over a
     * decoration.
     */
    /*
     * A set offered for choosing is drawn as the picker; anything else stays the
     * plain grid it has always been, so a lone screenshot never sprouts controls.
     */
    if (e && e.selection && e.selection.mode !== 'none' && e.selection.total) {
      body.appendChild(pickerNode(e));
    } else if (e && e.images && e.images.length) {
      body.appendChild(shotsNode(e.images));
    }

    var meta = document.createElement('div');
    meta.className = 'meta';
    var t = document.createElement('span');
    t.className = 'time';
    t.setAttribute('data-ts', e.ts || '');
    t.title = absolute(e.ts);
    t.textContent = rel(e.ts);
    meta.appendChild(t);
    if (e.role !== 'agent') {
      // The glyph is doing as much work as the colour here: pending / claimed /
      // answered has to be distinguishable without relying on hue.
      var st = document.createElement('span');
      st.className = 'chip ' + (e.status || 'pending');
      st.textContent = (GLYPH[e.status] || '') + ' ' + (STATUS[e.status] || e.status || '');
      meta.appendChild(st);
      /*
       * Who is on it. Two agents starting the same job is the collision this
       * whole feature exists to prevent, and the queue knew the answer all
       * along without ever showing it to him.
       */
      if (e.claimedBy) {
        var who = document.createElement('span');
        who.className = 'chip';
        who.textContent = '· ' + e.claimedBy;
        meta.appendChild(who);
      }
      wrap.className += ' st-' + (e.status || 'pending');
    }

    wrap.appendChild(body);
    wrap.appendChild(meta);
    return wrap;
  }

  function render() {
    var all = Array.from(entries.values());
    all.sort(function (a, b) {
      return (ms(a.ts) - ms(b.ts)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    var stick = !everRendered || nearBottom();

    var frag = document.createDocumentFragment();
    taskRows = [];   // every row is about to be rebuilt; the old ones are detached
    for (var i = 0; i < all.length; i++) frag.appendChild(nodeFor(all[i]));
    list.textContent = '';
    list.appendChild(frag);

    empty.style.display = all.length ? 'none' : 'block';
    if (stick) scrollBottom();
    if (all.length) everRendered = true;
    // Whatever is on screen is what should be there without a network. Hooked
    // to render() rather than to the poll, so every path that changes the
    // thread — a poll, a push over the stream, switching conversation — keeps
    // the saved copy honest through one line instead of four.
    queueSave(all);
  }

  /*
   * Hand the thread to the service worker to keep for reading offline.
   *
   * Debounced, because a busy conversation renders several times a second and
   * this serialises the whole window each time. Two seconds of staleness in the
   * saved copy is not worth a phone getting warm.
   */
  var saveTimer = null;
  var savePending = null;
  function queueSave(all) {
    if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
    savePending = { conv: activeConv, all: all };
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 2000);
  }
  function flushSave() {
    var job = savePending;
    savePending = null;
    if (!job || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
    /*
     * Never save an empty thread over a good one. An empty render happens on a
     * conversation switch and on a failed cold read, and letting either of
     * those overwrite the saved copy would delete his history at exactly the
     * moment he is about to need it.
     */
    if (!job.all.length) return;
    try {
      navigator.serviceWorker.controller.postMessage({
        relay: 'save-thread',
        conversation: job.conv,
        body: JSON.stringify({ count: job.all.length, now: new Date().toISOString(), entries: job.all })
      });
    } catch (e) { /* no controller any more; the next render tries again */ }
  }

  function refreshTimes() {
    var els = list.querySelectorAll('.time');
    for (var i = 0; i < els.length; i++) els[i].textContent = rel(els[i].getAttribute('data-ts'));
    // "saved 2m ago" has to keep counting, or a thread left open on a plane
    // goes on claiming to be two minutes old for the whole flight.
    if (offlineAt) { conn.textContent = 'offline — saved ' + rel(offlineAt); paintOffBar(); }
  }

  function merge(arr) {
    var changed = false;
    for (var i = 0; i < arr.length; i++) {
      var e = arr[i];
      if (!e || typeof e.id !== 'string') continue;
      var s = sigOf(e);
      if (sigs.get(e.id) !== s) {
        sigs.set(e.id, s); entries.set(e.id, e); changed = true;
        // Candidates for reading aloud. Collected here rather than at the two
        // call sites so an agent reply is caught whether it arrived by SSE push
        // or by a poll — they merge through the identical code path.
        if (e.role === 'agent') freshAgent.push(e);
      }
      var r = ms(e.rev || e.ts);
      if (r > cursorMs) cursorMs = r;
    }
    if (changed && entries.size > KEEP) trimEntries();
    return changed;
  }

  /*
   * Drop the oldest entries once the thread outgrows KEEP. Insertion order is
   * not send order — a repair pass can merge an old message after a new one —
   * so the cut is made by timestamp, not by Map order, or a slow-arriving old
   * entry would evict a message that is still on screen.
   */
  function trimEntries() {
    var all = Array.from(entries.values());
    all.sort(function (a, b) { return ms(a.ts) - ms(b.ts); });
    for (var i = 0; i < all.length - KEEP; i++) {
      entries.delete(all[i].id);
      sigs.delete(all[i].id);
    }
  }

  /*
   * Reading a header off something that may not be a real Response. The stub
   * suite hands back plain objects, and a page that threw here would take the
   * whole poll loop down over a diagnostic.
   */
  function header(r, name) {
    try { return (r && r.headers && r.headers.get) ? r.headers.get(name) : null; } catch (e) { return null; }
  }

  /*
   * Three states, not two, and the third is the one that was missing.
   *
   *   connected     — nothing shown, as before.
   *   offline       — "offline — retrying". Nothing saved; the thread on screen
   *                   is whatever was already in memory.
   *   offline+saved — the service worker answered from its copy. Say when it
   *                   was saved, and say that sending is off, because a message
   *                   typed here would go nowhere and the page would look no
   *                   different while it failed to.
   *
   * `savedAt` is the timestamp from the worker, or null if this is just a
   * failed request.
   */
  function setConn(ok, savedAt) {
    conn.className = ok ? '' : 'show';
    offlineAt = ok ? null : (savedAt || offlineAt);
    if (ok) {
      conn.textContent = 'offline — retrying';
      offBar.className = '';
      offBar.textContent = '';
      composer.className = '';
      input.placeholder = 'Message…';
      if (!sending) sendBtn.disabled = false;
      return;
    }
    if (!offlineAt) {
      // Offline with nothing saved to fall back on. The existing wording, and
      // the composer is left alone: the server may answer the very next try.
      conn.textContent = 'offline — retrying';
      offBar.className = '';
      offBar.textContent = '';
      composer.className = '';
      input.placeholder = 'Message…';
      return;
    }
    conn.textContent = 'offline — saved ' + rel(offlineAt);
    paintOffBar();
    composer.className = 'off';
    input.placeholder = 'Offline — can’t send';
    sendBtn.disabled = true;
  }

  function paintOffBar() {
    if (!offlineAt) return;
    offBar.textContent = '';
    var b = document.createElement('b');
    b.textContent = 'Offline.';
    offBar.appendChild(b);
    offBar.appendChild(document.createTextNode(' You are reading messages saved '));
    var w = document.createElement('span');
    w.className = 'when';
    w.textContent = rel(offlineAt);
    offBar.appendChild(w);
    offBar.appendChild(document.createTextNode(
      '. Newer ones will not be here, and nothing can be sent until you are back on. ' +
      'Anything you type stays in the box.'));
    offBar.className = 'show';
  }

  // `sticky` keeps the message up until it is tapped away. Used when the reason
  // matters and the user has to go do something about it — a nine-second flash is
  // how you end up with "it just didn't work".
  function showErr(msg, sticky) {
    errBar.textContent = msg;
    errBar.className = sticky ? 'show sticky' : 'show';
    clearTimeout(errTimer);
    if (!sticky) errTimer = setTimeout(clearErr, 9000);
  }
  function clearErr() { clearTimeout(errTimer); errBar.className = ''; errBar.textContent = ''; }

  /*
   * Report a client-side failure to the server so it lands in `docker logs
   * relay-queue`. The UI's real home is a phone, where there is no console to
   * read, and "the mic did nothing" is not a diagnosable bug report. Entirely
   * best-effort: it never throws, never blocks, and never surfaces its own errors.
   */
  function logClient(event, detail) {
    try {
      fetch('/client-log', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ event: event, detail: detail, ua: navigator.userAgent, url: location.href })
      }).catch(function () {});
    } catch (e) { /* logging must never be able to break the page */ }
  }

  /*
   * WHY THE CRASH WAS INVISIBLE, AND HOW THIS SEES IT.
   *
   * A tab killed by the phone — Android's low-memory killer, or a content
   * process crash — runs no code on the way out. Every report it might have
   * sent dies with it, which is why hours of `docker logs` showed nothing but
   * the symptoms of the *reload* that followed. So this does not try to catch
   * the crash. It marks the session open on arrival and clears the mark on a
   * clean exit; a mark still standing at the next load means the previous
   * session vanished. The crash is then reported by its successor, with how
   * long it lived and what it was holding when it went.
   *
   * `localStorage` on purpose, not `sessionStorage`: the latter is scoped to a
   * tab that no longer exists by the time anyone can read it.
   */
  var SESSION_KEY = 'relay.session';
  var sessionStartedAt = Date.now();
  var sessionTimer = null;

  function sessionState() {
    return {
      open: true,
      startedAt: sessionStartedAt,
      aliveMs: Date.now() - sessionStartedAt,
      entries: entries ? entries.size : 0,
      conv: !!convOn,
      speak: !!speakOn,
      hidden: !!document.hidden,
      // Firefox does not expose this; Chromium does. Recorded when offered.
      heapMB: (window.performance && performance.memory)
        ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null
    };
  }

  function sessionMark(open) {
    try {
      var s = sessionState();
      s.open = open;
      window.localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    } catch (e) { /* private mode: we simply lose the ability to see a crash */ }
  }

  function reportLastSession() {
    var prev = null;
    try {
      var raw = window.localStorage.getItem(SESSION_KEY);
      if (raw) prev = JSON.parse(raw);
    } catch (e) { return; }
    // A clean exit cleared the flag. Anything still open was killed.
    if (prev && prev.open) {
      logClient('page-vanished', {
        aliveSec: Math.round((prev.aliveMs || 0) / 1000),
        entries: prev.entries,
        conv: prev.conv,
        speak: prev.speak,
        hidden: prev.hidden,
        heapMB: prev.heapMB
      });
    }
  }

  function initCrashWatch() {
    reportLastSession();
    sessionMark(true);
    // Cheap and periodic, so the marker's numbers describe the moment it died
    // rather than the moment it loaded.
    sessionTimer = setInterval(function () { sessionMark(true); }, 15000);

    // A clean exit. `pagehide` fires where `unload` is unreliable on mobile.
    window.addEventListener('pagehide', function () {
      clearInterval(sessionTimer);
      sessionMark(false);
    });

    /*
     * Errors that reach the top level. These were being swallowed entirely: the
     * page has no console anyone can read, because its home is a phone.
     */
    window.addEventListener('error', function (e) {
      logClient('js-error', {
        message: (e && e.message) || 'unknown',
        source: (e && e.filename) || '',
        line: (e && e.lineno) || 0,
        col: (e && e.colno) || 0,
        aliveSec: Math.round((Date.now() - sessionStartedAt) / 1000)
      });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      logClient('js-rejection', {
        message: (r && r.message) || String(r || 'unknown').slice(0, 200),
        aliveSec: Math.round((Date.now() - sessionStartedAt) / 1000)
      });
    });
  }

  // All requests are root-relative so the page works unchanged behind a reverse proxy.
  function poll(fullRead) {
    var scope = 'conversation=' + encodeURIComponent(activeConv);
    var url = (!fullRead && cursorMs)
      ? '/thread?' + scope + '&since=' + cursorMs
      : '/thread?' + scope + '&limit=' + WINDOW;
    /*
     * No `cache: 'no-store'` here, and it must stay that way.
     *
     * Firefox does not route a request made with `cache: 'no-store'` through
     * the service worker at all — it goes straight to the network and fails
     * outright when there isn't one. This read used to carry that flag, and the
     * effect was that offline reading silently did nothing on his main browser:
     * the thread was saved correctly, the worker was installed and controlling,
     * and the one request that mattered walked straight past it.
     *
     * Nothing is lost by dropping it. The server already answers every JSON
     * route with `cache-control: no-store`, so the HTTP cache was never going
     * to hold these anyway — the flag was belt and braces, and the belt was
     * strangling the feature.
     */
    return fetch(url, { headers: { accept: 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        /*
         * A read answered from the service worker's saved copy looks exactly
         * like a successful one from here — same status, same JSON — which is
         * the whole hazard. The worker stamps it, and this is where that stamp
         * is turned into the difference between "live" and "history".
         */
        var cached = header(r, 'x-relay-from-cache') === '1';
        // Held as ISO like every other time in this page, because rel() and
        // ms() parse dates and would silently return '' for an epoch number.
        var stamp = Number(header(r, 'x-relay-cached-at') || 0);
        var at = stamp ? new Date(stamp).toISOString() : null;
        return r.json().then(function (j) { return { j: j, cached: cached, at: at }; });
      })
      .then(function (got) {
        var j = got.j;
        var arr = (j && Array.isArray(j.entries)) ? j.entries : [];
        if (merge(arr) || !everRendered) render();
        harvestSpeech();
        if (got.cached) {
          /*
           * Not a success. `fails` is left climbing so the retry keeps backing
           * off — the network really is gone, and hammering it from a phone
           * with no signal is how the battery goes.
           */
          fails++;
          setConn(false, got.at);
          return false;
        }
        fails = 0; setConn(true);
        // The network is demonstrably up, so anything a tick lost to it can go
        // now. Cheap: it does nothing at all unless something is actually stuck.
        flushOutbox();
        return true;
      })
      .catch(function () { fails++; setConn(false); return false; });
  }

  function schedule() {
    clearTimeout(timer);
    // Backing off on failure is what keeps a dead server from being hammered; the
    // live stream only ever makes the *healthy* interval longer, never the retry.
    var delay = fails ? Math.min(POLL_MS * Math.pow(2, Math.min(fails, 4)), MAX_BACKOFF)
      : (streamOk ? STREAM_POLL_MS : POLL_MS);
    timer = setTimeout(tick, delay);
  }
  function tick() {
    if (document.hidden) { schedule(); return; }
    polls++;
    var full = polls % FULL_EVERY === 0;
    if (full) loadConvs(); // the repair pass refreshes the menu too
    poll(full).then(schedule);
  }
  function kick() { clearTimeout(timer); timer = setTimeout(tick, 0); }

  /*
   * Live updates. The server pushes every change over SSE, so another device's
   * message lands here immediately. Polling above stays exactly as it was and
   * takes over whenever the stream is not running — EventSource reconnects on
   * its own, and if it never succeeds the page is simply the poller it used to be.
   */
  function openStream() {
    if (!window.EventSource || stream) return;
    try { stream = new EventSource('/events'); } catch (e) { return; }
    stream.onopen = function () {
      streamOk = true;
      // Catch up on anything that changed while the stream was down.
      poll(false).then(schedule);
    };
    stream.onmessage = function (e) {
      var j;
      try { j = JSON.parse(e.data); } catch (err) { return; }
      fails = 0; setConn(true);
      // A conversation was created, renamed, reassigned or archived.
      if (j && j.conversation) { loadConvs(); return; }
      /*
       * One stream carries every conversation, so a change to one you are not
       * looking at must NOT be merged into the thread on screen — it is only
       * flagged, which is what makes switching an informed choice rather than a
       * guess. Scoping this server-side would have needed a second connection.
       */
      if (j && typeof j.conversationId === 'string' && j.conversationId !== activeConv) {
        convNew[j.conversationId] = true;
        markMenu();
        queueConvRefresh();
        return;
      }
      var arr = (j && Array.isArray(j.entries)) ? j.entries : [];
      if (merge(arr)) render();
      harvestSpeech();
      queueConvRefresh(); // keep the menu's snippets and counts honest
    };
    stream.onerror = function () {
      // EventSource retries by itself; fall straight back to fast polling meanwhile.
      if (streamOk) { streamOk = false; kick(); }
    };
  }

  // ------------------------------------------------------------------ conversations
  /*
   * One queue, many threads. A conversation is just a label every task carries;
   * the server derives the list, the counts and a snippet of the latest message
   * from the same task records the thread comes from, so there is no second
   * store and nothing to keep in sync.
   *
   * The menu deliberately shows *why* you might want to switch — what was said
   * last, how long ago, how much is waiting, and which agent is meant to answer
   * — because a list of bare titles tells you nothing on a phone.
   */
  var menuBtn = document.getElementById('menu');
  var menuDot = document.getElementById('menudot');
  var titleEl = document.getElementById('title');
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  var drawerClose = document.getElementById('drawerclose');
  var newTitle = document.getElementById('newtitle');
  var newConvBtn = document.getElementById('newconv');
  var convErr = document.getElementById('converr');
  var convList = document.getElementById('convlist');

  /*
   * ---- the conversation lives in the address bar --------------------------
   *
   * WHY. Reloading is what this user does when the page looks stuck, and the
   * page looking stuck is exactly the failure being fixed elsewhere in this
   * file. Before this, every reload landed back on the default conversation
   * without saying so, so the next message went to whichever agent happened to
   * own `main` rather than the one being talked to. A silently misrouted
   * message is worse than an error: nobody finds out until an agent acts on
   * something that was never meant for it.
   *
   * A HASH, NOT A PATH. The server is a hand-rolled node:http app with an
   * explicit route table; `/c/<id>` would need a catch-all that serves the page
   * for any unmatched path, and that catch-all is precisely the thing that
   * turns a genuine 404 — a typo'd API call, a missing asset — into a silent
   * 200 of HTML. A fragment needs no server change at all, is never sent to the
   * server, and therefore behaves identically through the Cloudflare tunnel and
   * Access. `#/c/` rather than a bare `#<id>` so a later view can have its own
   * route without colliding.
   */
  var CONV_HASH = /^#\/c\/(.*)$/;

  function convFromUrl() {
    var m = CONV_HASH.exec(String(location.hash || ''));
    if (!m || !m[1]) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  /*
   * `replace` for anything the user did not choose — the first paint, and
   * repairing a dead link. Only a deliberate switch earns a history entry, or
   * Back would walk through states nobody navigated to.
   */
  function setUrl(id, replace) {
    var h = '#/c/' + encodeURIComponent(id);
    if (location.hash === h) return;
    // An overlay is open, so the entry on top of the stack is its marker (see
    // uiSync). Going somewhere spends that marker rather than stacking on it —
    // otherwise back from the new conversation lands on a ghost entry for a
    // drawer that is already shut, and appears to do nothing.
    if (!replace && uiMarked) { uiMarked = false; replace = true; }
    try {
      if (window.history && window.history.pushState) {
        window.history[replace ? 'replaceState' : 'pushState'](null, '', h);
        return;
      }
    } catch (e) { /* fall through to the assignment below */ }
    // No History API: still correct, just always a new entry. The hashchange
    // this fires is absorbed by the already-there guard in onUrlChange().
    location.hash = h;
  }

  /*
   * Back and forward move between conversations instead of leaving the app.
   * Both events are listened for because pushState-with-a-fragment fires
   * popstate, hashchange, or both depending on the browser; the guard below
   * makes a duplicate harmless.
   */
  function onUrlChange() {
    var id = convFromUrl() || DEFAULT_CONV; // hash hand-edited away: go home
    if (id === activeConv) return;
    // The URL is already right, so this must not push another entry.
    return switchConv(id, true, 'none').then(function () {
      /*
       * Unlike a tap, a URL can name a conversation this page has never heard
       * of — pasted from another device, or archived since. `switchConv` does
       * not validate, so without this the page sits on an empty thread with a
       * title of "relay" until the ten-minute repair poll comes round, which is
       * indistinguishable from the app being broken. Refreshing the list settles
       * it either way: a conversation made elsewhere simply appears, and a dead
       * one is repaired to the default by loadConvs().
       */
      if (!convById(id)) return loadConvs();
    });
  }

  function markMenu() {
    var any = false;
    for (var k in convNew) { if (k !== activeConv) { any = true; break; } }
    if (menuDot) menuDot.className = any ? 'show' : '';
  }

  /** Coalesce list refreshes: a burst of pushes should cost one request. */
  function queueConvRefresh() {
    if (convTimer) return;
    convTimer = setTimeout(function () { convTimer = null; loadConvs(); }, 400);
  }

  function loadConvs() {
    // No `cache: 'no-store'`, for the reason spelled out in poll(): in Firefox
    // it would take this read straight past the service worker, so the
    // conversation list would be missing offline. The server sends no-store.
    return fetch('/conversations', { headers: { accept: 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        /*
         * This read IS served from the service worker's saved copy when the
         * network is gone, and it arrives looking exactly like a live one.
         * Recorded so the activity badge can stop making live-sounding claims
         * ("2 subagents running") out of a snapshot of unknown age.
         */
        convsFromCache = header(r, 'x-relay-from-cache') === '1';
        return r.json();
      })
      .then(function (j) {
        if (j && typeof j.defaultId === 'string') DEFAULT_CONV = j.defaultId;
        convs = (j && Array.isArray(j.conversations)) ? j.conversations : [];
        // The conversation in the URL — or the remembered one — may have been
        // archived, or may never have existed. Land on the default rather than
        // on a blank page, say which thread this now is, and REPLACE the bad
        // address so it cannot survive into the next reload. Silence here would
        // be the same misrouting bug wearing a different hat.
        var here = false;
        for (var i = 0; i < convs.length; i++) if (convs[i].id === activeConv) here = true;
        if (!here && convs.length) {
          var missing = activeConv;
          return switchConv(DEFAULT_CONV, true, 'replace').then(function (ok) {
            var c = convById(DEFAULT_CONV);
            showErr('That conversation is not here any more — showing ' +
              ((c && c.title) || 'the main thread') + ' instead.');
            logClient('conv-missing', { wanted: missing });
            return ok;
          });
        }
        applyHue(activeConv);
        renderConvs();
        setTitle();
        return true;
      })
      .catch(function () { return false; });
  }

  function convById(id) {
    for (var i = 0; i < convs.length; i++) if (convs[i].id === id) return convs[i];
    return null;
  }

  function setTitle() {
    if (!titleEl) return;
    var c = convById(activeConv);
    titleEl.textContent = (c && c.title) || 'relay';
  }

  function renderConvs() {
    if (!convList) return;
    convList.textContent = '';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < convs.length; i++) frag.appendChild(convNode(convs[i]));
    convList.appendChild(frag);
    markMenu();
  }

  /*
   * A dozen bars of recent activity. It answers one question — busy, quiet or
   * dead — so it has no axes, no labels and no library. Bars are built from
   * divs rather than SVG because that is one fewer namespace to get wrong and
   * scales perfectly at phone size.
   *
   * A conversation with nothing in it renders as a deliberate flat baseline, NOT
   * as an empty box: "quiet" and "broken" must not look the same. The words are
   * in the aria-label because a row of coloured bars is not information a screen
   * reader or a colourblind reader can use on its own.
   */
  function sparkNode(c) {
    var data = (c && c.spark) || [];
    var wrap = document.createElement('div');
    wrap.className = 'spark';
    var max = 0, total = 0, i;
    for (i = 0; i < data.length; i++) { total += data[i]; if (data[i] > max) max = data[i]; }
    var mins = Math.round(((c && c.sparkBucketMs) || 900000) * data.length / 60000);
    wrap.setAttribute('role', 'img');
    wrap.setAttribute('aria-label', total
      ? total + ' messages in the last ' + (mins >= 60 ? Math.round(mins / 60) + ' hours' : mins + ' minutes')
      : 'nothing in the last ' + (mins >= 60 ? Math.round(mins / 60) + ' hours' : mins + ' minutes'));
    if (!total) wrap.className = 'spark quiet';
    var hue = hueOf(c.id);
    for (i = 0; i < data.length; i++) {
      var bar = document.createElement('i');
      // Always at least a sliver, so an idle stretch reads as a baseline.
      bar.style.height = (max ? Math.max(8, Math.round((data[i] / max) * 100)) : 6) + '%';
      if (total) bar.style.backgroundColor = 'hsl(' + hue + ' 78% 55%)';
      wrap.appendChild(bar);
    }
    return wrap;
  }

  /*
   * Wording matters here. "checking in" is not "working": a heartbeat can come
   * from a background loop and prove nothing about whether the agent is awake.
   * `stuck` is the state that used to look healthiest — beating steadily while
   * a message sits unanswered — so it is the loudest thing in the list.
   */
  var AGENT_STATE = {
    watching: 'working',
    idle: 'idle, nothing waiting',
    stuck: 'STUCK — checking in but doing nothing',
    stale: 'not responding',
    silent: 'NOT RESPONDING',
    never: 'has never checked in',
    unassigned: 'nobody assigned'
  };

  /*
   * Who owns this conversation, and are they actually there? An agent that has
   * gone silent is the most important thing this list can tell you, so it gets
   * a word ("NOT RESPONDING"), a glyph and a colour rather than any one of them.
   */
  function agentNode(c) {
    var st = (c && c.agentState) || { state: 'unassigned', agoSec: null };
    var line = document.createElement('div');
    line.className = 'convagent ' + st.state;
    var dot = document.createElement('span');
    dot.className = 'adot';
    dot.textContent = st.state === 'watching' ? '●'
      : st.state === 'stuck' ? '!'
        : st.state === 'silent' || st.state === 'stale' ? '!'
          : st.state === 'idle' ? '·' : '○';
    line.appendChild(dot);
    var label = c.agent ? c.agent + ' · ' + AGENT_STATE[st.state] : AGENT_STATE.unassigned;
    // For the states that mean trouble, say how long — "stuck" is only credible
    // with a duration attached, and it is the number that makes it actionable.
    if ((st.state === 'stuck' || st.state === 'stale' || st.state === 'silent')
      && st.actedAgoSec !== null && st.actedAgoSec !== undefined) {
      label += ' for ' + rel(new Date(Date.now() - st.actedAgoSec * 1000).toISOString());
    }
    var name = document.createElement('span'); // spacing comes from the flex gap
    name.textContent = label;
    line.appendChild(name);
    return line;
  }

  /*
   * The collapsed activity badge. Reads the summary that already rides along on
   * /conversations, so the list costs no extra request.
   *
   * Three outcomes, and the difference between them is the whole point:
   *
   *   - no `activity` field at all — an older server, or one that does not
   *     track this. We do not know, so we say NOTHING. Inventing a reassuring
   *     line from absent data is the failure this panel exists to avoid.
   *   - `reporting: false` — the coordinator was never taught to report. Say
   *     that, in words. Never "0 running", which would read as a measurement.
   *   - `reporting: true` — the counts are real and can be shown plainly.
   */
  function activityNode(c) {
    var a = c && c.activity;
    if (!a) return null;
    var line = document.createElement('div');
    /*
     * The list came out of the offline cache, so every number in it is of
     * unknown age. "not reported" would be a claim about the coordinator made
     * from a stale snapshot, and a green "2 subagents running" would be worse:
     * the most confident-looking thing in the drawer, sourced from history.
     * Say where it came from and drop the live styling.
     */
    if (convsFromCache) {
      line.className = 'convact';
      var known = a.reporting
        ? (a.running ? a.running + ' running' : (a.subagents || 0) + ' subagents, none running')
        : 'nothing reported';
      line.appendChild(el('span', 'acount', 'subagents: ' + known + ' when last saved'));
      return line;
    }
    if (!a.reporting) {
      line.className = 'convact';
      line.appendChild(el('span', 'acount', 'subagents: not reported'));
      return line;
    }
    var running = a.running || 0;
    line.className = 'convact' + (running ? ' live' : '');
    var bits = [];
    if (running) bits.push(running + ' subagent' + (running === 1 ? '' : 's') + ' running');
    else if (a.subagents) bits.push(a.subagents + ' subagent' + (a.subagents === 1 ? '' : 's') + ', none running');
    else bits.push('reporting, no subagents yet');
    line.appendChild(el('span', 'acount', bits.join(' · ')));
    return line;
  }

  function convNode(c) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'conv' + (c.id === activeConv ? ' active' : '');
    // Each row wears its own conversation's colour, so the list is scannable
    // and the stripe matches the header once you switch into it.
    row.style.borderLeftColor = 'hsl(' + hueOf(c.id) + ' 78% 55%)';
    if (c.id === activeConv) row.setAttribute('aria-current', 'true');

    var top = document.createElement('div');
    top.className = 'convtop';
    var name = document.createElement('span');
    name.className = 'convname';
    name.textContent = c.title || c.id;      // textContent only, like every other string here
    top.appendChild(name);
    if (convNew[c.id] && c.id !== activeConv) {
      var dot = document.createElement('span');
      dot.className = 'convdot';
      top.appendChild(dot);
    }
    var when = document.createElement('span');
    when.className = 'convwhen';
    when.textContent = rel(c.lastTs || c.createdAt);
    top.appendChild(when);

    var snip = document.createElement('div');
    snip.className = 'convsnip';
    var counts = c.counts || {};
    snip.textContent = c.lastText
      ? (c.lastRole === 'agent' ? 'Reply: ' : '') + c.lastText
      : 'No messages yet';

    row.appendChild(top);
    row.appendChild(snip);

    row.appendChild(sparkNode(c));
    row.appendChild(agentNode(c));
    var an = activityNode(c);
    if (an) row.appendChild(an);

    var bits = [];
    if (counts.pending) bits.push(counts.pending + ' waiting');
    if (counts.claimed) bits.push(counts.claimed + ' in progress');
    if (bits.length) {
      var meta = document.createElement('div');
      meta.className = 'convmeta';
      meta.textContent = bits.join(' · ');
      row.appendChild(meta);
    }

    row.addEventListener('click', function () { switchConv(c.id); });
    return row;
  }

  /*
   * Switching wipes the thread and re-reads from scratch. `booted` is dropped
   * for the duration for the same reason it exists at boot: the incoming full
   * read is history, and reading a conversation's backlog aloud on every switch
   * would be intolerable. Dictation deliberately keeps running — switching must
   * not strand a live microphone — and anything already captured still posts to
   * the conversation it was spoken into.
   */
  function switchConv(id, quiet, urlMode) {
    if (!quiet && id === activeConv) { closeDrawer(); return Promise.resolve(true); }
    activeConv = id;
    pref('relay.conv', id);
    if (urlMode !== 'none') setUrl(id, urlMode === 'replace');
    applyHue(id);
    delete convNew[id];
    entries.clear(); sigs.clear();
    cursorMs = 0; everRendered = false; fails = 0;
    booted = false;
    speakQueue = [];
    render();
    setTitle();
    renderConvs();
    try { refreshShareBadge(); } catch (e) { /* hoisting order; the panel still works */ }
    closeDrawer();
    clearTimeout(timer);
    return poll(true).then(function () { booted = true; }).then(function () {
      schedule();
      scrollBottom();
      return true;
    });
  }

  /*
   * `drawerOpen` is the truth, not the class name. The class is applied a tick
   * late so the slide-in transition has a frame to start from — and a create-
   * then-switch can close the drawer inside that tick, which would otherwise
   * leave the deferred `open` to reopen a drawer nobody asked for.
   */
  var drawerOpen = false;

  function openDrawer() {
    if (!drawer || drawerOpen) return;
    drawerOpen = true;
    drawer.hidden = false;
    setTimeout(function () { if (drawerOpen) drawer.className = 'open'; }, 0);
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
    loadConvs();
    uiSync(); // back should shut this, not leave the app
  }

  function closeDrawer() {
    if (!drawer || !drawerOpen) return;
    drawerOpen = false;
    drawer.className = '';
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
    if (convErr) { convErr.className = ''; convErr.textContent = ''; }
    setTimeout(function () { if (!drawerOpen) drawer.hidden = true; }, 200);
    uiSync();
  }

  function createConv() {
    var title = newTitle.value.trim();
    if (!title) { newTitle.focus(); return; }
    newConvBtn.disabled = true;
    convErr.className = ''; convErr.textContent = '';
    fetch('/conversations', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ title: title })
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    }).then(function (j) {
      newTitle.value = '';
      return loadConvs().then(function () { return switchConv(j.id); });
    }).catch(function (err) {
      convErr.textContent = 'Could not create — ' + ((err && err.message) || 'network error') + '.';
      convErr.className = 'show';
    }).then(function () { newConvBtn.disabled = false; });
  }

  function initConvs() {
    /*
     * Precedence: the URL, then what this device last had open, then the
     * default. The URL wins because it is the only one of the three that
     * someone can have deliberately chosen — a shared link, or a reload of a
     * thread this phone was already in. localStorage stays as the fallback so
     * that opening the bare bookmarked address still comes back where it was.
     */
    var saved = pref('relay.conv');
    var fromUrl = convFromUrl();
    if (fromUrl) activeConv = fromUrl;
    else if (saved) activeConv = saved;
    // Put it in the address bar from the first paint, without adding a history
    // entry for a page nobody navigated to. Whether the id is real is not known
    // until /conversations answers; loadConvs() repairs it if it is not.
    setUrl(activeConv, true);
    window.addEventListener('popstate', onUrlChange);
    window.addEventListener('hashchange', onUrlChange);
    applyHue(activeConv);
    if (menuBtn) menuBtn.addEventListener('click', function () {
      if (drawerOpen) closeDrawer(); else openDrawer();
    });
    if (scrim) scrim.addEventListener('click', closeDrawer);
    if (drawerClose) drawerClose.addEventListener('click', closeDrawer);
    if (newConvBtn) newConvBtn.addEventListener('click', createConv);
    if (newTitle) newTitle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); createConv(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });
    loadConvs();
  }

  // ------------------------------------------------------------------ status view
  /*
   * "Is anything actually listening, or am I typing into a void?"
   *
   * That is what this page is for, and it is a question about trust rather than
   * statistics — so the headline comes first, in plain words, and answers it
   * without scrolling or interpretation. Counts are further down where they
   * belong: on their own they are reassurance theatre.
   *
   * The one rule that matters: **quiet must never look broken.** An empty queue
   * with nobody checking in reads "Nothing is waiting", not an alarm. The server
   * decides the level; this only renders it.
   */
  var statusView = document.getElementById('statusview');
  var statusBody = document.getElementById('statusbody');
  var statusOpen = document.getElementById('statusopen');
  var statusClose = document.getElementById('statusclose');
  var statusTimer = null;
  var statusOn = false;
  var lastBootAt = null;
  var sawRestart = false;

  var STATUS_MS = 5000;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function srow(parent, label, value, tone) {
    var r = el('div', 'srow');
    r.appendChild(el('span', 'k', label));
    r.appendChild(el('span', 'v' + (tone ? ' ' + tone : ''), value));
    parent.appendChild(r);
    return r;
  }
  function scard(title) {
    var c = el('div', 'scard');
    if (title) c.appendChild(el('h2', null, title));
    return c;
  }
  function ago(sec) {
    if (sec === null || sec === undefined) return 'never';
    if (sec < 60) return sec + 's ago';
    if (sec < 3600) return Math.round(sec / 60) + ' min ago';
    if (sec < 86400) return Math.round(sec / 3600) + 'h ago';
    return Math.round(sec / 86400) + 'd ago';
  }
  function dur(sec) {
    if (sec === null || sec === undefined) return '—';
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.round(sec / 60) + ' min';
    if (sec < 86400) return Math.round(sec / 3600) + 'h';
    return Math.round(sec / 86400) + 'd';
  }

  function renderStatus(s) {
    statusBody.textContent = '';
    var frag = document.createDocumentFragment();

    // --- the headline ---
    var head = el('div', 'shead ' + ((s.headline && s.headline.level) || 'idle'));
    head.appendChild(el('div', null, (s.headline && s.headline.text) || 'Status unavailable.'));
    /*
     * Both kinds of evidence, always, and never conflated. "Last checked in" is
     * a heartbeat, which anything with a socket can send; "last did something"
     * is a claim or a result, which only a running agent can produce. Showing
     * them side by side is what makes a stuck agent visible — beating at 2s
     * while having done nothing for 8 minutes.
     */
    var w = s.watch || {};
    var sub = [];
    if (w.lastActedAgoSec !== null && w.lastActedAgoSec !== undefined) {
      sub.push('Last did something ' + ago(w.lastActedAgoSec) + '.');
    } else {
      sub.push('No agent has done anything here yet.');
    }
    if (w.lastSeenAgoSec !== null && w.lastSeenAgoSec !== undefined) {
      sub.push((w.agent || 'An agent') + ' last checked in ' + ago(w.lastSeenAgoSec) + '.');
    } else {
      sub.push('Nothing is sending heartbeats.');
    }
    head.appendChild(el('div', 'ssub', sub.join(' ')));
    frag.appendChild(head);

    if (sawRestart) {
      var note = scard(null);
      note.appendChild(el('div', 'snote',
        'The server restarted while you were watching. That is normal — it updates itself when the code changes, and nothing in the queue is lost.'));
      frag.appendChild(note);
    }

    // --- waiting ---
    var wait = scard('Waiting');
    var ow = s.responsiveness && s.responsiveness.oldestWaiting;
    if (ow) {
      srow(wait, 'Oldest unanswered', dur(ow.waitingSec), ow.waitingSec > 600 ? 'bad' : '');
      var q = el('div', 'sline');
      q.appendChild(el('div', 't', ow.text || '(no text)'));
      q.appendChild(el('div', 'w', ow.status === 'claimed' ? 'an agent has picked this up' : 'nobody has picked this up yet'));
      wait.appendChild(q);
    } else {
      wait.appendChild(el('div', 'sempty', 'Nothing is waiting — every message has been answered.'));
    }
    var c = s.counts || {};
    srow(wait, 'Waiting / in progress / answered',
      (c.pending || 0) + ' / ' + (c.claimed || 0) + ' / ' + (c.done || 0));
    frag.appendChild(wait);

    // --- responsiveness ---
    var r = s.responsiveness || {};
    var speed = scard('How fast, recently');
    if ((r.timeToClaimSec && r.timeToClaimSec.samples) || (r.timeToAnswerSec && r.timeToAnswerSec.samples)) {
      if (r.timeToClaimSec) {
        srow(speed, 'Picked up, typically', dur(r.timeToClaimSec.median));
        srow(speed, 'Slowest to pick up', dur(r.timeToClaimSec.worst));
      }
      if (r.timeToAnswerSec) {
        srow(speed, 'Answered, typically', dur(r.timeToAnswerSec.median));
        srow(speed, 'Slowest to answer', dur(r.timeToAnswerSec.worst));
      }
      speed.appendChild(el('p', 'snote', 'Over the last '
        + Math.max((r.timeToClaimSec && r.timeToClaimSec.samples) || 0,
          (r.timeToAnswerSec && r.timeToAnswerSec.samples) || 0) + ' messages.'));
    } else {
      speed.appendChild(el('div', 'sempty', 'Nothing has been answered yet, so there is nothing to measure.'));
    }
    frag.appendChild(speed);

    // --- recent activity ---
    var act = scard('Recent activity');
    var rows = (s.recent || []);
    if (!rows.length) {
      act.appendChild(el('div', 'sempty', 'No messages yet.'));
    } else {
      for (var i = 0; i < rows.length && i < 12; i++) {
        var ev = rows[i];
        var line = el('div', 'sline');
        var verb = ev.kind === 'message' ? 'Message in'
          : ev.kind === 'claimed' ? 'Picked up' + (ev.who ? ' by ' + ev.who : '')
            : 'Answered' + (ev.who ? ' by ' + ev.who : '');
        line.appendChild(el('div', 'w', verb + ' · ' + rel(ev.at)));
        line.appendChild(el('div', 't', ev.text || ''));
        act.appendChild(line);
      }
    }
    frag.appendChild(act);

    // --- plumbing ---
    var sv = s.server || {};
    var plumb = scard('Under the hood');
    srow(plumb, 'Live updates', streamOk ? 'pushed instantly' : 'polling every 3s',
      streamOk ? 'good' : '');
    srow(plumb, 'Conversations', String(sv.conversations === undefined ? '—' : sv.conversations));
    srow(plumb, 'Messages stored', String(sv.tasks === undefined ? '—' : sv.tasks));
    srow(plumb, 'Running for', dur(sv.uptimeSec));
    srow(plumb, 'Version', String(sv.version || '—'));
    var e = s.engines;
    if (e) {
      srow(plumb, 'Speech to text', e.stt && e.stt.ok ? 'answering' : 'not answering',
        e.stt && e.stt.ok ? 'good' : 'bad');
      srow(plumb, 'Text to speech', e.tts && e.tts.ok ? 'answering' : 'not answering',
        e.tts && e.tts.ok ? 'good' : 'bad');
    }
    plumb.appendChild(el('p', 'snote',
      'Restarts are normal here: the server watches its own source and restarts itself when the code changes. Nothing in the queue is lost when it does.'));
    frag.appendChild(plumb);

    statusBody.appendChild(frag);
  }

  function loadStatus() {
    return fetch('/status', { headers: { accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (s) {
        var boot = s.server && s.server.startedAt;
        if (lastBootAt && boot && boot !== lastBootAt) sawRestart = true;
        if (boot) lastBootAt = boot;
        if (statusOn) renderStatus(s);
        return true;
      })
      .catch(function (err) {
        if (!statusOn) return false;
        statusBody.textContent = '';
        var head = el('div', 'shead alarm', 'Cannot reach the relay server.');
        head.appendChild(el('div', 'ssub',
          'The page could not load its status — ' + ((err && err.message) || 'network error') +
          '. Your messages are safe; nothing can be sent until it is back.'));
        statusBody.appendChild(head);
        return false;
      });
  }

  function showStatus() {
    if (!statusView) return;
    statusOn = true;
    statusView.hidden = false;
    closeDrawer();
    statusBody.textContent = '';
    statusBody.appendChild(el('div', 'sempty', 'Checking…'));
    loadStatus();
    // Re-read the alert state on open, not on the 5s status tick: the only
    // thing that moves is the quiet-hours clock, and polling it would burn
    // data he is paying roaming rates for.
    if (nEls) { nEls.note.textContent = ''; loadPushConfig(); }
    clearInterval(statusTimer);
    statusTimer = setInterval(function () { if (statusOn && !document.hidden) loadStatus(); }, STATUS_MS);
    uiSync();
  }

  function hideStatus() {
    if (!statusView || !statusOn) return;
    statusOn = false;
    statusView.hidden = true;
    clearInterval(statusTimer);
    statusTimer = null;
    uiSync();
  }

  function initStatus() {
    if (statusOpen) statusOpen.addEventListener('click', showStatus);
    if (statusClose) statusClose.addEventListener('click', hideStatus);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideStatus(); });
  }

  /*
   * ------------------------------------------------------- subagent activity
   *
   * What is this coordinator actually doing: which subagents it spawned, which
   * are still running, and — if it bothers to report them — which tools it ran.
   *
   * THE ONE RULE, and the reason this panel is worth building at all:
   *
   *     `reporting: false` means NOBODY TAUGHT THIS COORDINATOR TO REPORT.
   *     It does NOT mean the coordinator is idle.
   *
   * The server computes it as "has anything ever been posted here", and posting
   * is optional — an agent reports nothing unless someone wired it up, which is
   * still the default. So an empty feed is overwhelmingly "not instrumented"
   * and only rarely "nothing happened", and the two are not distinguishable
   * from the counts. Drawing an unreporting-but-busy coordinator as a calm
   * empty feed is precisely the lie a heartbeat tells when nobody is home —
   * a failure this project has already paid for repeatedly. Hence: the panel
   * branches on `reporting` BEFORE rendering anything else, and in the
   * unreported case it shows NO COUNTERS AT ALL. A zero you cannot trust is
   * worse than no number, because a zero looks like a measurement.
   *
   * Two further numbers carry caveats, and the caveats travel WITH the number
   * rather than sitting in a footnote nobody scrolls to:
   *
   *   - `toolCalls` is held in memory only and resets whenever the server
   *     restarts — which it does every time its own source changes, i.e.
   *     constantly. It is always rendered scoped ("since <time>"), never as a
   *     lifetime total, so a restart cannot read as "it stopped working".
   *   - `capped` means the feed has already dropped its oldest entries. Said
   *     out loud, because a truncated list that looks complete lies about
   *     history.
   *
   * Subagent starts and finishes are durable and survive restarts; tool calls
   * do not. That split is the server's design, and the panel labels the two
   * halves differently rather than averaging them into one confident number.
   */
  var actView = document.getElementById('actview');
  var actBody = document.getElementById('actbody');
  var actOpenBtn = document.getElementById('actopen');
  var actCloseBtn = document.getElementById('actclose');
  var actTitle = document.getElementById('acttitle');
  var actTimer = null;
  var actOn = false;
  var actConv = null;          // the conversation this panel is showing
  var ACT_MS = 5000;
  // Long enough that a subagent still running is worth a second look. Not a
  // timeout: nothing here ever hides a subagent for taking too long.
  var GHOST_SEC = 3600;

  /* `rel()` returns a bare "now", which reads as nonsense with "ago" bolted on. */
  function relAgo(iso) {
    var r = rel(iso);
    if (!r) return 'an unknown time ago';
    return r === 'now' ? 'just now' : r + ' ago';
  }
  /* "14:32" — a wall-clock anchor for the ephemeral counters. */
  function clockOf(iso) {
    var t = ms(iso);
    if (!t) return 'an unknown time';
    try {
      return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return new Date(t).toISOString().slice(11, 16); }
  }

  /*
   * A subagent that never reports `finished` stays running forever, on purpose:
   * it is the only trace of a process that may still be holding a git worktree.
   * Nothing here times it out or tidies it away — surfacing it IS the feature.
   */
  function subagentNode(s) {
    var cls = 'subrow';
    if (s.running) cls += ' running';
    else if (s.ok === false) cls += ' failed';
    else if (s.ok === null || s.ok === undefined) cls += ' noverdict';

    var row = el('div', cls);
    row.appendChild(el('span', 'sdot', s.running ? '●' : s.ok === true ? '✓' : s.ok === false ? '✗' : '?'));
    var body = el('div', 'sbody');
    body.appendChild(el('div', 'subname', s.name || '(unnamed subagent)'));
    if (s.task) body.appendChild(el('div', 'subtask', s.task));

    /*
     * A DURATION IS ONLY AS GOOD AS THE START IT WAS MEASURED FROM.
     *
     * `startedAtReconstructed` is three-valued: false means the server saw the
     * spawn happen, true means the coordinator reported the start after the
     * fact, null means the entry predates the field and nothing knows. Only
     * `false` earns an exact-looking number. The other two get "about" and a
     * line saying why, for the same reason the panel renders no counters at
     * all when `reporting` is false: a precise-looking figure that was inferred
     * is worse than an admittedly vague one, because it invites decisions.
     */
    var startApprox = s.startedAtReconstructed !== false;
    var endApprox = s.finishedAtReconstructed !== false;

    var when;
    if (s.running) {
      when = (startApprox ? 'running for about ' : 'running for ') + dur(s.runningForSec);
    } else {
      // `runningForSec` is null once finished, so elapsed comes from the pair.
      var span = (ms(s.finishedAt) && ms(s.startedAt))
        ? Math.round((ms(s.finishedAt) - ms(s.startedAt)) / 1000) : null;
      var took = span === null ? '' : (startApprox || endApprox ? ' after about ' : ' after ') + dur(span);
      when = s.ok === true ? 'finished' + took
        : s.ok === false ? 'FAILED' + took
          // Finished, but nobody said whether it worked. Not the same as "it worked".
          : 'finished' + took + ' — outcome not reported';
      when += ' · ' + rel(s.finishedAt);
    }
    body.appendChild(el('div', 'subwhen', when));

    // Where the start time came from, whenever it was not simply observed.
    if (s.startedAtReconstructed === true) {
      body.appendChild(el('div', 'subprov',
        'Start time was reported after the fact, so this is the coordinator’s reconstruction rather than '
        + 'something this server watched happen.'));
    } else if (s.startedAtReconstructed === null && s.startedAt) {
      body.appendChild(el('div', 'subprov',
        'Start time is unverified — this entry predates the record of where timestamps came from, so it may '
