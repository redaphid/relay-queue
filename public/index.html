      sticky = true;
    } else if (name === 'NotReadableError' || name === 'TrackStartError') {
      msg = 'The microphone is busy — another app is holding it. Close that and tap the mic again.';
      sticky = true;
    } else if (err && err.capture) {
      msg = 'Could not start recording — ' + ((err && err.message) || 'audio capture failed') + '.';
    } else {
      msg = 'Microphone unavailable — ' + ((err && err.message) || name || 'unknown error') + '.';
    }
    showErr(msg, sticky);
    logClient('mic-error', { name: name, message: (err && err.message) || '', capture: !!(err && err.capture) });
  }

  function startVoice() {
    if (convOn) { stopConversation('user'); return; }  // the two cannot share the mic
    if (vox) { stopVoice(vox.phase === 'speak' ? 'done' : 'cancel'); return; } // tap again to stop

    var blocked = micBlockedReason();
    if (blocked) {
      markMicBlocked(blocked);
      showErr(micBlockedMessage(blocked), true); // sticky: they need time to read and act
      logClient('mic-blocked', { reason: blocked, origin: location.origin, secure: !!window.isSecureContext });
      return;
    }
    micBtn.className = ''; // usable after all (e.g. reopened over https)
    micBtn.disabled = true;
    clearErr();
    vStatus('Starting…', '');
    openCapture('once').then(function (s) {
      vox = s;
      micBtn.className = 'on';
      micBtn.disabled = false;
      vStatus('Getting the room level…', '');
    }).catch(function (err) {
      micBtn.disabled = false;
      vHide();
      micError(err);
    });
  }

  /** Wraps a capture-stage failure so it is not mistaken for a permission problem. */
  function captureErr(err, fallback) {
    var e = new Error((err && err.message) || fallback);
    e.capture = true;
    return e;
  }

  // ------------------------------------------------------------------ conversation mode
  var noteTimer = null;
  var noteUntil = 0;

  /** The resting status line: what the bar says when it is just listening. */
  function idleStatus() {
    if (micGated) return;             // "Speaking — mic off." owns the bar until the gate lifts
    /*
     * Before anything else, and before any note: is the mic actually open? This
     * function is reached from half a dozen async continuations — a /stt reply,
     * a post that finally landed, a settle timer — every one of which can run
     * AFTER the session it belongs to was torn down. Each of those used to
     * write "Listening — go ahead." over a page with no microphone at all.
     */
    var fault = micFault();
    if (fault) { faultStatus(fault); return; }
    if (Date.now() < noteUntil) return; // ...and a note gets its moment to be read
    if (!convOn) { vStatus('Listening — go ahead.', ''); return; }
    var waiting = convQueue.length + (convBusy ? 1 : 0);
    if (waiting) { vStatus('Listening — ' + waiting + ' still transcribing…', ''); return; }
    // Say what is about to be sent, so the pause before it posts is visible
    // rather than feeling like the app has stopped paying attention.
    if (pendingText) {
      vStatus('Still listening — sending: ' + pendingText.slice(-70), '');
      return;
    }
    vStatus('Listening — go ahead.', '');
  }
  /*
   * A short-lived message ("didn't catch that") that decays back to idle. The
   * `noteUntil` guard is load-bearing: dropping an utterance is immediately
   * followed by the pump's own idleStatus() call, which would otherwise wipe the
   * explanation off the screen in the same tick and leave the user wondering why
   * nothing was sent.
   */
  function convNote(msg) {
    if (!convOn) return;
    vStatus(msg, '');
    noteUntil = Date.now() + 1600;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { noteUntil = 0; idleStatus(); }, 1600);
  }

  function startConversation() {
    if (convOn) return;
    var blocked = micBlockedReason();
    if (blocked) {
      markBlocked(convoBtn, blocked);
      markMicBlocked(blocked);
      showErr(micBlockedMessage(blocked), true);
      logClient('mic-blocked', { reason: blocked, origin: location.origin, secure: !!window.isSecureContext, mode: 'conversation' });
      return;
    }
    if (vox) stopVoice('cancel'); // one-shot dictation gives way

    convOn = true;
    convQueue = []; convBusy = false; micGated = false;
    convoBtn.className = 'on';
    convoBtn.disabled = true;      // until the mic is actually open
    convoBtn.setAttribute('aria-pressed', 'true');
    convoBtn.setAttribute('aria-label', 'Stop the hands-free conversation');
    micBtn.disabled = true;
    clearErr();
    vStatus('Starting…', '');
    openCapture('conv').then(function (s) {
      if (!convOn) { teardown(s); return; } // stopped while the mic was still opening
      vox = s;
      convoBtn.disabled = false;
      vStatus('Getting the room level…', '');
      logClient('conv-start', { rate: s.rate, speak: speakOn });
    }).catch(function (err) {
      convOn = false;
      convoBtn.className = '';
      convoBtn.disabled = false;
      convoBtn.setAttribute('aria-pressed', 'false');
      micBtn.disabled = false;
      vHide();
      micError(err);
    });
  }

  /*
   * Stopping is immediate and total: the queue is dropped, playback is cut, the
   * microphone tracks are stopped (so the browser's recording indicator goes out
   * at once) and the bar disappears. Nothing already captured is posted after
   * this returns — "off" has to mean off, instantly, or nobody will trust it.
   */
  function stopConversation(why) {
    if (!convOn) return;
    convOn = false;
    convQueue = [];
    speakQueue = [];
    stopSpeaking();
    micGated = false;
    clearTimeout(noteTimer);
    // Words captured but not yet posted are never thrown away — stopping puts
    // them in the composer, exactly like a failed send, so they can be sent by
    // hand. Nothing is posted after a stop.
    if (pendingText && !pendingInBox) {
      var kept = input.value.replace(/\s+$/, '');
      input.value = kept ? kept + ' ' + pendingText : pendingText;
      autosize();
    }
    clearStitch(true);
    var s = vox;
    vox = null;
    if (s) teardown(s);
    convoBtn.className = '';
    convoBtn.disabled = false;
    convoBtn.setAttribute('aria-pressed', 'false');
    convoBtn.setAttribute('aria-label', 'Start a hands-free conversation');
    micBtn.disabled = false;
    vHide();
    logClient('conv-stop', { why: why || 'user' });
  }

  var NOISE_PHRASES = {
    'you': 1, 'thank you': 1, 'thanks': 1, 'thank you very much': 1, 'thanks for watching': 1,
    'thank you for watching': 1, 'bye': 1, 'bye bye': 1, 'goodbye': 1, 'so': 1, 'um': 1,
    'uh': 1, 'hmm': 1, 'mm': 1, 'ah': 1, 'oh': 1, 'blank audio': 1, 'silence': 1, 'music': 1,
    'applause': 1, 'the end': 1, 'please subscribe': 1, 'subscribe': 1, 'amen': 1
  };

  function words(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
  }

  /*
   * Whisper tiny-int8 hallucinates a small, very recognisable set of phrases when
   * handed noise or near-silence. That is a known property of the model and it is
   * not being upgraded, so the phrases are filtered here instead. A false trigger
   * posts into a real queue that agents act on, which is why the bar is set this
   * way round. "okay", "yes" and "no" are deliberately absent: they are rarely
   * hallucinated and are entirely plausible things to say to an agent.
   */
  function isNoisePhrase(text) { return NOISE_PHRASES[words(text).join(' ')] === 1; }

  /*
   * DEFENCE 5. If the mic gate leaked, what comes back will be the words we just
   * said. Overlap is measured against what was *heard*, not what was said, so a
   * three-word fragment of a long reply is still caught.
   */
  function looksLikeEcho(text) {
    if (!lastSpokenText || Date.now() - lastSpokenAt > C.ECHO_WINDOW_MS) return false;
    var heard = words(text);
    if (heard.length < 2) return false; // too short to judge; "yes" is not an echo
    var said = Object.create(null), mine = words(lastSpokenText), i;
    for (i = 0; i < mine.length; i++) said[mine[i]] = 1;
    var hits = 0;
    for (i = 0; i < heard.length; i++) if (said[heard[i]]) hits++;
    return hits / heard.length >= C.ECHO_OVERLAP;
  }

  /*
   * Why this transcript must not become a message, or null if it may.
   *
   * `continuing` means there is already a pending message this would be appended
   * to. The filler-word filter is skipped in that case: "so" on its own is
   * almost always a hallucination, but "so" arriving mid-thought is a real part
   * of the sentence being built and dropping it would mangle the text.
   */
  function rejectReason(text, continuing) {
    if (!text) return 'empty';
    if (!/[a-z0-9]/i.test(text)) return 'punctuation'; // a lone "." or "?"
    if (!continuing && isNoisePhrase(text)) return 'noise';
    if (looksLikeEcho(text)) return 'echo';
    return null;
  }

  // ---- message stitching -------------------------------------------------
  var pendingText = '';    // transcript waiting to be posted, still growing
  var pendingConv = null;  // ...and the conversation it was spoken into
  var stitchTimer = null;
  var pendingInBox = false; // the composer is showing it, so Send can pre-empt us
  var pendingSince = 0;     // when the pending message started
  var lastStitchAt = 0;     // when a transcript last actually arrived; bounds the debounce

  /** True while the user is evidently not finished. The debounce waits this out. */
  function stillTalking() {
    if (micGated || convBusy || convQueue.length) return true;
    return !!(vox && vox.mode === 'conv' && vox.phase === 'speak');
  }

  /*
   * The endpointer claims someone is speaking, but nothing has come back from
   * transcription for a long time and nothing is in flight. That combination is
   * not speech — it is a microphone stuck on room noise. Cut the pending
   * message loose rather than defer it for ever. See C.MAX_DEFER_MS.
   */
  function wedged() {
    if (micGated || convBusy || convQueue.length) return false; // genuinely in flight
    if (!pendingText) return false;
    return Date.now() - lastStitchAt >= C.MAX_DEFER_MS;
  }

  function armStitch() {
    clearTimeout(stitchTimer);
    stitchTimer = setTimeout(function () {
      // Re-arm rather than post: they are mid-sentence or mid-transcription.
      if (stillTalking() && !wedged()) { armStitch(); return; }
      flushPending();
    }, C.STITCH_MS);
  }

  /*
   * Show what is about to be sent. Guessing at timing invisibly is what made
   * this feel broken, so the words appear in the composer as they accumulate —
   * the user can see it is still listening, and can hit Send to cut it short.
   * A half-typed draft is never touched: if the box has anything in it, the
   * preview stays in the status line only.
   */
  function showPending() {
    if (!pendingText) return;
    if (!pendingInBox && input.value.trim()) return; // leave a real draft alone
    input.value = pendingText;
    pendingInBox = true;
    autosize();
  }

  function clearStitch(keepBox) {
    clearTimeout(stitchTimer);
    stitchTimer = null;
    pendingText = '';
    pendingConv = null;
    pendingSince = 0;
    lastStitchAt = 0;
    if (pendingInBox && !keepBox) { input.value = ''; autosize(); }
    pendingInBox = false;
  }

  function stitchIn(text, conv) {
    // Switching conversation mid-thought posts what was said in the old one.
    if (pendingText && pendingConv !== conv) flushPending();
    if (!pendingText) pendingSince = Date.now();
    lastStitchAt = Date.now();
    pendingText = pendingText ? pendingText + ' ' + text : text;
    pendingConv = conv;
    showPending();
    // Post now rather than keep growing a message that will be refused.
    if (pendingText.length >= C.MAX_PENDING) { flushPending(); return; }
    armStitch();
    idleStatus();
  }

  function flushPending() {
    var text = (pendingText || '').trim();
    var conv = pendingConv;
    clearStitch(false);
    if (!text || !convOn) return;
    var why = rejectReason(text, false);
    if (why) {
      logClient('conv-dropped', { why: why, text: text.slice(0, 80) });
      convNote(why === 'echo' ? 'Ignored my own voice.' : 'Didn’t catch that.');
      return;
    }
    postTask(text, 'voice-conversation', conv)
      .then(function () { return conv === activeConv ? poll(false) : loadConvs(); })
      .catch(function (err) {
        var draft = input.value.replace(/\s+$/, '');
        input.value = draft ? draft + ' ' + text : text;
        autosize();
        showErr('Not sent — ' + ((err && err.message) || 'network error') + '. The words are in the box.');
      })
      .then(idleStatus);
  }

  /*
   * Drains captured utterances one at a time. Serialised on purpose: capture
   * keeps running while this is in flight (so nothing said meanwhile is lost),
   * but messages must reach the queue in the order they were spoken.
   */
  function convPump() {
    if (convBusy || !convQueue.length || !convOn) return;
    convBusy = true;
    var job = convQueue.shift();
    idleStatus();
    fetch('/stt', { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body: job.pcm })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) {
          if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
          return j;
        });
      })
      .then(function (j) {
        if (!convOn) return; // stopped while this was in flight
        var text = ((j && j.text) || '').trim();
        var why = rejectReason(text, !!pendingText);
        if (why) {
          logClient('conv-dropped', { why: why, text: text.slice(0, 80) });
          convNote(why === 'echo' ? 'Ignored my own voice.' : 'Didn’t catch that.');
          return;
        }
        // Not posted here: handed to the debounce, which decides when the user
        // has actually finished talking. See stitchIn().
        stitchIn(text, job.conv);
      })
      .catch(function (err) {
        showErr('Transcription failed — ' + ((err && err.message) || 'the server could not be reached') + '.');
        logClient('conv-stt-failed', { message: (err && err.message) || 'network error' });
      })
      .then(function () {
        convBusy = false;
        idleStatus();
        convPump();
      });
  }

  // ------------------------------------------------------------------ spoken replies
  /*
   * What is worth listening to.
   *
   * Read out verbatim an agent reply is miserable: a URL becomes half a minute of
   * "h t t p s colon slash slash", and a code block is unlistenable at any speed.
   * The rule is **say what it is, not what it says** — the exact characters are
   * already on screen where they can be read and copied, so the spoken version
   * names the thing and moves on. Every replacement is announced rather than
   * silently dropped, so a sentence never sounds like it is missing a clause.
   */
  function speakable(raw) {
    var t = String(raw == null ? '' : raw);
    t = t.replace(/```[\s\S]*?```/g, ' (a code block) ');       // fenced code
    t = t.replace(/```[\s\S]*$/, ' (a code block) ');           // unterminated fence
    t = t.replace(/\[([^\]\n]{1,80})\]\([^)\s]+\)/g, '$1');     // [label](url) -> label
    t = t.replace(/(?:https?:\/\/|www\.)\S+/gi, ' (a link) ');
    t = t.replace(/^[ \t]*[$#>]\s+\S[^\n]*$/gm, ' (a command) '); // shell prompt lines
    t = t.replace(/\b(?:curl|docker|git|npm|node|sudo|ssh|kubectl)\s+[^\n.]{12,}/gi, ' (a command) ');
    t = t.replace(/`([^`\n]*)`/g, function (m, code) {
      return /^\S{1,24}$/.test(code) ? code : ' (some code) '; // short identifiers are fine to say
    });
    t = t.replace(/(?:[A-Za-z]:[\\/]\S*|(?:[\\/][A-Za-z][\w.\-]*){2,}[\\/]?)/g, ' (a file path) ');
    t = t.replace(/\b[A-Za-z0-9+/=_-]{24,}\b/g, ' (a long identifier) '); // hashes, ids, base64
    // Emoji and arrows: nothing here is speech, and engines read them as noise.
    t = t.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[←-⯿☀-➿️]/g, ' ');
    t = t.replace(/^[ \t]*#{1,6}\s*/gm, '');                    // headings
    t = t.replace(/^[ \t]*[-*+•]\s+/gm, '');               // bullets
    t = t.replace(/^[ \t]*\|.*\|[ \t]*$/gm, ' (a table row) '); // tables
    t = t.replace(/[*_~]{1,3}(\S[^*_~\n]*)[*_~]{1,3}/g, '$1');  // emphasis
    t = t.replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').replace(/\n{2,}/g, '\n');
    // "(a link) (a link) (a link)" is worse than one; collapse runs of the same note.
    t = t.replace(/\((a code block|a link|a command|some code|a file path|a long identifier|a table row)\)(?:\s*\(\1\))+/g, '($1)');
    t = t.trim();
    if (t.length > C.MAX_SPEAK) {
      var cut = t.slice(0, C.MAX_SPEAK);
      var stop = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
      t = (stop > C.MAX_SPEAK * 0.5 ? cut.slice(0, stop + 1) : cut.replace(/\s+\S*$/, '')) +
        ' … that is the first part. The rest is on screen.';
    }
    return t;
  }

  /*
   * Decide which merged entries get read out. Called after every merge, from
   * both the SSE path and the poll path, so it does not matter which delivered
   * the reply. Everything present at boot is marked spoken without speaking it:
   * reading the whole backlog aloud on each refresh would be intolerable.
   */
  function harvestSpeech() {
    var list = freshAgent;
    freshAgent = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (spoken[e.id]) continue;
      spoken[e.id] = true;
      if (!booted) continue;
      // The vibration fallback rides the same choke point as speech: an agent
      // reply is caught here whether it arrived by SSE or by a poll, and only
      // once. It is a no-op when push is armed, so one event is one buzz.
      signalArrival(e);
      if (!speakOn) continue;
      // Only the conversation on screen is read aloud. Hearing an answer to
      // something in a thread you are not looking at is disorienting, and the
      // menu already flags that it arrived.
      if (e.conversationId && e.conversationId !== activeConv) continue;
      var text = speakable(e.text);
      if (text) speakQueue.push(text);
    }
    speakPump();
  }

  function speakPump() {
    if (speaking || !speakQueue.length) return;
    if (!speakOn) { speakQueue = []; return; }
    if (!audioUnlocked) { speakQueue = []; warnLocked(); return; }

    var text = speakQueue.shift();
    speaking = true;
    spkBtn.className = 'on busy';
    // DEFENCE 1-3, taken before a single sample can play. Deliberately closed for
    // the whole turn — synthesis included — rather than at playback start: it
    // costs a second of listening but removes any window where playback could
    // begin part-way through an utterance we were already recording.
    gateMic(true);
    vStatus('Getting the reply ready…', 'speaking');
    ttsFetch(text)
      .then(function (buf) {
        if (!speakOn) return null; // muted while it was being synthesised
        vStatus('Speaking — mic off.', 'speaking');
        // Recorded before playback, not after: if the gate leaks, the echo
        // arrives while we are still talking, and defence 5 must already know.
        lastSpokenText = text;
        lastSpokenAt = Date.now();
        return play(buf);
      })
      .then(function () { lastSpokenAt = Date.now(); })
      .catch(function (err) {
        var m = (err && err.message) || 'playback failed';
        showErr('Could not speak the reply — ' + m + '. It is on screen above; the microphone is unaffected.', true);
        logClient('tts-failed', { message: m });
      })
      .then(function () {
        speaking = false;
        spkBtn.className = speakOn ? 'on' : '';
        releaseMic();
        speakPump();
      });
  }

  function ttsFetch(text) {
    return fetch('/tts', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: text })
    }).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return null; }).then(function (j) {
          throw new Error((j && j.error) || ('HTTP ' + r.status));
        });
      }
      return r.arrayBuffer();
    });
  }

  /*
   * DEFENCE 1 + 3. `enabled = false` makes the browser hand us digital silence at
   * the track level, which holds even if every line of JS above is wrong, and
   * whatever was half-captured is thrown away so no fragment can be stitched onto
   * the next utterance.
   */
  function gateMic(on) {
    micGated = !!on;
    var s = vox;
    if (s) {
      try {
        var tracks = s.stream.getAudioTracks ? s.stream.getAudioTracks() : s.stream.getTracks();
        for (var i = 0; i < tracks.length; i++) tracks[i].enabled = !micGated;
      } catch (e) { /* the JS-level gate in onFrame still holds */ }
      resetUtterance(s, true); // and re-measure the room once we are listening again
    }
    if (convOn) convoBtn.className = micGated ? 'on gated' : 'on';
    if (micGated) meter.style.width = '0%';
  }

  /* DEFENCE 4. Reverb, Bluetooth latency and speaker ring-out all outlive `onended`. */
  function releaseMic() {
    setTimeout(function () {
      if (speaking) return; // the next reply started; it owns the gate now
      gateMic(false);
      idleStatus();
    }, C.SETTLE_MS);
  }

  function ensurePlayCtx() {
    if (playCtx) return playCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { playCtx = new AC(); } catch (e) { return null; }
    return playCtx;
  }

  /*
   * iOS Safari will not make a sound unless playback has first been started
   * inside a real user gesture, and Chrome's autoplay policy is nearly as
   * strict. So the tap that turns on the speaker or starts a conversation spends
   * itself unlocking audio: resume the context and push one silent buffer
   * through it. Everything after that is allowed to play on its own.
   */
  function unlockAudio() {
    var ctx = ensurePlayCtx();
    if (!ctx) return false;
    try { if (ctx.state === 'suspended' && ctx.resume) ctx.resume(); } catch (e) {}
    try {
      var src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) { /* the resume alone is often enough */ }
    audioUnlocked = true;
    return true;
  }

  function warnLocked() {
    if (audioWarned) return;
    audioWarned = true;
    showErr('Spoken replies need one tap first — browsers only let audio start from a tap, ' +
      'so nothing can be played until you press the speaker button. Press it and the next reply is read out.', true);
    logClient('tts-locked', { reason: 'no user gesture yet' });
  }

  /** decodeAudioData is a promise in modern browsers and a callback in old Safari. */
  function decode(ctx, buf) {
    return new Promise(function (resolve, reject) {
      var p;
      try { p = ctx.decodeAudioData(buf, resolve, reject); } catch (e) { reject(e); return; }
      if (p && p.then) p.then(resolve, reject);
    });
  }

  /** Resolves when the reply has finished playing (or has been cut short). */
  function play(buf) {
    var ctx = ensurePlayCtx();
    if (!ctx || !ctx.decodeAudioData) return playViaElement(buf);
    return decode(ctx, buf).then(function (audio) {
      return new Promise(function (resolve) {
        var token = ++playToken;
        var src = ctx.createBufferSource();
        src.buffer = audio;
        src.connect(ctx.destination);
        src.onended = function () { if (playing && playing.token === token) playing = null; resolve(); };
        playing = { token: token, stop: function () { try { src.stop(0); } catch (e) { resolve(); } } };
        try { if (ctx.state === 'suspended' && ctx.resume) ctx.resume(); } catch (e) {}
        src.start(0);
      });
    }).catch(function () {
      return playViaElement(buf); // Web Audio refused it; try the plain element
    });
  }

  /** Fallback path: a blob URL in an <audio> element (CSP already allows blob: media). */
  function playViaElement(buf) {
    if (!window.Audio || !window.Blob || !window.URL || !URL.createObjectURL) {
      return Promise.reject(new Error('this browser cannot play audio'));
    }
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
      var token = ++playToken;
      var el = new Audio(url);
      var cleanup = function () { try { URL.revokeObjectURL(url); } catch (e) {} };
      var done = function () { cleanup(); if (playing && playing.token === token) playing = null; resolve(); };
      playing = { token: token, stop: function () { try { el.pause(); } catch (e) {} done(); } };
      el.onended = done;
      el.onerror = function () { cleanup(); reject(new Error('the browser could not play the audio')); };
      var p = el.play();
      if (p && p.catch) p.catch(function (e) { cleanup(); reject(e); });
    });
  }

  function stopSpeaking() {
    speakQueue = [];
    var p = playing;
    playing = null;
    playToken++;
    if (p) { try { p.stop(); } catch (e) {} }
  }

  function pref(key, val) {
    try {
      if (val === undefined) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, val);
    } catch (e) { /* private mode or storage disabled: the toggle just will not persist */ }
    return null;
  }

  function setSpeak(on, remember) {
    speakOn = !!on;
    spkBtn.className = speakOn ? 'on' : '';
    spkBtn.setAttribute('aria-pressed', speakOn ? 'true' : 'false');
    var label = speakOn ? 'Spoken replies are on' : 'Spoken replies are off';
    spkBtn.title = label;
    spkBtn.setAttribute('aria-label', label);
    if (remember) pref('relay.speak', speakOn ? '1' : '0');
    if (!speakOn) stopSpeaking(); // muting cuts the current reply off mid-word, on purpose
  }

  function initVoice() {
    if (!micBtn) return;
    var blocked = micBlockedReason();
    if (blocked) {
      markMicBlocked(blocked);
      markBlocked(convoBtn, blocked);
      // Reported without waiting for a tap, so "the mic didn't work" is already
      // in the server log by the time anyone asks about it.
      logClient('mic-blocked-on-load', { reason: blocked, origin: location.origin });
    }
    micBtn.addEventListener('click', startVoice);

    // Spoken replies need neither a microphone nor a secure context, so the
    // speaker still works on the plain-http LAN page where the mic cannot.
    if (spkBtn) {
      setSpeak(pref('relay.speak') === '1', false);
      /*
       * `speakOn` is remembered across reloads; `audioUnlocked` cannot be,
       * because every browser demands a fresh gesture per page load. So a
       * remembered "speaker on" produced a sticky "spoken replies need one tap
       * first" banner on every single load — it appears twenty times in one
       * evening of logs, which is also how we know how often this page is
       * being reloaded. Spend the first real gesture, whatever it is, rather
       * than insisting on one particular button. Only wired when the speaker
       * is already on: nobody who has not asked for audio should have an
       * AudioContext created behind their back.
       */
      if (speakOn) {
        var unlockOnce = function () {
          ['pointerdown', 'touchstart', 'keydown'].forEach(function (t) {
            document.removeEventListener(t, unlockOnce, true);
          });
          try { unlockAudio(); } catch (e) { /* the speaker button still works */ }
        };
        ['pointerdown', 'touchstart', 'keydown'].forEach(function (t) {
          document.addEventListener(t, unlockOnce, true);
        });
      }
      spkBtn.addEventListener('click', function () {
        var on = !speakOn;
        if (on) unlockAudio(); // must happen inside the gesture to count
        setSpeak(on, true);
      });
    }
    if (convoBtn) {
      convoBtn.addEventListener('click', function () {
        if (convOn) { stopConversation('user'); return; }
        unlockAudio(); // the deliberate tap that buys us playback for the session
        if (pref('relay.speak') === null) setSpeak(true, true); // conversing implies hearing
        startConversation();
      });
    }
    if (stopBtn) stopBtn.addEventListener('click', function () { stopConversation('user'); });
  }

  /*
   * ============================================================ the phone shell
   *
   * Everything below is about the one device this page is actually read on, and
   * it is kept in a single block on purpose so it can be moved or reverted
   * whole. Three complaints, and — this is the part that took a while to see —
   * only about one and a half separate causes.
   *
   *   "the app lets me zoom and that gets me lost"
   *   "I sometimes lose my side of the chat controls"
   *   "don't ever hide my text controls, they hide when I scroll"
   *
   * WHAT IS ACTUALLY HAPPENING. There are two viewports. The LAYOUT viewport is
   * what `innerHeight`, `vh`/`dvh` and this page's fixed-height flex column are
   * measured against. The VISUAL viewport is the part of it you can currently
   * see. Pinch to zoom, or raise the on-screen keyboard, and the visual viewport
   * shrinks and can be panned around inside the layout viewport — which the
   * layout knows nothing about. The composer is pinned to the bottom of the
   * layout viewport, so it stays exactly where it was and simply stops being on
   * screen. Panning a zoomed page is, to the person doing it, "scrolling".
   *
   * And it is unrecoverable rather than merely annoying because `body` is
   * `overflow: hidden`, which CSS propagates to the viewport: the page has no
   * root scroller at all (measured: documentElement.scrollHeight ===
   * clientHeight, window.scrollTo() is a no-op). There is nothing to scroll to
   * bring the controls back. You have to know to pinch out again.
   *
   * So the zoom lock is not a separate nicety from the vanishing composer; it
   * removes the most likely way of triggering it. fitToKeyboard() is the safety
   * net for every other way — the keyboard, or any browser that ignores the
   * meta tag — and it works from the visual viewport directly, which is the one
   * number that cannot lie about what is on screen.
   */

  /* ---- zoom, locked ------------------------------------------------------
   * `user-scalable=no` in the meta tag is advisory: iOS Safari ignores it
   * outright, and Chrome ignores it whenever "force enable zoom" is set in
   * accessibility settings. `touch-action: manipulation` on the body kills
   * double-tap zoom; these two listeners kill the pinch. One-finger touchmove
   * is never touched, so scrolling still scrolls and selecting still selects.
   */
  function initNoZoom() {
    var stop = function (e) { if (e.cancelable) e.preventDefault(); };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
      document.addEventListener(t, stop, { passive: false });
    });
    document.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches.length > 1) stop(e);
    }, { passive: false });
  }

  /* ---- the composer stays on screen, whatever the browser is doing -------
   * `interactive-widget=resizes-content` in the meta tag asks Chrome 108+ to
   * shrink the layout viewport when the keyboard opens, which makes the flex
   * column re-lay-out above it and is the whole fix where it is honoured. iOS
   * Safari does not honour it, older Chrome does not either, and neither will
   * tell us. So: measure. If the visible area is meaningfully shorter than the
   * layout viewport, size the body to what is visible; the flex column does the
   * rest and the composer comes back above the keyboard.
   *
   * `offsetTop` is in there because the browser may already have panned the
   * visual viewport down; the body's bottom edge has to land at the bottom of
   * what is visible, in layout coordinates.
   *
   * Deliberately NOT applied while zoomed (`scale > 1`): shrinking the page in
   * response to a zoom would be a fight the user cannot win. Zoom is blocked
   * above; if some browser allows it anyway, leave the layout alone.
   */
  var vvFitted = false;
  var vvQueued = false;

  function fitToKeyboard() {
    vvQueued = false;
    var vv = window.visualViewport;
    if (!vv) return;
    /*
     * How much of the layout viewport is hidden BELOW what can be seen. The
     * `offsetTop` term is what makes this the occluded height rather than
     * merely the shortfall: a visual viewport that has been panned down is
     * already showing the bottom of the layout, and needs no help.
     */
    var occluded = window.innerHeight - (vv.height + vv.offsetTop);
    // 24px, not 0: sub-pixel rounding is normal and must not start a fight.
    if (occluded > 24 && !(vv.scale > 1.01)) {
      var px = Math.max(180, Math.round(vv.height + vv.offsetTop)) + 'px';
      if (document.body.style.height !== px) {
        document.body.style.height = px;
        // Only on the way in, or every pan while the keyboard is up would yank
        // him back to the bottom of a thread he is trying to read.
        if (!vvFitted) { vvFitted = true; scrollBottom(); }
      }
    } else if (vvFitted) {
      document.body.style.height = '';
      vvFitted = false;
      scrollBottom();
    }
  }

  function queueFit() {
    if (vvQueued) return;
    vvQueued = true;
    requestAnimationFrame(fitToKeyboard);
  }

  function initKeyboardFit() {
    var vv = window.visualViewport;
    if (!vv) return; // no way to know; the meta tag is then the only defence
    vv.addEventListener('resize', queueFit);
    vv.addEventListener('scroll', queueFit);
    queueFit();
  }

  /* ---- back closes what is open -----------------------------------------
   * Android's back gesture on a one-screen app has nothing to go back to, so it
   * leaves — even when what he meant was "shut this drawer". Conversation
   * switches already earn a history entry (see setUrl), so back already walks
   * the conversations he has visited. What was missing is the layer above:
   * an open overlay has to be the first thing back consumes.
   *
   * At most one overlay is ever open — showStatus() shuts the drawer on its way
   * in — so this is one marker, not a stack. One boolean is far easier to keep
   * honest than an array that can drift out of step with the DOM.
   *
   * THE INVARIANT: `uiMarked` is true exactly when we have pushed one history
   * entry standing for "something is open". Every way of closing an overlay —
   * the X, the scrim, Escape, picking a conversation — runs through uiSync() or
   * setUrl(), so the entry is always spent. Get that wrong and five taps on the
   * X leave five dead entries behind, and then back does nothing five times,
   * which is worse than the bug being fixed.
   */
  var uiMarked = false;  // we own one history entry meaning "an overlay is open"
  var uiPending = 0;     // history.back() calls whose popstate has not arrived

  function uiSync() {
    /*
     * The lightbox is the first thing here that can sit ON TOP of another
     * overlay — it opens from the gallery as well as from the thread. The one
     * marker still holds, and without a second line of code, because every
     * hide* calls back into uiSync(): closing the top one re-pushes a marker
     * while the one underneath is still open, so back keeps consuming layers
     * one at a time and only leaves the app when the last is gone.
     */
    var open = !!statusOn || !!actOn || !!drawerOpen || !!galOn || !!agOn || !!lightOn || !!shareOn;
    if (open === uiMarked) return; // includes drawer -> status, which re-uses it
    if (open) {
      // Same URL on purpose: a marker must not look like a conversation change,
      // or onUrlChange would try to switch to the one we are already in.
      try {
        history.pushState({ relayOverlay: 1 }, '', location.href);
        uiMarked = true;
      } catch (e) { /* no History API: back leaves the app, exactly as before */ }
      return;
    }
    // Closed by the UI rather than by back, so spend the entry ourselves.
    uiMarked = false;
    uiPending++;
    try { history.back(); } catch (e) { uiPending--; return; }
    // A popstate that never arrives must not swallow the next real back press.
    setTimeout(function () { if (uiPending > 0) uiPending--; }, 2000);
  }

  function onUiPop() {
    if (uiPending > 0) { uiPending--; return; }  // the echo of our own back()
    if (!uiMarked) return;                       // not ours: let it be a conversation move
    uiMarked = false;
    // Topmost first, in the order they stack on screen. All of them call
    // uiSync(), which sees the marker spent — and re-arms it if a lower layer
    // is still open.
    if (lightOn) hideLightbox();
    else if (shareOn) hideShare();
    else if (agOn) hideAgents();
    else if (galOn) hideGallery();
    else if (actOn) hideActivity();
    else if (statusOn) hideStatus();
    else if (drawerOpen) closeDrawer();
  }

  function initMobileShell() {
    initNoZoom();
    initKeyboardFit();
    window.addEventListener('popstate', onUiPop);
  }

  // First, before anything that could itself fail: report the previous session
  // if it never came back, and start listening for errors in this one.
  try { initCrashWatch(); } catch (e) { /* never let telemetry take the page down */ }

  // The queue UI boots first and does not depend on any of the audio code above.
  setInterval(refreshTimes, 30000);
  initConvs();
  initStatus();
  // Guarded like every other non-load-bearing feature here: reading and sending
  // messages must not depend on the activity panel wiring itself up.
  try {
    initActivity();
  } catch (err) {
    logClient('activity-init-failed', { message: (err && err.message) || String(err) });
  }
  // Same guard, same reason: a picture is a bonus, and reading and sending
  // messages must not depend on the gallery wiring itself up.
  try {
    initGallery();
  } catch (err) {
    logClient('gallery-init-failed', { message: (err && err.message) || String(err) });
  }
  // Same guard again: publishing a snapshot is a bonus, and reading and sending
  // messages must not depend on the share panel wiring itself up.
  try {
    initShare();
  } catch (err) {
    logClient('share-init-failed', { message: (err && err.message) || String(err) });
  }
  // ...and typing must not depend on the attach button wiring itself up either.
  try {
    initAttach();
  } catch (err) {
    logClient('attach-init-failed', { message: (err && err.message) || String(err) });
  }
  // The roster is how he reaches a worker at all, but it is still not the
  // messaging app, so it gets the identical guard.
  try {
    initAgents();
  } catch (err) {
    logClient('agents-init-failed', { message: (err && err.message) || String(err) });
  }
  // Zoom lock, keyboard-aware composer, back-closes-the-overlay. After the
  // views exist, because it drives them; guarded, because none of it is
  // load-bearing for reading and sending messages.
  try { initMobileShell(); } catch (err) {
    logClient('mobile-shell-init-failed', { message: (err && err.message) || String(err) });
  }
  // Builds the panel and reads the current state. Requests no permission —
  // that happens only when he taps the button inside it.
  try {
    initNotify();
  } catch (err) {
    logClient('notify-init-failed', { message: (err && err.message) || String(err) });
  }
  /*
   * Offline reading. Defensive for the same reason voice is: a browser that
   * cannot register a worker must still be a working messaging app, and this
   * runs before the first read so the worker is on its way while it happens.
   */
  try {
    initOffline();
  } catch (err) {
    logClient('offline-init-failed', { message: (err && err.message) || String(err) });
  }
  render();
  autosize();
  focusComposer();
  // `booted` flips only after the first read has landed, which is what stops the
  // existing thread from being read aloud on every refresh.
  poll(true).then(function () { booted = true; }).then(schedule);
  openStream();

  // Voice is wired last and defensively: this is a messaging app with dictation
  // bolted on, and no audio API a browser lacks may be allowed to take the
  // messaging half down with it.
  try {
    initVoice();
  } catch (err) {
    if (micBtn) {
      micBtn.className = 'off';
      micBtn.title = 'Dictation could not start up in this browser.';
    }
    logClient('voice-init-failed', { message: (err && err.message) || String(err) });
  }
})();
</script>
</body>
</html>
